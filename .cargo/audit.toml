# Configuration for `cargo audit`, run by `scripts/check-rust-dependencies.sh`.
# Every entry in `ignore` must be paired with exactly one proof line, in one of
# two forms:
#
#     # <ADVISORY-ID> unreachable = "<crate>@<version>"
#     # <ADVISORY-ID> blocked-upstream = "<crate>@<version>" report = "<url>"
#
# `scripts/check-rust-dependencies.sh` re-derives the proof on every run with
# `cargo tree --invert`. The two forms expire in opposite directions, and
# neither can be written to mean "ignore this forever":
#
#   * `unreachable` fails the moment the crate *enters* the build graph, and
#     just as loudly once the version leaves `Cargo.lock` and the entry is
#     merely stale;
#   * `blocked-upstream` fails the moment the crate *leaves* the build graph --
#     which is exactly when the upstream fix has landed and the entry should go.
#
# An ignore without a proof line is a hard error, and so is an ignore carrying
# both.
#
# RUSTSEC-2026-0543 blocked-upstream = "chrono@0.4.45" report = "https://github.com/link-foundation/command-stream/issues/238"
#   This is an unmaintained notice, not a claim of a known exploitable defect.
#   The advisory affects every Chrono version and has `patched = []`:
#   https://github.com/RustSec/advisory-db/blob/main/crates/chrono/RUSTSEC-2026-0543.md
#   The current lockfile reaches Chrono through command-stream 1.5.3 and
#   link-calculator 0.22.0. On 2026-11-20, command-stream merged its Jiff
#   migration (PR #240), but crates.io still publishes 1.13.0 with Chrono.
#   Calculator's migration report #265 remains open; its latest published
#   0.24.0 still requires Chrono. Both dependency paths must be removed before
#   this exception can expire. A source fix alone is not a published release.
#   The maintainer's deprecation report confirms the upstream state:
#   https://github.com/chronotope/chrono/issues/1768
#   Migration is reported to both dependency owners:
#   https://github.com/link-foundation/command-stream/issues/238
#   https://github.com/link-assistant/calculator/issues/265
#   Retain the existing blocked-upstream policy: CI must prove this exact crate
#   still reaches the build graph, and fails when the proof becomes stale.
#   Removing Chrono from both dependency paths remains unfinished work; this
#   entry records the blocker and does not claim a dependency migration.
#   Vulnerabilities, unsoundness, yanked releases and every other warning remain fatal.
[advisories]
ignore = ["RUSTSEC-2026-0543"]
