[package]
name = "command-stream"
version = "1.13.0"
edition = "2021"
authors = ["link-foundation"]
description = "Modern shell command execution library with streaming, async iteration, and event support"
license = "Unlicense"
repository = "https://github.com/link-foundation/command-stream"
keywords = ["shell", "command", "streaming", "async", "process"]
categories = ["command-line-utilities", "asynchronous"]
readme = "README.md"
exclude = ["benchmarks/**"]

[lib]
name = "command_stream"
path = "src/lib.rs"

[[bin]]
name = "command-stream"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["full", "process", "signal"] }
async-trait = "0.1.92"
thiserror = "2.0.21"
once_cell = "1.21.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
nix = { version = "0.31.3", features = ["signal", "process", "fs"] }
libc = "0.2.191"
which = "8.0.6"
glob = "0.3.4"
chrono = "0.4.45"
filetime = "0.2.29"
portable-pty = "0.9.0"
vt100 = "0.18.1"
# recording.gif: frames are rasterised with 8x8 bitmap glyphs and encoded
# without an SVG rasteriser or font loader.
gif = { version = "0.14.2", default-features = false, features = ["std"] }
font8x8 = "0.3.1"

meta-language = { version = "1.0.0", default-features = false }

tree-sitter = "0.27.0" # meta-language 1.0.0 exact pin: https://github.com/link-foundation/meta-language/issues/197
tree-sitter-javascript = "0.25.0"

[dev-dependencies]
tokio-test = "0.4.6"
# Verify processing results against Tokio's generic stream adapters.
tokio-stream = { version = "0.1.19", features = ["time"] }
tempfile = "3.27.0"
assert_cmd = "2.2.2"
# JS-compatible regexes (backreferences) for the Bun Shell conformance corpus.
fancy-regex = "0.20.0"
# The corpus nests some values deeper than serde_json's default limit of 128.
serde_json = { version = "1.0.154", features = ["unbounded_depth"] }

[features]
default = []
json = []

# Lint policy. `cargo clippy` and `cargo build` only *report* warnings, so the
# `-D warnings` in .github/workflows/rust.yml is what turns these into a failing
# build. Both halves are needed: this section makes the policy visible to local
# builds and to `cargo clippy --fix`, the workflow makes it enforceable.
[lints.rust]
# The crate contains no `unsafe` block today (nix/libc are used through their
# safe wrappers); `forbid` keeps it that way and cannot be locally overridden.
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
