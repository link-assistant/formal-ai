name: Issue 1028 Agent CLI binary-tree ladder

# Issue #1085 (D4): the ladder runs on pull requests that touch it or the
# agentic coding modules (leaf level), weekly over every level, and on
# dispatch. The deepest level whose nodes all pass is compared with
# data/meta/ladder-ratchet.lino and may only move deeper.
#
# PR #1188: the depth-five run measured its 32 leaves one after another in one
# job, 72-82 minutes (runs 37652295748, 37663996930; ~250s per passing leaf).
# Leaves are independent -- each starts from a reset worktree and only a
# depth-4 composite reads its children's effects -- so the default run is now
#   plan     consults the green ledger (lookup only), warms the binary cache
#            and lists the legs: sixteen depth-4 subtrees of two leaves each
#            for depth five, and individual requirement nodes in all mode;
#   ladder   one leg per subtree, each the unchanged run.sh with NODE_FILTER;
#   compare  green only when every leg succeeded (check-shard-results.sh), the
#            legs join into one run (combine-shards.py refuses a missing or
#            overlapping leg), and that run holds the recorded ratchet. Its
#            success, not the plan's, records the inputs green.
# Weekly all mode measures every node in bounded independent legs. Leaves
# and requirement nodes run in parallel; depth-four composites consume this
# run's validated leaf effects and diffs in a second artifact-fed wave.
# The final join checks the exact 63-node plan, corpus and source identity.
on:
  # Issue #1187 R2: a bot pull request's checks start through dispatch
  # (.github/actions/dispatch-checks); mode and pull-request are its inputs.
  workflow_dispatch:
    inputs:
      mode:
        description: 'checks: run the pull-request checks on the dispatched branch'
        required: false
        default: checks
        type: choice
        options: [checks]
      pull-request:
        description: 'Pull request the dispatched checks report for'
        required: false
        default: ''
        type: string
      depth:
        description: 'Tree depth to verify: 0=root, 1=2 nodes, 2=4, 3=8, 4=16, 5=32, all=5..0'
        required: false
        default: '5'
        type: choice
        options: ['0', '1', '2', '3', '4', '5', 'all']
      node_filter:
        description: 'Optional node path (for example 2.1.2.2.1)'
        required: false
        default: ''
        type: string
      skip_build:
        description: 'Skip cargo build --manifest-path rust/Cargo.toml only when a compatible release binary is already present'
        required: false
        default: false
        type: boolean
      authored_rules:
        description: 'Per-leaf authored mappings visible to the agent'
        required: false
        default: 'disabled'
        type: choice
        options: ['disabled', 'enabled']
  pull_request:
    # Issue #1187 R4: an isolated e2e/<purpose>/<run>/<name> pull request
    # never triggers this repository's own pipeline.
    branches-ignore: ['e2e/**']
    paths:
      - 'experiments/issue_1028_agent_cli_ladder/**'
      - 'rust/src/agentic_coding/**'
      - 'data/meta/ladder-ratchet.lino'
      - '.github/workflows/issue-1028-agent-ladder.yml'
  schedule:
    - cron: '23 3 * * 0'

permissions:
  contents: read

concurrency:
  group: issue-1028-agent-cli-binary-tree-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan the Agent CLI ladder
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      already-green: ${{ steps.ledger.outputs.already-green }}
      legs: ${{ steps.plan.outputs.legs || '[]' }}
      leg-count: ${{ steps.plan.outputs.leg-count }}
      composites: ${{ steps.plan.outputs.composites || '[]' }}
    env:
      TREE_DEPTH: ${{ inputs.depth || (github.event_name == 'schedule' && 'all') || '5' }}
      NODE_FILTER: ${{ inputs.node_filter || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Lookup only (`record: 'false'`): a green plan says nothing about the
      # ladder, so the compare job records the verdict for these inputs.
      - name: Skip when identical inputs already passed
        id: ledger
        uses: ./.github/actions/green-ledger
        with:
          check: agent-ladder-1028-depth-${{ inputs.depth || (github.event_name == 'schedule' && 'all') || '5' }}-rules-${{ inputs.authored_rules || (github.event_name == 'schedule' && 'disabled') || 'enabled' }}-node-${{ inputs.node_filter || 'none' }}
          paths: >-
            rust/src data rust/build.rs rust/Cargo.toml rust/Cargo.lock experiments/issue_1028_agent_cli_ladder scripts .github/workflows/issue-1028-agent-ladder.yml .github/actions
          enabled: ${{ github.ref != 'refs/heads/main' }}
          record: 'false'

      - name: List the ladder legs
        id: plan
        if: ${{ steps.ledger.outputs.already-green != 'true' }}
        run: |
          set -euo pipefail
          plan=$(python3 experiments/issue_1028_agent_cli_ladder/plan-legs.py "$TREE_DEPTH" "$NODE_FILTER")
          {
            echo "legs=$(jq -c '.legs' <<< "$plan")"
            echo "composites=$(jq -c '.composites' <<< "$plan")"
            echo "leg-count=$(jq '(.legs | length) + (.composites | length)' <<< "$plan")"
          } >> "$GITHUB_OUTPUT"
          echo "$plan"

      # Reused across every workflow that only needs to *run* the binary: the
      # cache key is the content of the sources it is built from, so a push that
      # changed neither pays nothing (issue #1107). Warmed once here so every
      # leg restores it instead of each compiling it.
      - uses: ./.github/actions/formal-ai-binary
        if: ${{ (inputs.skip_build != true) && steps.ledger.outputs.already-green != 'true' }}

  ladder:
    name: Agent CLI ladder ${{ matrix.leg.id }}
    needs: [plan]
    if: ${{ needs.plan.outputs.already-green != 'true' }}
    runs-on: ubuntu-latest
    # Both complete cold all-mode runs (37870805740 and 37870809771)
    # measured every full job and step below 30 minutes, including setup and
    # upload. Maximum full jobs: 1110s disabled, 1024s enabled. This retires
    # the old 135-minute exception; semantic task failures remain visible.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    env:
      TREE_DEPTH: ${{ matrix.leg.depth }}
      NODE_FILTER: ${{ matrix.leg.filter }}
      # A fresh directory, not the committed evidence under docs/: the compare
      # job joins exactly what this leg measured.
      OUT: ${{ github.workspace }}/agent-tree-run
      LINK_ASSISTANT_AGENT_SUMMARIZE_SESSION: "false"
      AUTHORED_RULES: ${{ inputs.authored_rules || (github.event_name == 'schedule' && 'disabled') || 'enabled' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      # Each leaf's edit is compiled by verify-node.sh; the dependency crates
      # are the same on every leg, so the first leaf of each leg restores them
      # from the shared compiler cache instead of compiling them cold.
      - uses: ./.github/actions/setup-sccache

      # verify-node.sh compiles every leaf's edit, so the toolchain must meet
      # the crate's rust-version whether or not the binary came from cache:
      # formal-ai-binary installs one only on a cache miss, and a runner image
      # still on rustc 1.98.1 failed thirteen leaves as uncompilable (run
      # 37710079109) although their edits were valid.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/formal-ai-binary
        if: ${{ inputs.skip_build != true }}

      - name: Install pinned Agent CLI
        run: bun add -g @link-assistant/agent@0.26.0

      - name: Run recursive Agent CLI tree
        id: tree
        env:
          AGENT: agent
          TEST_BUDGET_SECONDS: 1200
        run: |
          scripts/run-with-budget-warning.sh \
            "$TEST_BUDGET_SECONDS" "Agent CLI primary verification" \
            experiments/issue_1028_agent_cli_ladder/run.sh

      - name: Show the Agent CLI evidence on failure
        if: failure()
        run: scripts/dump-agent-cli-evidence.sh "$OUT"

      - name: Upload tree evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-1028-agent-cli-binary-tree-${{ matrix.leg.id }}
          path: ${{ github.workspace }}/agent-tree-run
          retention-days: 3
          if-no-files-found: error

  leaf-evidence:
    name: Validate the current-run leaf evidence
    needs: [plan, ladder]
    if: ${{ !cancelled() && needs.plan.outputs.already-green != 'true' && needs.plan.outputs.composites != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_FILTER: ${{ inputs.node_filter || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Every primary leg measured its nodes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          JOBS: plan ladder
          CHECK: Agent CLI ladder primary wave
        run: bash scripts/check-shard-results.sh
      - name: Download exactly the measured leaf legs
        uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          pattern: issue-1028-agent-cli-binary-tree-depth-5-*
          path: ${{ runner.temp }}/leaf-legs
      - name: Validate and join the complete leaf dependency set
        run: |
          set -euo pipefail
          python3 experiments/issue_1028_agent_cli_ladder/plan-legs.py 5 "$NODE_FILTER" > "$RUNNER_TEMP/leaf-plan.json"
          count=$(jq '.legs | length' "$RUNNER_TEMP/leaf-plan.json")
          LADDER_SOURCE_COMMIT="$(git rev-parse HEAD)"
          LADDER_SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          export LADDER_SOURCE_COMMIT LADDER_SOURCE_TREE
          python3 experiments/issue_1028_agent_cli_ladder/combine-shards.py \
            "$RUNNER_TEMP/leaf-legs" "$RUNNER_TEMP/current-leaves" "$count" "$RUNNER_TEMP/leaf-plan.json"
      - name: Upload validated leaves for the composite wave
        uses: actions/upload-artifact@v7
        with:
          name: issue-1028-agent-cli-current-leaves
          path: ${{ runner.temp }}/current-leaves
          retention-days: 3
          if-no-files-found: error

  composites:
    name: Agent CLI composite ${{ matrix.leg.id }}
    needs: [plan, leaf-evidence]
    if: ${{ !cancelled() && needs.plan.outputs.already-green != 'true' && needs.plan.outputs.composites != '[]' }}
    runs-on: ubuntu-latest
    # One composite per machine; verification consumes only the current
    # run's two validated child effects and diffs.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.composites) }}
    env:
      TREE_DEPTH: ${{ matrix.leg.depth }}
      NODE_FILTER: ${{ matrix.leg.filter }}
      # A fresh directory, not the committed evidence under docs/: the compare
      # job joins exactly what this leg measured.
      OUT: ${{ github.workspace }}/agent-tree-run
      LINK_ASSISTANT_AGENT_SUMMARIZE_SESSION: "false"
      AUTHORED_RULES: ${{ inputs.authored_rules || (github.event_name == 'schedule' && 'disabled') || 'enabled' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      # Each leaf's edit is compiled by verify-node.sh; the dependency crates
      # are the same on every leg, so the first leaf of each leg restores them
      # from the shared compiler cache instead of compiling them cold.
      - uses: ./.github/actions/setup-sccache

      # verify-node.sh compiles every leaf's edit, so the toolchain must meet
      # the crate's rust-version whether or not the binary came from cache:
      # formal-ai-binary installs one only on a cache miss, and a runner image
      # still on rustc 1.98.1 failed thirteen leaves as uncompilable (run
      # 37710079109) although their edits were valid.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/formal-ai-binary
        if: ${{ inputs.skip_build != true }}

      - name: Install pinned Agent CLI
        run: bun add -g @link-assistant/agent@0.26.0

      - name: Download validated current-run leaves
        uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: issue-1028-agent-cli-current-leaves
          path: ${{ runner.temp }}/current-leaves

      - name: Run recursive Agent CLI tree
        id: tree
        env:
          AGENT: agent
          LADDER_CHILD_EVIDENCE: ${{ runner.temp }}/current-leaves
          TEST_BUDGET_SECONDS: 1200
        run: |
          scripts/run-with-budget-warning.sh \
            "$TEST_BUDGET_SECONDS" "Agent CLI composite verification" \
            experiments/issue_1028_agent_cli_ladder/run.sh

      - name: Show the Agent CLI evidence on failure
        if: failure()
        run: scripts/dump-agent-cli-evidence.sh "$OUT"

      - name: Upload tree evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-1028-agent-cli-binary-tree-${{ matrix.leg.id }}
          path: ${{ github.workspace }}/agent-tree-run
          retention-days: 3
          if-no-files-found: error

  compare:
    name: Compare the measured ladder with the record
    needs: [plan, ladder, leaf-evidence, composites]
    # Not `always()`: a run superseded by a newer push is the one
    # cancellation that is not a defect, and it skips the verdict.
    if: ${{ !cancelled() && needs.plan.outputs.already-green != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TREE_DEPTH: ${{ inputs.depth || (github.event_name == 'schedule' && 'all') || '5' }}
      NODE_FILTER: ${{ inputs.node_filter || '' }}
      OUT: ${{ github.workspace }}/docs/case-studies/issue-1028/agent-tree-run
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Enabled off, recording on: this job never skips, and its own success
      # is what marks these inputs green for the plan job's next lookup.
      - name: Record the verdict for these inputs
        uses: ./.github/actions/green-ledger
        with:
          check: agent-ladder-1028-depth-${{ inputs.depth || (github.event_name == 'schedule' && 'all') || '5' }}-rules-${{ inputs.authored_rules || (github.event_name == 'schedule' && 'disabled') || 'enabled' }}-node-${{ inputs.node_filter || 'none' }}
          paths: >-
            rust/src data rust/build.rs rust/Cargo.toml rust/Cargo.lock experiments/issue_1028_agent_cli_ladder scripts .github/workflows/issue-1028-agent-ladder.yml .github/actions
          enabled: 'false'

      - name: Every ladder leg finished
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          JOBS: plan ladder
          CHECK: Agent CLI ladder
          COMPOSITE_LEGS: ${{ needs.plan.outputs.composites }}
        run: |
          if [[ "$COMPOSITE_LEGS" != '[]' ]]; then
            export JOBS="$JOBS leaf-evidence composites"
          fi
          bash scripts/check-shard-results.sh

      - name: Download every leg's evidence
        uses: actions/download-artifact@v8
        env:
          # v8's bundled unzip dependency still calls Buffer(); suppress only
          # that reviewed upstream diagnostic, never all Node warnings:
          # https://github.com/actions/download-artifact/issues/484
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          pattern: issue-1028-agent-cli-binary-tree-*
          path: ${{ runner.temp }}/agent-tree-legs

      # The committed evidence under $OUT is a previous run's; the joined run
      # replaces it so nothing stale is compared or uploaded.
      - name: Join the legs into one run
        env:
          LEG_COUNT: ${{ needs.plan.outputs.leg-count }}
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          LADDER_SOURCE_COMMIT="$(git rev-parse HEAD)"
          LADDER_SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          export LADDER_SOURCE_COMMIT LADDER_SOURCE_TREE
          python3 experiments/issue_1028_agent_cli_ladder/plan-legs.py "$TREE_DEPTH" "$NODE_FILTER" > "$RUNNER_TEMP/ladder-plan.json"
          python3 experiments/issue_1028_agent_cli_ladder/combine-shards.py \
            "$RUNNER_TEMP/agent-tree-legs" "$OUT" "$LEG_COUNT" "$RUNNER_TEMP/ladder-plan.json"

      # A ladder that ran and measured fewer leaves than the record is still
      # compared -- that is the regression this gate exists to catch.
      - name: Compare the measured ladder with the record
        run: |
          set -euo pipefail
          result="$OUT/ladder-result.lino"
          [[ -f "$result" ]] || { echo '::error::the run wrote no ladder-result.lino'; exit 1; }
          field() { sed -n "s/^  $1 \"\(.*\)\"$/\1/p" "$result"; }
          recorded_leaves=$(sed -n 's/^  leaf_nodes_passing //p' data/meta/ladder-ratchet.lino)
          measured_leaves=$(field leaf_nodes_passing)
          selected_leaves=$(field leaf_nodes_selected)
          authored_rules_enabled=$(field authored_rules_enabled)
          echo "leaf nodes passing: recorded $recorded_leaves, this run $measured_leaves of $selected_leaves"
          cat "$result" >> "$GITHUB_STEP_SUMMARY"
          # Only a full-width run is comparable with the record: a filtered or
          # shallower run selects fewer leaves and would always look worse.
          if [[ "$selected_leaves" == 32 && "$authored_rules_enabled" == true ]]; then
            if (( measured_leaves < recorded_leaves )); then
              echo "::error::$measured_leaves of 32 leaves passed; the record is $recorded_leaves (data/meta/ladder-ratchet.lino). A leaf Formal AI could change no longer changes."
              exit 1
            fi
            if (( measured_leaves > recorded_leaves )); then
              echo "::notice::leaf nodes passing improved to $measured_leaves; raise leaf_nodes_passing in data/meta/ladder-ratchet.lino in a reviewed commit"
            fi
          fi
          if [[ "$selected_leaves" == 32 && "$authored_rules_enabled" == false ]]; then
            measured_without_rules=$(field leaf_nodes_passing_without_authored_rules)
            recorded_without_rules=$(sed -n 's/^  leaf_nodes_passing_without_authored_rules //p' data/meta/ladder-ratchet.lino)
            if [[ "$recorded_without_rules" == not_measured ]]; then
              echo "::error::the first complete rule-disabled run measured $measured_without_rules of 32; record that exact value as leaf_nodes_passing_without_authored_rules in data/meta/ladder-ratchet.lino"
              exit 1
            fi
            if (( measured_without_rules < recorded_without_rules )); then
              echo "::error::$measured_without_rules of 32 leaves passed without authored rules; the record is $recorded_without_rules"
              exit 1
            fi
            if (( measured_without_rules > recorded_without_rules )); then
              echo "::notice::rule-disabled leaves improved to $measured_without_rules; raise leaf_nodes_passing_without_authored_rules in a reviewed commit"
            fi
          fi
          if [[ "$TREE_DEPTH" == all ]]; then
            deepest=$(field deepest_passing_level)
            recorded_depth=$(sed -n 's/^  deepest_passing_level //p' data/meta/ladder-ratchet.lino)
            echo "deepest passing level: recorded $recorded_depth, this run $deepest"
            if [[ "$recorded_depth" != none && "$deepest" == none ]]; then
              echo "::error::no level passed completely; the record is level $recorded_depth"
              exit 1
            fi
            if [[ "$recorded_depth" != none && "$deepest" != none ]] && (( deepest < recorded_depth )); then
              echo "::error::deepest passing level $deepest is shallower than the recorded $recorded_depth (level 5 is the leaves)"
              exit 1
            fi
          fi

      - name: Show the Agent CLI evidence on failure
        if: failure()
        run: scripts/dump-agent-cli-evidence.sh docs/case-studies/issue-1028/agent-tree-run
      - name: Upload tree evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-1028-agent-cli-binary-tree
          path: docs/case-studies/issue-1028/agent-tree-run
          retention-days: 14
          if-no-files-found: warn
