name: Issue 1028 Agent CLI binary-tree ladder

on:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Tree depth to verify: 0=root, 1=2 nodes, 2=4, 3=8, 4=16, 5=32, all=5..0'
        required: false
        default: '5'
        type: choice
        options: ['0', '1', '2', '3', '4', '5', 'all']
      node_filter:
        description: 'Optional node path (for example 2.1.2.2.1)'
        required: false
        default: ''
        type: string
      skip_build:
        description: 'Skip cargo build only when a compatible release binary is already present'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: issue-1028-agent-cli-binary-tree
  cancel-in-progress: false

jobs:
  ladder:
    name: Binary-tree Agent CLI ladder
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TREE_DEPTH: ${{ inputs.depth || '5' }}
      NODE_FILTER: ${{ inputs.node_filter || '' }}
      # Issue #1079: the Agent CLI summarizes a session with the head of its
      # default compaction cascade, `opencode/big-pickle`, not with the
      # session's own model. Against a local `formal-ai serve` that hosted
      # call is both unwanted and fatal -- the gateway now rejects it with
      # `Request is missing x-opencode-session`, which arrives as an unhandled
      # rejection. The harness passes `--no-summarize-session` too; this is the
      # belt to that pair of braces, and it also covers any client the ladder
      # spawns for itself.
      LINK_ASSISTANT_AGENT_SUMMARIZE_SESSION: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      # Only the registry is cached. Issue #534 forbids caching the `target`
      # tree — it is what evicted the shared compiler cache — and the step's own
      # name is the honest description of what it keeps.
      - uses: ./.github/actions/cache-cargo-registry
        with:
          prefix: issue-1028-agent-tree-

      - name: Build Formal AI
        if: ${{ inputs.skip_build != true }}
        run: cargo build --release --bin formal-ai

      - name: Install pinned Agent CLI
        run: bun add -g @link-assistant/agent@0.26.0

      - name: Run recursive Agent CLI tree
        env:
          AGENT: agent
          OUT: ${{ github.workspace }}/docs/case-studies/issue-1028/agent-tree-run
          TREE_DEPTH: ${{ env.TREE_DEPTH }}
          NODE_FILTER: ${{ env.NODE_FILTER }}
        run: experiments/issue_1028_agent_cli_ladder/run.sh

      # Issue #1079: the ladder harness redirects each rung's Agent CLI streams
      # to files under the run directory, so a failed rung leaves the job log
      # with an exit status and no cause. On failure, read them out.
      - name: Show the Agent CLI evidence on failure
        if: failure()
        run: scripts/dump-agent-cli-evidence.sh docs/case-studies/issue-1028/agent-tree-run
      - name: Upload tree evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-1028-agent-cli-binary-tree
          path: docs/case-studies/issue-1028/agent-tree-run
          retention-days: 14
          if-no-files-found: warn
