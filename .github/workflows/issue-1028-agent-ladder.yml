name: Issue 1028 Agent CLI ladder

on:
  workflow_dispatch:
    inputs:
      max_leaves:
        description: 'Maximum ladder leaves to execute (2, 4, 8, 16, 32)'
        required: false
        default: '32'
        type: choice
        options: ['2', '4', '8', '16', '32']
      leaf_filter:
        description: 'Optional leaf ID (for example L24) to run only one leaf'
        required: false
        default: ''
        type: string
      skip_build:
        description: 'Reuse the workspace build when debugging the runner (normally false)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: issue-1028-agent-ladder
  cancel-in-progress: false

jobs:
  ladder:
    name: Agent CLI temporary-copy ladder
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MAX_LEAVES: ${{ inputs.max_leaves || '32' }}
      LEAF_FILTER: ${{ inputs.leaf_filter || '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-issue-1028-agent-ladder-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-issue-1028-agent-ladder-
            ${{ runner.os }}-cargo-

      - name: Build Formal AI
        if: ${{ inputs.skip_build != true }}
        run: cargo build --release --bin formal-ai

      - name: Install pinned Agent CLI
        run: bun add -g @link-assistant/agent@0.26.0

      - name: Run Agent CLI ladder
        env:
          AGENT: agent
          OUT: ${{ github.workspace }}/docs/case-studies/issue-1028/agent-ladder-run
          LEAF_FILTER: ${{ env.LEAF_FILTER }}
        run: experiments/issue_1028_agent_cli_ladder/run.sh

      - name: Upload ladder evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-1028-agent-cli-ladder
          path: docs/case-studies/issue-1028/agent-ladder-run
          retention-days: 14
          if-no-files-found: warn
