name: Coverage
# Issue #895: coverage lives in its own workflow rather than in release.yml.
#
# Two reasons. The first is honesty: this pipeline measures two different
# denominators -- the Rust workspace and the browser production sources -- that
# must never be averaged into a single number, and a workflow named "Coverage"
# with one job per denominator makes that visible in the checks list instead of
# burying it among twenty release jobs. The second is the repository's own file
# size gate (scripts/check-file-size.rs), which caps a workflow at 2000 lines
# and documents release.yml as debt that "cannot grow": these jobs are a leaf of
# the release graph -- nothing `needs:` them -- so moving them out is
# behaviour-preserving and pays some of that debt down.
#
# The triggers, the concurrency group and the change-detection gate are the same
# contract release.yml applies, so a docs-only pull request still does not pay
# for a 25-minute instrumented build.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      verbose:
        description: >-
          Record runner CPU steal, load, memory and disk while coverage runs
          (issue #1076). Off by default; a green run gains no output from it.
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
jobs:
  # === DETECT CHANGES - determines which jobs should run ===
  # Identical to release.yml's detector, and deliberately so: a second copy of
  # the *gate* is cheap (a 5-minute job), while a second copy of the *rule* is
  # not, so both workflows call the same scripts/detect-code-changes.rs.
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch'
    outputs:
      rs-changed: ${{ steps.changes.outputs.rs-changed }}
      toml-changed: ${{ steps.changes.outputs.toml-changed }}
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
      workflow-changed: ${{ steps.changes.outputs.workflow-changed }}
      any-code-changed: ${{ steps.changes.outputs.any-code-changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install rust-script
        run: bash scripts/install-rust-script.sh
      - name: Detect changes
        id: changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: rust-script scripts/detect-code-changes.rs
  # === CODE COVERAGE ===
  # Generate and upload code coverage using cargo-llvm-cov
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Issue #812 raised this from 15 to 25, and issue #1039 to 40. Neither
    # helped, because the cap was never the right instrument: run 33955786082
    # burned all 40 minutes and GitHub reported it as `cancelled`, not
    # `failure`, so nothing turned red (issue #977). Issue #1076 measured that
    # run -- the `integration` target ran the *same 358 tests* in 1572.8s that
    # the previous day's run finished in 213.6s, on an identical runner image,
    # with the slowdown spread across every module and hitting tests that do no
    # I/O at all. The host was slower, not the code.
    #
    # So the cap goes back to being a backstop and the step below owns the
    # deadline: `TEST_BUDGET_SECONDS: 2400` is 40 minutes, above the 33.8-minute
    # worst case measured across the last twenty-one green runs so an
    # ordinarily slow runner still passes, and 66% of this 60-minute cap, inside
    # the 70% share issue #1017 enforces so checkout, the toolchain,
    # cargo-llvm-cov's install, the ratchet and the uploads all still fit.
    timeout-minutes: 60
    needs: [detect-changes]
    if: |
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.rs-changed == 'true' ||
        needs.detect-changes.outputs.toml-changed == 'true'
      )
    # Issue #1076. The diagnostics switch belongs to the job, not to four
    # separate steps: `.github/actions/cache-cargo-registry` reports its cache
    # outcome under it too, and a composite action reads the environment its
    # job exports rather than an `env:` block on some other step. Off unless a
    # `workflow_dispatch` input or the `FORMAL_AI_CI_VERBOSE` repository
    # variable turns it on, so an ordinary green run gains no output.
    env:
      FORMAL_AI_CI_VERBOSE: ${{ inputs.verbose || vars.FORMAL_AI_CI_VERBOSE || 'false' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-unknown-unknown

      - uses: ./.github/actions/setup-sccache

      # Issue #1076: the inline block this replaces restored only
      # `Linux-cargo-coverage-*`, so run 33955786082 missed both its exact key
      # and its one restore key and compiled every dependency from scratch. The
      # shared action (issue #1055) adds the generic `Linux-cargo-` fallback
      # that would have caught it, and stops this job's registry being a sixth
      # near-identical copy against one 10 GB repository-wide cache quota.
      - uses: ./.github/actions/cache-cargo-registry
        with:
          prefix: coverage-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Clean stale coverage artifacts
        run: cargo llvm-cov clean --workspace

      # Issue #1076. Both steps print nothing unless the job-level switch above
      # is on. Switched on, they record CPU steal, load, memory and disk once
      # before the run and every two minutes during it -- the evidence run
      # 33955786082 could not supply: a 7.4x slowdown on identical tests that
      # no log could attribute.
      - name: Report runner capacity
        run: bash scripts/report-runner-capacity.sh "before coverage"

      - name: Sample runner capacity during coverage
        run: |
          set -euo pipefail
          bash scripts/report-runner-capacity.sh --watch 120 "during coverage" &
          echo "CAPACITY_SAMPLER_PID=$!" >> "$GITHUB_ENV"

      # The step that decides this job's outcome, and the one that was killed.
      # It owns its deadline so an overrun is a `failure` with an ::error
      # annotation naming the budget, never a silent `cancelled`.
      - name: Generate code coverage
        env:
          TEST_BUDGET_SECONDS: 2400
          TEST_WARN_RATIO_PERCENT: 70
        run: |
          scripts/run-with-budget-warning.sh \
            "$TEST_BUDGET_SECONDS" "Instrumented coverage run" \
            cargo llvm-cov --all-features --lcov --output-path lcov.info

      # `kill 0` means "every process in my own process group", so a `:-0`
      # default here would make this step kill its own shell whenever the
      # sampler step was skipped -- an `if: always()` step that fails the job
      # for a diagnostic that never started. Test the variable instead.
      - name: Stop the capacity sampler
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${CAPACITY_SAMPLER_PID:-}" ]; then
            kill "${CAPACITY_SAMPLER_PID}" 2>/dev/null || true
          fi

      - name: Report runner capacity after coverage
        if: always()
        run: bash scripts/report-runner-capacity.sh "after coverage"

      # Issue #895: an LCOV file nobody reads is not a coverage requirement.
      # This step reads it, publishes a human-readable summary into the run
      # summary alongside the machine-readable JSON, and fails when the measured
      # percentage falls below the reviewed floor in coverage/baseline.json.
      - name: Install rust-script
        run: bash scripts/install-rust-script.sh

      - name: Check Rust coverage ratchet
        run: rust-script scripts/check-coverage-ratchet.rs --only rust

      - name: Retain LCOV report
        uses: actions/upload-artifact@v7
        with:
          name: rust-lcov
          path: lcov.info
          if-no-files-found: error

      - name: Publish Rust coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-rust
          path: |
            coverage/summary-rust.md
            coverage/summary-rust.json
          if-no-files-found: warn

      - name: Detect Codecov configuration
        id: codecov-config
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [[ -n "$CODECOV_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage to Codecov when configured
        if: steps.codecov-config.outputs.configured == 'true'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          disable_search: true
          plugins: noop
          fail_ci_if_error: true

      - name: Report optional Codecov integration status
        if: steps.codecov-config.outputs.configured != 'true'
        run: echo "::notice title=Codecov upload not configured::The LCOV report is retained as the rust-lcov workflow artifact; configure CODECOV_TOKEN to enable fail-closed remote upload."

  # === BROWSER CODE COVERAGE ===
  # Issue #895: the Rust denominator above says nothing about the code the
  # website actually runs. `tests/web/` executes the unbundled browser sources
  # and the worker mirror through `node:vm` under their real repository paths,
  # so V8 attributes coverage to the files the browser downloads. The two
  # denominators are ratcheted separately and never averaged: a Rust percentage
  # and a browser percentage count different things, and one number covering
  # both would be a number nobody can act on.
  browser-coverage:
    name: Browser Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes]
    if: |
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any-code-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-script
        run: bash scripts/install-rust-script.sh

      - name: Generate browser coverage
        run: npm run coverage:web

      - name: Check browser coverage ratchet
        run: rust-script scripts/check-coverage-ratchet.rs --only browser

      - name: Publish browser coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-browser
          path: |
            coverage/browser-lcov.info
            coverage/summary-browser.md
            coverage/summary-browser.json
          if-no-files-found: warn
