name: Security

on:
  push:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/README.md"
      - "**/CHANGELOG.md"
      - "changelog.d/**"
    branches: [main]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/README.md"
      - "**/CHANGELOG.md"
      - "changelog.d/**"
    # Issue #1187 R4: an isolated e2e/<purpose>/<run>/<name> pull request
    # never triggers this repository's own pipeline.
    branches-ignore: ['e2e/**']
  schedule:
    - cron: '0 6 * * 1'
  # Issue #1017: the js pipeline template exposes a manual trigger so a security
  # sweep can be re-run without waiting for Monday's cron or pushing a commit.
  # Issue #1187 R2: a bot pull request's checks start through dispatch
  # (.github/actions/dispatch-checks); mode and pull-request are its inputs.
  workflow_dispatch:
    inputs:
      mode:
        description: 'checks: run the pull-request checks on the dispatched branch'
        required: false
        default: checks
        type: choice
        options: [checks]
      codeql:
        description: 'Run read-only CodeQL producer verification on this branch'
        required: false
        default: false
        type: boolean
      macro-contexts:
        description: 'Observe Rust macro AST contexts in the read-only CodeQL run'
        required: false
        default: false
        type: boolean
      pull-request:
        description: 'Pull request the dispatched checks report for'
        required: false
        default: ''
        type: string

# Keep the workflow read-only unless a job explicitly needs an additional scope.
permissions:
  contents: read

jobs:
  codeql:
    if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || github.event_name == 'release' || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main'))) && (true) }}
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-codeql-${{ matrix.language }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      # `actions: read` is what the `actions` language extractor needs to read
      # workflow run metadata; the templates set it on the CodeQL job.
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    env: &codeql-extractor-environment
      # CodeQL CLI 2.27.4 vendors ra_ap 0.0.358 and selects Rust 1.99.0.
      # Original producer run 44710630318 proved that the old 1.94.0 sysroot
      # also supplies an incompatible proc-macro server: 406 macro failures.
      # Keep binary sysroot, rust-src and compiled dependency macros on the
      # extractor's compiler ABI; revalidate original SARIF when upgrading it.
      CODEQL_RUST_SYSROOT_TOOLCHAIN: '1.99.0'
    steps: &codeql-analysis-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Both variables are required: setting only `_SYSROOT_SRC` leaves the
      # extractor on the discovered (ambient) binary sysroot and the macro
      # failures remain. Both paths must be available before analysis: the
      # override is required for complete extraction; losing either prerequisite
      # must fail before a scan can report success with missing coverage.
      - name: Pin the extractor sysroot to a std the CodeQL bundle can parse
        if: matrix.language == 'rust'
        run: |
          set -euo pipefail
          toolchain="$CODEQL_RUST_SYSROOT_TOOLCHAIN"
          if ! rustup toolchain install "$toolchain" --profile minimal --component rust-src; then
            echo "::error title=CodeQL sysroot pin unavailable::Could not install Rust ${toolchain}. Restore the pinned toolchain or select a verified compatible sysroot (github/codeql#19982)." >&2
            exit 1
          fi
          sysroot="$(rustup run "$toolchain" rustc --print sysroot)"
          src="${sysroot}/lib/rustlib/src/rust/library"
          if [[ ! -d "$src" ]]; then
            echo "::error title=CodeQL sysroot pin unavailable::${src} is missing. Install rust-src for the pinned toolchain before analysis (github/codeql#19982)." >&2
            exit 1
          fi
          echo "CODEQL_EXTRACTOR_RUST_OPTION_SYSROOT=${sysroot}" >> "$GITHUB_ENV"
          echo "CODEQL_EXTRACTOR_RUST_OPTION_SYSROOT_SRC=${src}" >> "$GITHUB_ENV"
          echo "Pinned the Rust extractor to ${sysroot}"

      - name: Prepare standalone Rust analysis contexts
        if: matrix.language == 'rust'
        run: python3 scripts/codeql-rust-projects.py --output "${{ runner.temp }}/codeql-rust-contexts"

      - uses: github/codeql-action/init@v4
        id: codeql-init
        with:
          languages: ${{ matrix.language }}
          # Issue #1017: keeps archived evidence trees out of the extractor so a
          # truncated documentation excerpt stops emitting parse diagnostics.
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/autobuild@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: github/codeql-action/analyze@v4
        id: codeql-analyze
        with:
          output: ${{ runner.temp }}/codeql-results
          upload: ${{ github.job == 'codeql' && 'always' || 'never' }}

      - name: Observe Rust macro expansion contexts
        if: ${{ github.job == 'codeql-readonly' && matrix.language == 'rust' && inputs.macro-contexts }}
        timeout-minutes: 4
        env:
          CODEQL_BINARY: ${{ steps.codeql-init.outputs.codeql-path }}
          CODEQL_DATABASES: ${{ steps.codeql-analyze.outputs.db-locations }}
        run: >-
          python3 experiments/issue-1580/codeql-macro-contexts/observe.py
          --codeql "$CODEQL_BINARY" --databases "$CODEQL_DATABASES"
          --output "${{ runner.temp }}/codeql-results/macro-contexts"

      - name: Observe included Rust string payloads
        if: ${{ github.job == 'codeql-readonly' && matrix.language == 'rust' && inputs.macro-contexts }}
        timeout-minutes: 4
        env:
          CODEQL_BINARY: ${{ steps.codeql-init.outputs.codeql-path }}
          CODEQL_DATABASES: ${{ steps.codeql-analyze.outputs.db-locations }}
        run: >-
          python3 experiments/issue-1580/codeql-macro-contexts/observe.py
          --codeql "$CODEQL_BINARY" --databases "$CODEQL_DATABASES"
          --profile included-string-payloads
          --output "${{ runner.temp }}/codeql-results/included-string-payloads"

      - name: Reject unresolved CodeQL findings
        if: ${{ !cancelled() }}
        run: node scripts/check-codeql-results.mjs "${{ runner.temp }}/codeql-results"

      - name: Preserve CodeQL reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: codeql-results-${{ matrix.language }}-${{ github.job }}
          path: ${{ runner.temp }}/codeql-results/
          if-no-files-found: error

      - name: Preserve Rust analysis contexts
        if: ${{ !cancelled() && matrix.language == 'rust' }}
        uses: actions/upload-artifact@v7
        with:
          name: codeql-rust-contexts-${{ github.job }}
          path: |
            ${{ runner.temp }}/codeql-rust-contexts/contexts.json
            ${{ runner.temp }}/codeql-rust-contexts/rustc-version.txt*
            ${{ runner.temp }}/codeql-rust-contexts/**/*.json
            ${{ runner.temp }}/codeql-rust-contexts/**/*.json.stderr
            ${{ runner.temp }}/codeql-rust-contexts/**/*.jsonl*
            ${{ runner.temp }}/codeql-rust-contexts/**/Cargo.toml
            ${{ runner.temp }}/codeql-rust-contexts/**/Cargo.lock
            scripts/rust-project.json
            js/wasm-worker/rust-project.json
          if-no-files-found: error

  # Explicit branch verification reuses the exact producer and keeps all tokens read-only.
  # Default PR/bot dispatches stay light; only the main job uploads code-scanning state.
  codeql-readonly:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.codeql }}
    name: CodeQL producer verification (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-codeql-readonly-${{ matrix.language }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      actions: read
      contents: read
      security-events: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    env: *codeql-extractor-environment
    steps: *codeql-analysis-steps

  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-cargo-audit
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '1024'
          GIT_HTTP_LOW_SPEED_TIME: '20'
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          # `Cargo.lock` with no leading slash matches every committed lockfile
          # at any depth; the audit covers each one (#1571).
          sparse-checkout: |
            /.cargo/
            /rust/
            /scripts/check-rust-dependencies.sh
            /Cargo.toml
            Cargo.lock
            /README.md
            /LICENSE
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Issue #1017: the rust pipeline template audits the committed lockfile on
      # every push and pull request; this repository only had CodeQL and the
      # pull-request-only dependency review, so an advisory landing in a
      # transitive dependency of `Cargo.lock` went unreported on `main`. The
      # weekly `schedule:` trigger above is what makes this job worth its own
      # workflow: an advisory published against an unchanged lockfile surfaces
      # on Monday instead of waiting for the next dependency bump.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2

      - name: Audit committed Cargo.lock
        run: bash scripts/check-rust-dependencies.sh

  # The JavaScript side deliberately has no job here: the js pipeline template's
  # `npm-audit` matrix is already superseded by `scripts/check-javascript-
  # dependencies.sh`, which discovers *every* committed lockfile with `git
  # ls-files` (so a new workspace cannot be forgotten), audits `bun.lock` as well
  # as each `package-lock.json`, and fails at `--audit-level=moderate` instead of
  # `high`. Adding the template's job back would be strictly weaker duplication.

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-dependency-review
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: /.github/
          sparse-checkout-cone-mode: false

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
