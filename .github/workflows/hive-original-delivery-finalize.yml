name: Finalize original Hive generated tasks
# Only the trusted default-branch cleanup program executes. Artifact data never
# executes; exact authenticated owner/run/source custody and a durable pre-effect
# claim are required again immediately before each generated issue write.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - Original Hive Mind three-client delivery
    types:
      - completed
  schedule:
    - cron: 7,22,37,52 * * * *
permissions:
  contents: read
  actions: read
concurrency:
  group: hive-generated-cleanup-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion != 'cancelled'
      && github.event.workflow_run.head_repository.full_name ==
      github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      owners: ${{ steps.prepare.outputs.owners }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Bounded authenticated immutable effect-owner discovery
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/finalize-owned-hive-delivery-runs.mjs prepare >
          "$RUNNER_TEMP/preparation.json"

          node --input-type=module -e 'import fs from "node:fs";const plan=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/preparation.json"));fs.writeFileSync(process.env.RUNNER_TEMP+"/progress.json",JSON.stringify(plan.progress)+"\n",{flag:"wx",mode:0o600});fs.appendFileSync(process.env.GITHUB_OUTPUT,"owners="+JSON.stringify(plan.owners)+"\nprogress_name="+plan.progressName+"\n");'
      - uses: actions/upload-artifact@v7
        with:
          name: hive-cleanup-preparation
          path: ${{ runner.temp }}/preparation.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain bounded authenticated cleanup scan continuation
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepare.outputs.progress_name }}
          path: ${{ runner.temp }}/progress.json
          if-no-files-found: error
          retention-days: 3
  sweep:
    needs: prepare
    if: ${{ needs.prepare.outputs.owners != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        owner: ${{ fromJSON(needs.prepare.outputs.owners) }}
    concurrency:
      group: hive-cleanup-owner-${{ matrix.owner.run }}-${{ matrix.owner.attempt }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Recheck queued owner before publishing a cleanup claim
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_CLAIM: ${{ toJSON(matrix.owner.claim) }}
        run: node scripts/finalize-owned-hive-delivery-runs.mjs recheck >
          "$RUNNER_TEMP/preclaim.json"
      - name: Retain the authenticated pre-claim decision without cleanup credit
        if: ${{ always() && steps.recheck.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: hive-cleanup-preclaim-${{ matrix.owner.run }}-${{ matrix.owner.attempt }}
          path: ${{ runner.temp }}/preclaim.json
          if-no-files-found: error
          retention-days: 90
      - name: Persist immutable cleanup claim before issue writes
        if: ${{ steps.recheck.outputs.eligible == 'true' }}
        id: claim
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.owner.claimName }}
          path: ${{ steps.recheck.outputs.claim_path }}
          if-no-files-found: error
          retention-days: 90
      - name: Apply one fresh authenticated claimed owner without uncertain-write
          retries
        if: ${{ steps.recheck.outputs.eligible == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLAIM_ARTIFACT_ID: ${{ steps.claim.outputs.artifact-id }}
        run: node scripts/finalize-owned-hive-delivery-runs.mjs apply
          "$CLAIM_ARTIFACT_ID" > "$RUNNER_TEMP/outcome.json"
      - name: Retain terminal outcome without granting retries after uncertainty
        if: ${{ always() && steps.recheck.outputs.eligible == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: hive-cleanup-outcome-${{ matrix.owner.run }}-${{ matrix.owner.attempt }}
          path: ${{ runner.temp }}/outcome.json
          if-no-files-found: error
          retention-days: 90
    permissions:
      contents: read
      actions: read
      issues: write
