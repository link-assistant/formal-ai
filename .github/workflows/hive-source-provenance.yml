name: Hive source event provenance
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-hive-source-provenance
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  hive-source-provenance:
    name: Hive source event provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const p = 'scripts/record-hive-source-event.mjs';
            const {data} = await github.rest.repos.getContent({...context.repo, path:p, ref:context.sha, request:{timeout:20000}});
            if(data.type !== 'file' || data.encoding !== 'base64' || data.size > 65536) throw Error('invalid provenance source');
            const fs = require('node:fs'); fs.mkdirSync('scripts', {recursive:true}); fs.writeFileSync(p, Buffer.from(data.content, 'base64'), {flag:'wx'});
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Preserve minimal original source coordinates
        env:
          HIVE_SOURCE_EVENT_OUTPUT: ${{ runner.temp }}/hive-source-event/source-event.json
        run: node scripts/record-hive-source-event.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: hive-source-event-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hive-source-event/source-event.json
          retention-days: 90
          if-no-files-found: error
