name: Native type and lint check

# Issue #1191: PR #1497 passed every PR check, then main failed with E0308
# (run 43710854562) and, once that was fixed, with clippy::manual_contains
# (run 43730270231), since no PR job ran rustc. This is the one focused
# native check a PR runs: main's clippy profile on the library and binaries,
# called from release.yml on every PR, compiling when a Rust input changed
# or the classification is unknown. Only deterministic fixture data is retained;
# the focused lane publishes no products or semantic authorization.
# The isolated regressions verify native calendar, currency, OpenAI, executor and localized procedure behavior.
# Main still runs full lint, tests and every build.
on:
  workflow_call:
    inputs:
      compile-inputs-changed:
        description: Compile when inputs changed or their classification is unknown
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-native-type-check
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  clippy:
    name: Rust compile inputs changed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Report unchanged compile inputs
        if: ${{ !inputs.compile-inputs-changed }}
        run: echo '::notice::Rust compile inputs unchanged; required check is satisfied without compiling.'
      - uses: actions/checkout@v7
        if: ${{ inputs.compile-inputs-changed }}
        timeout-minutes: 4
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '1024'
          GIT_HTTP_LOW_SPEED_TIME: '20'
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/dev/log/
            !/experiments/**
            /experiments/**/*.sh
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ inputs.compile-inputs-changed }}
        with:
          components: clippy
      - uses: ./.github/actions/setup-sccache
        if: ${{ inputs.compile-inputs-changed }}
      - uses: ./.github/actions/cache-cargo-registry
        if: ${{ inputs.compile-inputs-changed }}
        with:
          restore-only: 'true'
      - name: Type-check and lint the library and binaries
        id: native-lint
        if: ${{ inputs.compile-inputs-changed }}
        run: bash scripts/ci-clippy-profile.sh --library-and-binaries
      - name: Verify isolated native behavior regressions
        if: ${{ inputs.compile-inputs-changed }}
        env:
          CARGO_BUILD_JOBS: '2'
          # Inherit profile.test: optimized computation with assertions and overflow checks.
          # Routing assertions use committed captures; fixture transports opt in explicitly.
          FORMAL_AI_OFFLINE: '1'
        run: bash scripts/ci-native-regressions.sh
      - name: Verify native unresolved-language source binding
        if: ${{ !cancelled() && inputs.compile-inputs-changed && steps.native-lint.outcome == 'success' }}
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          regression_status=0
          cargo test --manifest-path rust/Cargo.toml --locked --lib solver_unknown_reasoning::tests:: -- --test-threads=1 || regression_status=$?
          cargo test --manifest-path rust/Cargo.toml --locked --test any_language a_language_without_localized_openers_reports_a_gap_not_english -- --exact --test-threads=1 || regression_status=$?
          exit "$regression_status"
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && inputs.compile-inputs-changed && steps.native-lint.outcome == 'success' }}
        with: {node-version: 22}
      - name: Replay the forced function requests against the native CLI
        if: ${{ !cancelled() && inputs.compile-inputs-changed && steps.native-lint.outcome == 'success' }}
        env:
          FORMAL_AI_TEST_NATIVE_CLI: ${{ github.workspace }}/rust/target/debug/formal-ai
        run: node --test --test-concurrency=1 rust/tests/web/issue-1590-forced-functions.test.mjs
      - name: Replay structured output and refusals against the native CLI
        if: ${{ !cancelled() && inputs.compile-inputs-changed && steps.native-lint.outcome == 'success' }}
        env:
          FORMAL_AI_TEST_NATIVE_CLI: ${{ github.workspace }}/rust/target/debug/formal-ai
        run: node --test --test-concurrency=1 rust/tests/web/issue-1586-structured-output.test.mjs
      - name: Replay localized procedures against the native CLI
        if: ${{ !cancelled() && inputs.compile-inputs-changed && steps.native-lint.outcome == 'success' }}
        env:
          FORMAL_AI_TEST_NATIVE_CLI: ${{ github.workspace }}/rust/target/debug/formal-ai
        run: node --test --test-concurrency=1 rust/tests/web/issue-1396-native.test.mjs
      - name: Stage deterministic Google Trends fixtures from the native driver
        if: ${{ !cancelled() && inputs.compile-inputs-changed && steps.native-lint.outcome == 'success' }}
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_DEV_OPT_LEVEL: '0'
          FORMAL_AI_OFFLINE: '1'
          CATALOG_OUTPUT: ${{ runner.temp }}/google-trends-fixtures
        run: |
          cargo build --manifest-path rust/Cargo.toml --locked --example dump_google_trends_catalog
          rust/target/debug/examples/dump_google_trends_catalog "$CATALOG_OUTPUT"
          {
            git rev-parse HEAD 'HEAD^{tree}'
            rustc -vV
            sha256sum rust/target/debug/examples/dump_google_trends_catalog rust/examples/dump_google_trends_catalog.rs rust/src/google_trends_catalog.rs data/seed/google-trends-prompts.lino
          } > "$CATALOG_OUTPUT/generation-identity.txt"
      - name: Retain actual Google Trends fixture projections
        if: ${{ !cancelled() && inputs.compile-inputs-changed && steps.native-lint.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: google-trends-native-fixtures
          path: ${{ runner.temp }}/google-trends-fixtures
          if-no-files-found: error
          retention-days: 7
