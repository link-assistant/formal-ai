name: Native type and lint check

# Issue #1191: PR #1497 passed every PR check, then main failed with E0308
# (run 43710854562) and, once that was fixed, with clippy::manual_contains
# (run 43730270231), since no PR job ran rustc. This is the one focused
# native check a PR runs: main's clippy profile on the library and binaries,
# called from release.yml when a Rust compile input changed or the
# classification is unknown. It uploads nothing and records no receipt.
# The isolated regressions verify native calendar, currency, OpenAI, localized
# procedures, and reports from wrapped clients.
# Main still runs full lint, tests and every build.
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-native-type-check
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  clippy:
    name: Rust compile inputs changed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 4
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '1024'
          GIT_HTTP_LOW_SPEED_TIME: '20'
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/dev/log/
            !/experiments/*
            /experiments/agent_cli_e2e/run_issue_707.sh
            /experiments/dynamic-meta/
            /experiments/issue_859_codex_e2e/
            /experiments/js_dogfood/
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/setup-sccache
      - uses: ./.github/actions/cache-cargo-registry
        with:
          restore-only: 'true'
      - name: Type-check and lint the library and binaries
        run: bash scripts/ci-clippy-profile.sh --library-and-binaries
      - name: Verify calendar, currency, forced OpenAI function, CNL and T3 Code behavior
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_TEST_OPT_LEVEL: '0'
        run: cargo test --manifest-path rust/Cargo.toml --locked --test calendar_currency --test openai_forced_functions --test cnl_output --test cnl_parity --test t3code_launch -- --test-threads=1
      - name: Verify explicit computer-use plans and HTTP receipts
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_TEST_OPT_LEVEL: '0'
        run: cargo test --manifest-path rust/Cargo.toml --locked --test issue_707_computer_use --test issue_707_generalization --test issue_707_learning --test issue_707_mcp -- --test-threads=1
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - name: Replay the forced function requests against the native CLI
        env:
          FORMAL_AI_TEST_NATIVE_CLI: ${{ github.workspace }}/rust/target/debug/formal-ai
        run: node --test --test-concurrency=1 rust/tests/web/issue-1590-forced-functions.test.mjs
      - name: Replay structured output and refusals against the native CLI
        env:
          FORMAL_AI_TEST_NATIVE_CLI: ${{ github.workspace }}/rust/target/debug/formal-ai
        run: node --test --test-concurrency=1 rust/tests/web/issue-1586-structured-output.test.mjs
      - name: Replay concept-link embeddings against the native CLI
        env:
          FORMAL_AI_TEST_NATIVE_CLI: ${{ github.workspace }}/rust/target/debug/formal-ai
        run: node --test --test-concurrency=1 rust/tests/web/issue-1591-embeddings.test.mjs
      - name: Replay prompt-local classification, record QA and text processing against the native CLI
        env:
          FORMAL_AI_TEST_NATIVE_CLI: ${{ github.workspace }}/rust/target/debug/formal-ai
        run: node --test --test-concurrency=1 rust/tests/web/issue-1593-prompt-data.test.mjs
      - name: Replay localized procedures and issue reporting against the native CLI
        id: report-http
        env:
          FORMAL_AI_TEST_NATIVE_CLI: ${{ github.workspace }}/rust/target/debug/formal-ai
        run: node --test --test-concurrency=1 rust/tests/web/issue-1396-native.test.mjs
      - name: Replay prompt-local contradiction worksheets against the native CLI
        env:
          FORMAL_AI_TEST_NATIVE_CLI: ${{ github.workspace }}/rust/target/debug/formal-ai
        run: node --test --test-concurrency=1 rust/tests/web/issue-901-triz-parity.test.mjs
      - uses: oven-sh/setup-bun@v2
        id: bun
        if: ${{ !cancelled() && (success() || steps.report-http.outcome == 'failure') }}
        with:
          bun-version-file: .bun-version
          no-cache: true
      - name: Replay Codex Default mode reporting against the native CLI
        if: ${{ !cancelled() && steps.bun.outcome == 'success' }}
        timeout-minutes: 2
        env:
          BIN: ${{ github.workspace }}/rust/target/debug/formal-ai
          CODEX_VERSION: '0.147.0'
          SCENARIO: report
        run: bash experiments/issue_859_codex_e2e/run.sh
      - name: Replay dynamic meta authorization and receipts through the native gateway
        if: ${{ !cancelled() && steps.bun.outcome == 'success' }}
        env:
          FORMAL_AI_DYNAMIC_META_NATIVE: ${{ github.workspace }}/rust/target/debug/formal-ai
        run: |
          bun install --frozen-lockfile --ignore-scripts
          node --test --test-concurrency=1 --test-name-pattern='HTTP credentials' rust/tests/web/dynamic-meta.test.mjs
      - name: Verify matched client transcripts and issue receipts against the native CLI
        if: ${{ !cancelled() && steps.bun.outcome == 'success' }}
        env:
          FORMAL_AI_TEST_NATIVE_CLI: ${{ github.workspace }}/rust/target/debug/formal-ai
        run: node --test --test-concurrency=1 rust/tests/web/issue-1609-client-reports.test.mjs
