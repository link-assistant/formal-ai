name: macOS Core Tests

on:
  workflow_call:
    inputs:
      base-commit:
        description: >-
          Issue #1017: the base-branch commit every job in this workflow must
          merge. The archive job and the sixteen slices start up to an hour
          apart on a serialized macOS pool, so resolving the base branch tip
          per job made the merged tree a function of when each job happened to
          start -- and a push to the base branch mid-run then failed the
          archive tree check on every slice that started after it. Empty on a
          push build, where nothing is merged.
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  FORMAL_AI_CI_VERBOSE: ${{ vars.FORMAL_AI_CI_VERBOSE || 'false' }}

jobs:
  build-archive:
    name: Build macOS test archive
    runs-on: macos-15-intel
    # Issue #1017: `timeout-minutes` is the backstop, never the deadline. The
    # step budget below (1200s) plus its SIGTERM grace has to expire first, or
    # an overrun reports as a cancelled job instead of a failed one, so the job
    # cap stays at least a third above the budget it guards.
    # Worst observed on main: 629s (run 31937348472).
    #
    # Issue #1055 raised both. Changing `[profile.release]` gives sccache a new
    # key space, so the first run after it compiles cold -- this job reported a
    # 40% hit rate (615 misses) and was killed at 1202s of its 1200s budget,
    # before the archive existed. 1400s covers that, and the cap moves to 35m so
    # the budget stays at 66% of it rather than the 77% a 30m cap would give --
    # `issue_1017`'s gate allows 70%, and the margin pays for checkout and
    # toolchain setup outside the budgeted step.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with base branch (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_COMMIT: ${{ inputs.base-commit }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Free up runner disk space
        run: bash scripts/free-runner-disk.sh
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - uses: ./.github/actions/setup-sccache
      - name: Restore cargo registry cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build one portable nextest archive
        env:
          TEST_BUDGET_SECONDS: 1400
          TEST_WARN_RATIO_PERCENT: 80
        run: |
          mkdir -p "$RUNNER_TEMP/macos-core-tests"
          scripts/run-with-budget-warning.sh \
            "$TEST_BUDGET_SECONDS" "macOS test archive build" \
            cargo nextest archive --lib --bins --tests --all-features \
            --archive-file "$RUNNER_TEMP/macos-core-tests/tests.tar.zst"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/macos-core-tests/tree"
      # Issue #1047: computed once here rather than on each of the eight
      # slices, so the plan costs one rust-script install instead of eight and
      # every slice reads the same file -- a plan recomputed per machine could
      # disagree if the durations file changed mid-run.
      - name: Plan the macOS platform test filter
        run: |
          bash scripts/install-rust-script.sh
          rust-script scripts/plan-test-partition.rs --macos-platform --of 1 \
            > "$RUNNER_TEMP/macos-core-tests/platform.filter"
      - name: Run doc tests
        run: cargo test --doc --verbose
      - name: Upload macOS test archive
        uses: actions/upload-artifact@v7
        with:
          name: macos-core-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-core-tests
          retention-days: 1
          # Issue #1039: the payload is `tests.tar.zst` -- already zstd
          # compressed. The action's default is zip level 6, so the bytes get
          # compressed a second time: that costs CPU on the upload and again on
          # every one of the eight downloads, and buys close to nothing on
          # data that has no redundancy left. Level 0 stores them as they are.
          compression-level: 0

  test-archive:
    name: Run macOS platform tests
    needs: [build-archive]
    runs-on: macos-15-intel
    # Issue #1017: at 12 slices the round-robin `slice:` partitioner -- which
    # balances by test index, never by test duration -- gave slice 10 a 467s+
    # test phase against a 185s minimum. With 133s of per-slice setup that
    # exceeded the 600s job cap, and GitHub reports a `timeout-minutes` kill as
    # `cancelled`, so the whole pipeline reported `cancelled` and skipped the
    # release. 16 slices cut the worst measured slice to roughly 410s.
    #
    # Issue #1039 measured what that split actually bought. The macOS pool runs
    # about 4-5 slices at a time, so sixteen of them delivered 4.3x parallelism
    # (3796s of slice time over an 873s span in run 32572106023) while every
    # slice paid ~120s of fixed cost -- checkout, toolchain, and its own copy of
    # a 941MB archive. Eight slices halve that tax. Because `slice:` partitions
    # round-robin by test index, merging pairs each slow slice with a fast one:
    # the per-slice test times of that run recombine to a 333s worst case at
    # eight, against 256s at sixteen, still only 55% of the 600s budget.
    #
    # Issue #1039 added a retrying artifact download whose own guard bounds it
    # to 570s worst case, which the previous 900s cap could not absorb at all --
    # the *cap* would expire first and report `cancelled`. 25 minutes makes room:
    # 570s download + 600s slice + 133s setup + 15s grace = 1318s against 1500s,
    # leaving 182s -- comfortably more than the range a single slow checkout
    # varies by (33s to 62s across the slices of run 32572106023).
    # The download is a 941MB artifact whose transfer time depends on runner
    # throughput, so its budget has to cover a slow runner rather than a typical
    # one.
    # `issue_1039::the_download_retry_is_bounded_to_fit_the_job_cap` recomputes
    # this from the workflow, so the numbers cannot drift out of agreement.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partition: 1 }
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Issue #1017: merge the commit the caller pinned, which is the same one
      # the archive job merged, rather than resolving the base branch tip at
      # this slice's own start time. The slices are serialized by the macOS
      # runner pool and start up to an hour apart, so the unpinned form made the
      # merged tree a function of when each slice happened to start: a push to
      # the base branch mid-run failed the tree check below on every slice that
      # started after it, with nothing wrong in the pull request.
      - name: Simulate fresh merge with base branch (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_COMMIT: ${{ inputs.base-commit }}
        run: bash scripts/simulate-fresh-merge.sh
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      # Issue #1039: the action's own five retries are spent back-to-back, so a
      # storage backend having a bad minute exhausts them and reddens a slice
      # that never ran a test. The wrapper pauses between attempts so a later
      # one meets a different minute.
      #
      # The per-attempt deadline is sized from the archive, not from a guess.
      # It is 941MB, so the transfer time is set by whatever throughput the
      # runner gets, and that varies by more than 5x in practice: run
      # 32572106023 recorded successes at 16s, 44s and 82s (58, 21 and 11 MB/s)
      # while slice 11/16 of the same run spent three attempts at exactly 87s
      # against an 85s deadline.
      #
      # Two earlier drafts died on this. 40s was barely above the *fastest*
      # observations; 85s still sat 3s above an 82s success. A deadline just
      # past the observed spread fires on ordinary slow runners, so the retry
      # manufactures the red it exists to prevent -- the original action had no
      # per-attempt deadline at all and simply retried.
      #
      # 165s is twice the slowest observed success, tolerating ~5.7MB/s, so only
      # a genuinely stuck transfer reaches it. The budget still has to fit the
      # job cap: 1500s cap - 600s slice - 133s setup - 15s grace leaves 752s,
      # and 3 x (165s + 15s) + 2 x 15s = 570s fits with room. An exhausted retry
      # then still *fails* inside the cap rather than being killed by it and
      # reported as `cancelled` -- the issue #1017 failure this must not
      # reintroduce. `TEST_BUDGET_SECONDS` makes the wrapper enforce that
      # itself rather than trusting this comment.
      - name: Download macOS test archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_BUDGET_SECONDS: 590
          FORMAL_AI_DOWNLOAD_ATTEMPTS: 3
          FORMAL_AI_DOWNLOAD_ATTEMPT_SECONDS: 165
          FORMAL_AI_DOWNLOAD_LOOKUP_SECONDS: 15
          FORMAL_AI_DOWNLOAD_RETRY_DELAY_SECONDS: 15
        run: |
          scripts/download-artifact-with-retry.sh \
            "macos-core-tests-${{ github.run_id }}" \
            "$RUNNER_TEMP/macos-core-tests"
      - name: Verify archive source tree
        run: test "$(git rev-parse 'HEAD^{tree}')" = "$(cat "$RUNNER_TEMP/macos-core-tests/tree")"
      # Issue #1059: macOS runs the tests whose behaviour can differ from
      # Linux, not the whole suite. `data/meta/macos-platform-tests.lino` names
      # the modules and says why each is listed. One runner, because those tests
      # take about ten seconds -- slicing that only multiplies checkout,
      # toolchain and a 916MB artifact download across eight machines, and two
      # slices of run 32706091539 could not finish that download at all.
      - name: Run macOS platform tests
        env:
          TEST_BUDGET_SECONDS: 600
          TEST_WARN_RATIO_PERCENT: 75
        run: |
          PLATFORM=$(cat "$RUNNER_TEMP/macos-core-tests/platform.filter")
          scripts/run-with-budget-warning.sh \
            "$TEST_BUDGET_SECONDS" "macOS platform tests" \
            cargo nextest run --archive-file "$RUNNER_TEMP/macos-core-tests/tests.tar.zst" \
            --extract-to "$GITHUB_WORKSPACE" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            -E "($PLATFORM) & not (test(data_files::) | test(self_ast_census) | test(specification::))"
