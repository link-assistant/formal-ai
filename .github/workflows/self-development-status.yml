name: Self-development status

# Issue #1085 (D3.5). The self-development floor -- one merged pull request per
# release cycle whose change the formal-ai model produced -- is a standing
# report, not a release condition. It runs on every push to `main` and once a
# day, and it is red until the floor is met: no budget, no grace period, no
# bypass (issue #1066). A release is cut on CI correctness alone in
# `release.yml`; this workflow says, in the same place every day, whether
# Formal AI authored any of the work since the last tag, and, separately, that named debt
# has not grown.

on:
  push:
    branches: [main]
  # Issue #1113: without this, the first anyone learns that a change leaves the
  # release path red is *after* it merges -- which is what happened on
  # `7f3d61fee` and again on `5b0973f65`. The same three checks run on the merge
  # commit a pull request proposes, so the answer arrives before the merge, not
  # after. The condition itself is unchanged: still red when the floor is unmet,
  # still no budget, grace period or bypass (issue #1066).
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_TERM_COLOR: always

jobs:
  self-development-status:
    name: 'Self-development floor and debt ratchet since the last tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install rust-script
        run: bash scripts/install-rust-script.sh
      - name: Test the metric and the ratchet checker
        env:
          TEST_BUDGET_SECONDS: 600
          TEST_WARN_RATIO_PERCENT: 70
        run: |
          scripts/run-with-budget-warning.sh \
            "$TEST_BUDGET_SECONDS" "self-development scripts" \
            rust-script --test scripts/check-debt-ratchet.rs
      - name: Measure the share since the last tag (metric version 3)
        env:
          TEST_BUDGET_SECONDS: 600
          TEST_WARN_RATIO_PERCENT: 70
        run: |
          since="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD)"
          echo "Measuring ${since}..HEAD"
          scripts/run-with-budget-warning.sh \
            "$TEST_BUDGET_SECONDS" "self-hosting measurement" \
            rust-script scripts/self-hosting-metric.rs --since "$since" --until HEAD \
            | tee "$RUNNER_TEMP/share.txt"
          {
            echo "### Self-development status"
            echo
            echo "Range: \`${since}..HEAD\`"
            echo
            echo "Share of behaviour-changing lines authored by the formal-ai model: $(tail -n 1 "$RUNNER_TEMP/share.txt")"
          } >> "$GITHUB_STEP_SUMMARY"
      # Issue #1085 D1.4 demanded that the non-kernel Rust line count be lower
      # at every release. That demand is withdrawn (VISION.md, docs/architect-notes/): the
      # meta-language representation is the system and Rust is one target it is
      # emitted into, so a Rust line count measures an output and may grow while
      # the algorithm becomes more general. Requiring it to shrink obstructs
      # progression to the vision, which is the one thing a requirement may not
      # do. The shrink-only ceilings themselves still hold on every pull request
      # through the `check_debt_ratchet` gate; what is gone is the rule that a
      # *release* must show the line count falling.
      - name: 'Debt ratchet holds (ceilings move down, never up)'
        run: rust-script scripts/check-debt-ratchet.rs
      - name: 'Self-development floor (issue #924, #1066, #1085)'
        run: rust-script scripts/check-self-development-release.rs
