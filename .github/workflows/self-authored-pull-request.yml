name: Self-authored pull request

# Issue #1085 (D2.3): Formal AI authors a change and the pull request is opened
# under the github-actions bot, with no human commit on the branch.
#
# The loop itself lives in `.github/actions/author-with-formal-ai`, a composite
# action another repository can install: hive-mind#2233 asks for it on every new
# issue there, so a wrong draft fails fast and in public, which is the evidence
# the next improvement is made from. This workflow is that action's first
# consumer, and it runs with `formal-ai-source: source` because this is the
# repository that owns the sources -- a change to the meta algorithm has to be
# measured by the branch making it, not by the last release.
#
# The task contract, the re-run guard and the base-branch rule are documented in
# the action and in `docs/case-studies/issue-1085/ci-evidence/`.
on:
  release:
    types: [published]
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number carrying the task (default: the oldest open issue labelled formal-ai-solve)'
        required: false
        default: ''
        type: string
  issues:
    types: [labeled]
  pull_request:
    # Issue #1187 R4: an isolated e2e/<purpose>/<run>/<name> pull request
    # never triggers this repository's own pipeline.
    branches-ignore: ['e2e/**']
    paths:
      - '.github/workflows/self-authored-pull-request.yml'
      - '.github/actions/author-with-formal-ai/**'
      - 'scripts/author-change-with-formal-ai.sh'
      - 'scripts/self-authored-commit-count.sh'
  schedule:
    - cron: '41 5 * * 1'

permissions: {}

concurrency:
  group: self-authored-pull-request
  cancel-in-progress: false

jobs:
  author:
    name: Formal AI authors a change and opens the pull request
    if: github.event_name != 'issues' || github.event.label.name == 'formal-ai-solve'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: formal-ai-repository-writes
      queue: max
    # Scoped to this job, not the workflow: the job pushes the bot branch,
    # opens and comments on the pull request, and comments on the task issue.
    # `actions: write` lets the job dispatch the bot pull request's checks
    # (issue #1187 R2); a dispatch run needs no approval.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      LINK_ASSISTANT_AGENT_SUMMARIZE_SESSION: "false"
    steps:
      # This checkout keeps its credential (no `persist-credentials: false`):
      # the action's push steps write the bot branch with it when the
      # resolver below falls back to github.token, and nothing else supplies
      # one (issue #1079).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ (github.event_name == 'release' || github.event_name == 'workflow_run') && github.event.repository.default_branch || github.head_ref || github.ref }}

      # Issue #1187 R1: the one credential resolver -- GitHub App, then
      # AUTOMATION_TOKEN, then github.token. Nothing is mandatory; the layer
      # is printed to the log and the job summary.
      - uses: ./.github/actions/automation-token
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          app-private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          automation-token: ${{ secrets.AUTOMATION_TOKEN }}
        id: automation

      # Source classification is not evidence that a contribution was reviewed or merged.
      - name: Bind an independently published release to the default author source
        id: release-context
        if: github.event_name == 'release' || github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ steps.automation.outputs.token }}
          EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ACTION: ${{ github.event.action }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: node scripts/resolve-self-authored-release.mjs

      - uses: ./.github/actions/cache-cargo-registry
        if: github.event_name != 'release' && github.event_name != 'workflow_run' || steps.release-context.outputs.active == 'true'
        with:
          prefix: self-authored-

      # The action's contract keeps its `FORMAL_AI_BOT_TOKEN` variable name
      # (consumers in other repositories set it): it is non-empty exactly
      # when the resolver found a credential that starts workflow runs and
      # may push workflow files, so the action's workflow-file guard and its
      # "pushed with GITHUB_TOKEN" notice keep their meaning.
      - uses: ./.github/actions/author-with-formal-ai
        if: github.event_name != 'release' && github.event_name != 'workflow_run' || steps.release-context.outputs.active == 'true'
        id: author
        env:
          GH_TOKEN: ${{ steps.automation.outputs.token }}
          FORMAL_AI_BOT_TOKEN: ${{ steps.automation.outputs.layer != 'default' && steps.automation.outputs.token || '' }}
        with:
          issue: ${{ inputs.issue }}
          formal-ai-source: source
          base-branch: ${{ steps.release-context.outputs.branch }}
          starting-ref: ${{ steps.release-context.outputs.branch }}

      # Issue #1187 R2: at layer `default` the push came from github.token,
      # so every `pull_request` check would wait for a maintainer's approval.
      # Dispatch them on the bot branch instead -- dispatch runs start at once.
      - name: Dispatch the bot pull request's checks
        if: steps.automation.outputs.layer == 'default' && steps.author.outputs.authored == 'true'
        uses: ./.github/actions/dispatch-checks
        with:
          pull-request: ${{ steps.author.outputs.pull-request }}
          token: ${{ steps.automation.outputs.token }}
