name: Regenerate native session projections
on:
  pull_request:
    branches-ignore: ['e2e/**']
    paths:
      - 'rust/**'
      - 'data/**'
      - 'docs/case-studies/**'
      - 'scripts/generate-native-session-projections.mjs'
      - 'scripts/lib/native-session-projections.mjs'
      - 'scripts/lib/native-session-source.mjs'
      - 'scripts/lib/native-process-diagnostics.mjs'
      - 'scripts/lib/native-response-identity.mjs'
      - '.github/workflows/regenerate-native-session-projections.yml'
  workflow_dispatch:
    inputs:
      mode:
        required: false
        default: checks
        type: choice
        options: [checks]
      pull-request:
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: native-session-projections-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  pr-check-profile:
    if: (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.FORMAL_AI_FULL_PR_CI != 'run'
    uses: ./.github/workflows/pr-check-profile.yml
  regenerate:
    if: ${{ ((github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')) || vars.FORMAL_AI_FULL_PR_CI == 'run') && (true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NATIVE_SESSION_REQUESTED_PULL_REQUEST: ${{ github.event.inputs['pull-request'] || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-sccache
      - uses: ./.github/actions/cache-cargo-registry
        with:
          restore-only: 'true'
      - name: Generate actual compiled driver projections
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/generate-native-session-projections.mjs "$RUNNER_TEMP/native-session-projections"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-session-projections
          path: ${{ runner.temp }}/native-session-projections
          retention-days: 7
          if-no-files-found: error
