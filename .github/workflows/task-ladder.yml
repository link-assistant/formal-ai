# === TASK LADDER (issue #842) ===
# Drive the 24-node issue #840 task ladder against a live server and record the
# score. The ladder measures composition -- whether a request that decomposes
# into subtasks the system already handles is itself handled -- which no unit
# test covers, because each rung is a whole request/route/answer round trip.
# BASELINE makes the run a ratchet: it fails when the score drops below the
# committed results.json, so a regression is visible on the pull request that
# causes it rather than months later in a bug report.
#
# This lives outside release.yml because that file had reached the 2000-line
# ceiling `scripts/check-file-size.rs` enforces. The gate is independent of the
# release pipeline anyway, so the `paths` filters below replace what the
# `detect-changes` job provided in-workflow: the ladder only runs when Rust
# sources, manifests, seed data, or the ladder harness itself change.
name: Task Ladder

on:
  push:
    branches:
      - main
    # Duplicated below rather than shared through a YAML anchor: GitHub Actions
    # does not expand anchors in workflow files.
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'data/seed/**'
      - 'experiments/issue_840_task_ladder/**'
      - '.github/workflows/task-ladder.yml'
  # Issue #1107 (item 3): four ladders each booted Formal AI and drove an agent
  # on every Rust-touching branch push. One of them proving the path is the
  # branch signal; running all four is four times the bill for the same answer.
  # This one now runs on a branch only when the branch changes the ladder
  # itself, and otherwise on `main` and on the schedule below -- so it still
  # gates every merge, and a regression cannot reach a release unreported.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'experiments/issue_840_task_ladder/**'
      - '.github/workflows/task-ladder.yml'
  schedule:
    - cron: '53 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  CARGO_INCREMENTAL: '0'

jobs:
  task-ladder:
    name: 'Task Ladder (issue #840 dataset)'
    runs-on: ubuntu-latest
    # A release build of the server plus 24 request/route/answer round trips
    # against it; the build dominates and starts cold.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false


      - name: Test the falsifiable ladder judge
        run: |
          cd experiments/issue_840_task_ladder
          python3 -m unittest -v test_ladder.py

      # Reused across every workflow that only needs to *run* the binary: the
      # cache key is the content of the sources it is built from, so a push that
      # changed neither pays nothing (issue #1107).
      - uses: ./.github/actions/formal-ai-binary

      # The committed results.json is both the record of the last measurement
      # and the floor this run must not fall below.
      - name: Run the ladder against the committed baseline
        env:
          BASELINE: experiments/issue_840_task_ladder/results.json
          OUT: ${{ runner.temp }}/ladder-results.json
          LEARNING_OUT: ${{ runner.temp }}/ladder-learning.json
        # pipefail, or `tee` would swallow the ratchet's non-zero exit code.
        run: |
          set -euo pipefail
          bash experiments/issue_840_task_ladder/run_ladder.sh | tee "${{ runner.temp }}/ladder.log"

      - name: Record the score in the run summary
        if: always()
        run: |
          set -euo pipefail
          results='${{ runner.temp }}/ladder-results.json'
          [ -f "$results" ] || exit 0
          {
            echo '### Task ladder (issue #840 dataset)'
            echo
            python3 -c "import json,sys;s=json.load(open(sys.argv[1]))['summary'];print(f\"**{s['passed']}/{s['total']}** nodes passed.\")" "$results"
            echo
            echo '<details><summary>Per-node results</summary>'
            echo
            echo '```'
            cat '${{ runner.temp }}/ladder.log'
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the ladder results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task-ladder-results
          path: |
            ${{ runner.temp }}/ladder-results.json
            ${{ runner.temp }}/ladder-learning.json
          if-no-files-found: ignore
