# Lint and audit the workflows themselves (issue #1076).
#
# All four link-foundation pipeline templates ship this file, and it is the one
# template workflow this repository had no counterpart for. The pipeline is code,
# and until now nothing in the pipeline was looking at it: actionlint ran as one
# step inside the CI/CD Pipeline's `lint` job, and nothing ran zizmor at all.
#
# The security half of that gap was not theoretical. The first zizmor run against
# these workflows returned four high-severity template-injection findings, all in
# release.yml: `${{ github.event.inputs.bump_type }}` and
# `${{ github.event.inputs.description }}` interpolated straight into the `run:`
# line of two steps that hold `secrets.GITHUB_TOKEN`. Both steps already declared
# those values in `env:` and used the raw expression anyway.
#
# actionlint moves here from that `lint` job, and changes form on the way. It ran
# as a bare binary, and a bare actionlint binary does not lint `run:` blocks
# unless ShellCheck happens to be on PATH -- when it is not, it skips every shell
# check and still exits 0, so a green result means strictly less than it appears
# to. Verified both ways on this repository: without ShellCheck installed the
# binary exits 0 on these workflows; with it installed it reports SC1073 inside a
# `run:` block. The Docker image bundles ShellCheck and pyflakes, so the check
# cannot quietly narrow itself. The `-ignore` flag the step used to carry now
# lives in `.github/actionlint.yaml`, which the image reads as well.
#
# Both jobs are gated on `paths: ['.github/**']`: their findings can only change
# when the workflows do.

name: Workflows

on:
  push:
    branches: [main]
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']

# Keep the workflow read-only unless a job explicitly needs an additional scope.
permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-actionlint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The image bundles ShellCheck and pyflakes, so this lints every `run:`
      # block as well as the workflow schema. Reproduce locally with:
      #   docker run --rm -v "$PWD:/repo" -w /repo \
      #     rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      #
      # `-verbose` costs one line per workflow and buys the one fact the exit
      # status does not carry: how many files were actually read. A silent 0 and
      # a 0 after "Found 0 errors in 19 files" are not the same result.
      #
      # Pinned by digest, not by tag (issue #1079, defect D3). `.github/zizmor.yml`
      # declares `'*': hash-pin` for every namespace this repository does not
      # explicitly trust, and `rhysd/*` is not one of the trusted ones -- but that
      # policy governs `unpinned-uses`, which only looks at action references.
      # A container image is covered by the separate `unpinned-images` audit,
      # which zizmor classifies as `pedantic`, and the Zizmor job below runs
      # `--persona regular`. So the stated hash-pin policy did not reach the two
      # images this pipeline runs, and `rhysd/actionlint:1.7.12` is a mutable
      # Docker tag executing with the repository checked out. The digest is
      # 1.7.12 as published on 2026-09-07; re-resolve it when bumping with
      #   docker pull rhysd/actionlint:<tag> &&
      #   docker inspect --format='{{index .RepoDigests 0}}' rhysd/actionlint:<tag>
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color -verbose

      # A gate that cannot fail is not a gate. The step above is trusted to lint
      # `run:` blocks, which actionlint can only do by shelling out to
      # ShellCheck -- and when ShellCheck is missing it skips them and still
      # exits 0. So the same image is pointed at a fixture whose only defect is
      # inside a `run:` block, and this step fails when that *passes*.
      #
      # This is the check that would have caught the defect the step above
      # exists to fix, had it existed while actionlint ran as a bare binary
      # (issue #1076, defect D11).
      - name: 'Prove the linter can still see inside a run block'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          canary=tests/fixtures/actionlint/shellcheck-canary.yml
          if docker run --rm -v "${PWD}:/repo" -w /repo \
               rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
               -no-color "${canary}"; then
            echo "::error file=${canary}::actionlint accepted a workflow whose run: block does not parse. ShellCheck is not running, so every run: block above went unchecked."
            exit 1
          fi
          echo "actionlint rejected the canary, so its ShellCheck delegation is live."

  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    # Issue #1017: a job cap must be a backstop, not the mechanism that reports
    # the failure -- `timeout-minutes` cancels a job, and a cancelled job is not
    # a red check. This audit takes seconds; ten minutes is unreachable except
    # by a hang.
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-zizmor
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Reproduce locally with exactly this configuration:
      #   pipx run zizmor==1.29.0 --config .github/zizmor.yml \
      #     --min-confidence medium --persona regular \
      #     .github/workflows .github/actions
      #
      # 1.29.0, and `version:` set rather than left at its default, because
      # "reproduce locally with X" is only true if CI runs X (issue #1079,
      # defect D6). This comment said 1.30.0 and CI could not run it:
      # `zizmor-action` resolves the version from a static table shipped inside
      # the action (`support/versions`), and v0.6.2's table stops at 1.29.0 --
      # its `latest` row is literally the same digest as its `1.29.0` row. So
      # `latest` here does not float, it freezes, and it freezes one minor
      # release behind what the comment told a maintainer to install. Naming
      # the version makes the two agree and makes the next bump a visible line
      # in the diff rather than a side effect of bumping the action.
      #
      # `inputs:` is not optional here even though it reads like it. The action
      # defaults it to `.`, i.e. the whole repository, and this repository keeps
      # archived copies of other projects' workflows under `docs/case-studies/`
      # as evidence. Audited at the default scope this job exits 14 with 1739
      # findings -- 140 of them high -- every displayed one pointing into
      # `docs/case-studies/issue-479/template-comparison/rust/.github/workflows/
      # release.yml`. Those files are records of what another repository shipped,
      # not a pipeline anyone can fix, so a red check on them is a false positive
      # of exactly the kind issue #1076 exists to remove. Scoped to the live
      # pipeline the same command exits 0.
      #
      # Annotations rather than SARIF: the results should be a red check on the
      # pull request that introduced them, not a Security tab entry that depends
      # on Advanced Security being enabled.
      - uses: zizmorcore/zizmor-action@v0.6.2
        with:
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml
          inputs: .github/workflows .github/actions
          min-confidence: medium
          version: 1.29.0

      # The pass above runs `--persona regular`, which is the right default:
      # pedantic turns up 165 findings here, nearly all of them stylistic, and
      # a gate that cries wolf is a gate people learn to merge past. But the
      # persona split is not "important vs. unimportant" -- `unpinned-images`
      # is Pedantic, and it is the audit that enforces `'*': hash-pin` against
      # container references. `.github/zizmor.yml` has declared that policy
      # since issue #1076 and it has never once been applied to an image, which
      # is how `docker://rhysd/actionlint:1.7.12` sat in the step above:
      # a mutable third-party tag executing with the repository checked out,
      # under a written policy forbidding exactly that (issue #1079, defect D3).
      #
      # There is no way to lift a single audit into the regular persona --
      # zizmor 1.29/1.30 reject `rules.<audit>.persona` outright ("unknown
      # field `persona`, expected one of `disable`, `ignore`, `config`,
      # `remap`"), and `remap` only rewrites severity, which is not what filters
      # the finding. So the whole persona is raised and then narrowed by
      # severity *and* confidence, which is where `unpinned-images` sits and
      # where the stylistic findings do not: 165 pedantic findings, 0 reported.
      #
      # Proof that it is a live gate rather than a decorative one, and the
      # measurement above, are in
      # `dev/log/issues/1079/pulls/1080/analysis/zizmor-narrow-pedantic-gate.md`:
      # reverting the digest pin and dropping the stock image's explicit
      # exception marker takes it to exit 14 with both findings named.
      - name: 'Enforce the hash-pin policy on container images'
        uses: zizmorcore/zizmor-action@v0.6.2
        with:
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml
          inputs: .github/workflows .github/actions
          min-confidence: high
          min-severity: high
          persona: pedantic
          version: 1.29.0
