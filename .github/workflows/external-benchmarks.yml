# Scheduled external benchmark harness (issue #698).
#
# Runs a bounded slice of every real upstream suite, records the honest
# `passed/total` score in `data/benchmarks/external-results.lino`, verifies the
# monotonic per-suite ratchet, and commits the refreshed ledger. A suite that
# cannot run is recorded as `benchmark_unavailable` with its reason instead of
# being replaced by a repository-local proxy.
name: External Benchmarks

on:
  pull_request:
    # Issue #1187 R4: an isolated e2e/<purpose>/<run>/<name> pull request
    # never triggers this repository's own pipeline.
    branches-ignore: ['e2e/**']
  schedule:
    # Weekly, Monday 04:17 UTC. Off the hour so the run does not queue behind
    # the GitHub-wide top-of-hour cron burst.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      slice:
        description: 'Upstream cases per core suite (first N in upstream order)'
        required: false
        type: string
        default: '20'
      swebench_slice:
        description: 'SWE-bench cases (container-heavy; first N in upstream order)'
        required: false
        type: string
        default: '23'
      suite:
        description: 'Suite id, or `all` for every recorded suite'
        required: false
        type: string
        default: 'all'
      commit:
        description: 'Commit the refreshed ledger back to the branch'
        required: false
        type: boolean
        default: true
      shard_size:
        description: 'Split one suite (not `all`) into concurrent shards of this many cases; empty runs it in one job. Shards never commit.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_NET_RETRY: '10'
  CARGO_TERM_COLOR: always

jobs:
  # === RATCHET - every PR compares its ledger with the actual base revision ===
  ratchet:
    name: Verify monotonic ledger
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-ratchet
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compare with pull-request base
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          cargo run --manifest-path rust/Cargo.toml --locked --bin formal-ai -- benchmark ratchet \
            --base-ref "origin/${GITHUB_BASE_REF}"

      - name: Verify scheduled branch ledger
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cargo run --manifest-path rust/Cargo.toml --locked --bin formal-ai -- benchmark ratchet

  # === EXTERNAL BENCHMARKS - run upstream suites and publish honest scores ===
  external-benchmarks:
    name: Run upstream suites
    concurrency:
      group: formal-ai-repository-writes
      queue: max
    if: github.event_name != 'pull_request' && !inputs.shard_size
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      # One of the four checkouts in this repository that keep their
      # credential (issue #1079); every other one sets
      # `persist-credentials: false`. This one cannot: the last step of this
      # job pushes through `scripts/push-to-shared-branch.sh` to record the
      # scheduled upstream results, and that push authenticates with exactly the
      # credential `persist-credentials: false` removes. The job is already
      # narrowed to `github.event_name != 'pull_request'`, so the credential is
      # never persisted on a fork's pull request.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/cache-cargo-registry

      - name: Setup Python
        # HumanEval/MBPP execute upstream tests. SWE-bench applies candidate
        # patches in its official Docker evaluator.
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Do not preinstall SWE-bench here. The grader recovers the pinned
      # official harness through the same prerequisite pipeline users exercise,
      # and records whether the evaluator was reached (issue #1138 plan 06).

      # Reused across every workflow that only needs to *run* the binary: the
      # cache key is the content of the sources it is built from, so a push that
      # changed neither pays nothing (issue #1107).
      - uses: ./.github/actions/formal-ai-binary

      - name: Run the bounded upstream slice
        env:
          BENCHMARK_SLICE: ${{ inputs.slice || '20' }}
          SWE_BENCH_SLICE: ${{ inputs.swebench_slice || '23' }}
          BENCHMARK_SUITE: ${{ inputs.suite || 'all' }}
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          run_suite() {
            ./rust/target/release/formal-ai benchmark run \
              --suite "$1" \
              --slice "$2" \
              --online \
              --allow-install \
              --append \
              --learning-report "target/formal-ai-benchmarks/learning/$1.lino" \
              --frontier-record data/meta/learning-frontier-upstream-benchmarks.lino
          }
          if [[ "${BENCHMARK_SUITE}" == 'all' ]]; then
            for suite in humaneval mbpp gsm8k math object_counting coedit egg_math editeval; do
              run_suite "${suite}" "${BENCHMARK_SLICE}"
            done
            run_suite ascent_transitive_closure 5
            run_suite swebench_lite "${SWE_BENCH_SLICE}"
          elif [[ "${BENCHMARK_SUITE}" == 'swebench_lite' ]]; then
            run_suite "${BENCHMARK_SUITE}" "${SWE_BENCH_SLICE}"
          elif [[ "${BENCHMARK_SUITE}" == 'ascent_transitive_closure' ]]; then
            run_suite "${BENCHMARK_SUITE}" 5
          else
            run_suite "${BENCHMARK_SUITE}" "${BENCHMARK_SLICE}"
          fi 2>&1 | tee ci-logs/external-benchmarks.log
          grep -E '^suite=' ci-logs/external-benchmarks.log >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify the monotonic ratchet
        run: |
          set -euo pipefail
          ./rust/target/release/formal-ai benchmark ratchet

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-benchmarks-log
          path: |
            ci-logs/external-benchmarks.log
            target/formal-ai-benchmarks/learning/*.lino
          if-no-files-found: warn

      # This push does not trigger a pipeline run, and that is documented
      # behaviour rather than a fault here (issue #1081, D4):
      #
      #   "When you use the repository's GITHUB_TOKEN to perform tasks, events
      #    triggered by the GITHUB_TOKEN [...] will not create a new workflow
      #    run. This prevents you from accidentally creating recursive workflow
      #    runs."
      #   https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication
      #
      # So the tree at the tip of the default branch after this step has never
      # been validated, and -- because there is no run at all, rather than a
      # failed one -- the branch page keeps showing the previous commit's green.
      # Measured on 2026-09-07: `dda02efb` received zero push-triggered runs
      # while `6039c4d9` under it received the full fan-out.
      #
      # Neither available remedy is safe. A personal access token would restore
      # the runs and restore the recursion the rule exists to prevent, and
      # `release.yml`'s `workflow_dispatch` means "publish a release" (it
      # requires `release_mode` and `bump_type`, and its `detect-changes` job is
      # skipped on that event), not "validate this commit". What is fixed is the
      # invisibility: `scripts/check-head-pipeline-coverage.rs` runs weekly from
      # `.github/workflows/job-headroom.yml` and says out loud when the tip has
      # no run and how many commits back the last validated tree is.
      - name: Commit the refreshed ledger
        if: github.event_name == 'schedule' || inputs.commit
        run: |
          set -euo pipefail
          if git diff --quiet -- data/benchmarks/external-results.lino 'data/meta/learning-frontier-upstream-benchmarks*.lino'; then
            echo 'ledger unchanged; nothing to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/benchmarks/external-results.lino 'data/meta/learning-frontier-upstream-benchmarks*.lino'
          git commit -m 'chore(benchmarks): record scheduled upstream results and the failure frontier (#698, #1085)'
          # Issue #1081 (D13). `concurrency: formal-ai-repository-writes` above
          # orders this job against the release writers; it does not rebase it.
          # This job is checked out at the commit its cron fired on, so a
          # release that lands while it waits in the queue leaves it behind the
          # branch and its push is rejected non-fast-forward -- a red scheduled
          # run with nothing wrong in it, and a ledger update lost. The helper
          # rebases and retries, and refuses to retry a rejection a rebase
          # cannot fix.
          bash scripts/push-to-shared-branch.sh origin "${GITHUB_REF_NAME}"

  # === SHARDED MEASUREMENT - one suite split into concurrent windows ===
  #
  # A full HumanEval slice spends about 55 seconds per case in the solver
  # (run 37594798452: 89 cases in 81 minutes, one case taking 164 seconds), so
  # 164 cases cannot finish inside one job cap -- and grading happens after the
  # last case, so a cancelled run reports nothing at all. Each shard here runs
  # `--offset`/`--slice` windows of the same suite, grades its own window, and
  # the total job adds the windows up. Shards read only; their combined count
  # is recorded in the ledger by a reviewed commit, never by one shard.
  shard-plan:
    name: Plan upstream shards
    if: github.event_name == 'workflow_dispatch' && inputs.shard_size
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Plan the windows
        id: plan
        env:
          SUITE: ${{ inputs.suite }}
          SLICE: ${{ inputs.slice }}
          SHARD_SIZE: ${{ inputs.shard_size }}
        run: |
          set -euo pipefail
          if [[ "${SUITE}" == 'all' ]]; then
            echo '::error::shard_size splits one suite; dispatch it with a suite id, not all' >&2
            exit 1
          fi
          windows="$(jq -cn --argjson total "${SLICE}" --argjson size "${SHARD_SIZE}" \
            '[range(0; $total; $size) | {offset: ., slice: ([$size, $total - .] | min)}]')"
          echo "windows=${windows}" >> "${GITHUB_OUTPUT}"
          echo "${windows}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/cache-cargo-registry

      # Built once here so every shard restores the same cached binary instead
      # of each compiling it.
      - uses: ./.github/actions/formal-ai-binary

  upstream-shard:
    name: Upstream shard ${{ matrix.window.offset }}
    needs: shard-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        window: ${{ fromJSON(needs.shard-plan.outputs.windows) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/cache-cargo-registry

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: ./.github/actions/formal-ai-binary

      - name: Run the window
        env:
          SUITE: ${{ inputs.suite }}
          OFFSET: ${{ matrix.window.offset }}
          WINDOW: ${{ matrix.window.slice }}
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          ./rust/target/release/formal-ai benchmark run \
            --suite "${SUITE}" \
            --offset "${OFFSET}" \
            --slice "${WINDOW}" \
            --online \
            --allow-install 2>&1 | tee "ci-logs/shard-${OFFSET}.log"
          grep -E '^(shard )?suite=' "ci-logs/shard-${OFFSET}.log" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-benchmarks-shard-${{ matrix.window.offset }}
          path: ci-logs/shard-*.log
          if-no-files-found: warn

  shard-total:
    name: Total of upstream shards
    needs: [shard-plan, upstream-shard]
    if: ${{ !cancelled() && needs.shard-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: external-benchmarks-shard-*
          merge-multiple: true
          path: shards

      - name: Add the windows up
        env:
          SUITE: ${{ inputs.suite }}
          SLICE: ${{ inputs.slice }}
        run: |
          set -euo pipefail
          # Only graded windows count; a shard that never printed its summary
          # makes the total incomplete, and the job says so instead of
          # reporting a smaller suite as if it were the whole one.
          read -r passed failed total < <(cat shards/shard-*.log 2>/dev/null |
            awk -v suite="${SUITE}" '$1 == "suite=" suite {
              for (i = 2; i <= NF; i++) { split($i, kv, "="); v[kv[1]] += kv[2] }
            } END { printf "%d %d %d\n", v["passed"], v["failed"], v["total"] }')
          line="suite=${SUITE} passed=${passed} failed=${failed} total=${total} (requested ${SLICE}, sharded)"
          echo "${line}"
          echo "${line}" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${total}" -ne "${SLICE}" ]]; then
            echo "::error::only ${total} of ${SLICE} cases were graded; a shard did not finish" >&2
            exit 1
          fi
