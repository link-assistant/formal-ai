# Scheduled external benchmark harness (issue #698).
#
# Runs a bounded slice of every real upstream suite, records the honest
# `passed/total` score in `data/benchmarks/external-results.lino`, verifies the
# monotonic per-suite ratchet, and commits the refreshed ledger. A suite that
# cannot run is recorded as `benchmark_unavailable` with its reason instead of
# being replaced by a repository-local proxy.
name: External Benchmarks

on:
  pull_request:
  schedule:
    # Weekly, Monday 04:17 UTC. Off the hour so the run does not queue behind
    # the GitHub-wide top-of-hour cron burst.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      slice:
        description: 'Upstream cases per core suite (first N in upstream order)'
        required: false
        type: string
        default: '20'
      swebench_slice:
        description: 'SWE-bench cases (container-heavy; first N in upstream order)'
        required: false
        type: string
        default: '1'
      suite:
        description: 'Suite id, or `all` for every recorded suite'
        required: false
        type: string
        default: 'all'
      commit:
        description: 'Commit the refreshed ledger back to the branch'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_NET_RETRY: '10'
  CARGO_TERM_COLOR: always

jobs:
  # === RATCHET - every PR compares its ledger with the actual base revision ===
  ratchet:
    name: Verify monotonic ledger
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-ratchet
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compare with pull-request base
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          cargo run --locked --bin formal-ai -- benchmark ratchet \
            --base-ref "origin/${GITHUB_BASE_REF}"

      - name: Verify scheduled branch ledger
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cargo run --locked --bin formal-ai -- benchmark ratchet

  # === EXTERNAL BENCHMARKS - run upstream suites and publish honest scores ===
  external-benchmarks:
    name: Run upstream suites
    concurrency:
      group: formal-ai-repository-writes
      queue: max
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/cache-cargo-registry

      - name: Setup Python
        # HumanEval/MBPP execute upstream tests. SWE-bench applies candidate
        # patches in its official Docker evaluator.
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pinned official SWE-bench harness
        run: |
          set -euo pipefail
          python -m pip install \
            "git+https://github.com/SWE-bench/SWE-bench.git@f7bbbb2ccdf479001d6467c9e34af59e44a840f9"

      - name: Build the harness
        run: cargo build --release --bin formal-ai

      - name: Run the bounded upstream slice
        env:
          BENCHMARK_SLICE: ${{ inputs.slice || '20' }}
          SWE_BENCH_SLICE: ${{ inputs.swebench_slice || '1' }}
          BENCHMARK_SUITE: ${{ inputs.suite || 'all' }}
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          run_suite() {
            ./target/release/formal-ai benchmark run \
              --suite "$1" \
              --slice "$2" \
              --append \
              --learning-report "target/formal-ai-benchmarks/learning/$1.lino"
          }
          if [[ "${BENCHMARK_SUITE}" == 'all' ]]; then
            for suite in humaneval mbpp gsm8k math object_counting coedit egg_math editeval; do
              run_suite "${suite}" "${BENCHMARK_SLICE}"
            done
            run_suite ascent_transitive_closure 5
            run_suite swebench_lite "${SWE_BENCH_SLICE}"
          elif [[ "${BENCHMARK_SUITE}" == 'swebench_lite' ]]; then
            run_suite "${BENCHMARK_SUITE}" "${SWE_BENCH_SLICE}"
          elif [[ "${BENCHMARK_SUITE}" == 'ascent_transitive_closure' ]]; then
            run_suite "${BENCHMARK_SUITE}" 5
          else
            run_suite "${BENCHMARK_SUITE}" "${BENCHMARK_SLICE}"
          fi 2>&1 | tee ci-logs/external-benchmarks.log
          grep -E '^suite=' ci-logs/external-benchmarks.log >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify the monotonic ratchet
        run: |
          set -euo pipefail
          ./target/release/formal-ai benchmark ratchet

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-benchmarks-log
          path: |
            ci-logs/external-benchmarks.log
            target/formal-ai-benchmarks/learning/*.lino
          if-no-files-found: warn

      - name: Commit the refreshed ledger
        if: github.event_name == 'schedule' || inputs.commit
        run: |
          set -euo pipefail
          if git diff --quiet -- data/benchmarks/external-results.lino; then
            echo 'ledger unchanged; nothing to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/benchmarks/external-results.lino
          git commit -m 'chore(benchmarks): record scheduled upstream results (#698)'
          git push origin "HEAD:${GITHUB_REF_NAME}"
