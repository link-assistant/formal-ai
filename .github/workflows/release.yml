        env: { PORT: 8805, MODE: tui, ONLY: 838.L1, OUT: /tmp/formal-ai-tui-artifacts/task-ladder-results.json, TUI_ARTIFACT_DIR: /tmp/formal-ai-tui-artifacts/task-ladder, REQUIRE_ALL_PASS: 1 }
        run: experiments/issue_840_task_ladder/run_ladder.sh
      - name: "Run agent CLI E2E — auto-learning across two harnesses (issue #715)"
        timeout-minutes: 5
        env:
          PORT: 8879
        run: experiments/agent_cli_e2e/run_issue_715_learning.sh
      - name: "Run agent CLI E2E — self-hosting auto-learning (issue #657)"
        timeout-minutes: 5
        env:
          PORT: 8881
        run: experiments/agent_cli_e2e/run_issue_657_metric.sh
      - name: "Run agent CLI E2E — hardcoded-language auto-learning (issue #659)"
        timeout-minutes: 5
        env:
          PORT: 8882
        run: experiments/agent_cli_e2e/run_issue_659_learning.sh
      - name: "Run agent CLI E2E — bulk-lexeme auto-learning (issue #660)"
        timeout-minutes: 5
        env:
          PORT: 8883
        run: experiments/agent_cli_e2e/run_issue_660_learning.sh
      - name: "Run agent CLI E2E — handler-precedence auto-learning (issue #663)"
        timeout-minutes: 5
        env:
          PORT: 8885
        run: experiments/agent_cli_e2e/run_issue_663_learning.sh
      - name: "Run agent CLI E2E — client-contract auto-learning (issue #671)"
        timeout-minutes: 5
        env:
          PORT: 8886
        run: experiments/agent_cli_e2e/run_issue_671_contract_learning.sh
      - name: "Run agent CLI E2E — repository statement audit (issue #661)"
        timeout-minutes: 5
        env:
          PORT: 8884
        run: experiments/agent_cli_e2e/run_issue_661_statement_audit.sh
      - name: "Run agent CLI E2E — relative and whole-document audit (issue #885)"
        timeout-minutes: 5
        env:
          PORT: 8895
        run: experiments/agent_cli_e2e/run_issue_885_statement_audit.sh
      - name: "Run agent CLI E2E — proof translation invariant (issue #890)"
        run: PORT=8890 BIN=target/release/formal-ai OUT=/tmp/formal-ai-issue-890-evidence experiments/issue_890_agent_cli.sh
      - name: "Run agent CLI E2E — formal projection invariant (issue #917)"
        run: PORT=8917 BIN=target/release/formal-ai OUT=/tmp/formal-ai-issue-917-evidence experiments/issue_917_agent_cli.sh
      - name: "Run agent CLI E2E — minimal-core invariant (issue #918)"
        run: PORT=8918 BIN=target/release/formal-ai OUT=/tmp/formal-ai-issue-918-evidence experiments/issue_918_agent_cli.sh
      - name: Install @link-assistant/hive-mind CLI
        run: bun add -g --ignore-scripts @link-assistant/hive-mind@2.15.1
      - name: "Run Hive Mind full-circle integration gate (issue #921)"
        timeout-minutes: 5
        run: GH_TOKEN=${{ github.token }} PORT=8921 BIN=$PWD/target/release/formal-ai OUT=/tmp/formal-ai-issue-921-evidence experiments/issue_921_hive_mind_full_circle/run.sh
      - name: "Run agent CLI E2E — promoted method learning (issue #922)"
        run: PORT=8922 BIN=target/release/formal-ai OUT=/tmp/formal-ai-issue-922-evidence examples/issue-922-method-learning/run.sh
      - name: "Replay Hive Mind self-coding inner loop (issue #655)"
        env:
