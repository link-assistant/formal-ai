name: CI/CD Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Manual release mode'
        required: true
        type: choice
        default: 'instant'
        options:
          - instant
          - changelog-pr
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      description:
        description: 'Release description (optional)'
        required: false
        type: string
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_TERM_COLOR: always
  # Set this repository variable to true only while investigating sccache
  # backend failures. The shared setup action otherwise leaves logging off.
  FORMAL_AI_CI_VERBOSE: ${{ vars.FORMAL_AI_CI_VERBOSE || 'false' }}
  RUSTFLAGS: -Dwarnings
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
  CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-detect-changes
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    if: github.event_name != 'workflow_dispatch'
    outputs:
      rs-changed: ${{ steps.changes.outputs.rs-changed }}
      toml-changed: ${{ steps.changes.outputs.toml-changed }}
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
      workflow-changed: ${{ steps.changes.outputs.workflow-changed }}
      any-code-changed: ${{ steps.changes.outputs.any-code-changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install rust-script
        run: bash scripts/install-rust-script.sh
      - name: Detect changes
        id: changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: rust-script scripts/detect-code-changes.rs
  changelog:
    name: Changelog Fragment Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-changelog
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [detect-changes, build-artifacts]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.any-code-changed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install rust-script
        run: bash scripts/install-rust-script.sh
      - name: Check for changelog fragments
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: rust-script scripts/check-changelog-fragment.rs
  evidence-check:
    name: Self-Hosting Evidence Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-evidence-check
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install rust-script
        run: bash scripts/install-rust-script.sh
      - name: Validate Formal-AI trailers on this pull request
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/${GITHUB_BASE_REF}"
          merge_base="$(git merge-base "$base" HEAD)"
          echo "Validating commits in ${merge_base}..HEAD"
          rust-script scripts/self-hosting-metric.rs --since "$merge_base" --until HEAD
  docker-build:
    name: Docker Image Build & Runtime Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-docker-build
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [detect-changes, build-artifacts]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.any-code-changed == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Free up runner disk space
        run: bash scripts/free-runner-disk.sh
      - uses: ./.github/actions/download-formal-ai-binary
      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-resilient
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: formal-ai:pr-check
          # Publish jobs keep the default `compile`, so what ships is still
          # built from source (issue #1051).
          build-args: BINARY_SOURCE=prebuilt
          cache-from: type=gha
          # Issue #1057: prebuilt binary, nothing worth caching; exports were
          # evicting sccache from the shared 10GB pool.
          cache-to: type=inline
      - name: Verify image runtime contract
        run: |
          set -euo pipefail
          docker run --rm --privileged formal-ai:pr-check verify-formal-ai-dind
      - name: Log in to GHCR for the released upgrade fixture
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test released-to-candidate memory upgrade
        run: experiments/issue_982_memory_upgrade/run_container_upgrade.sh
      - if: ${{ !cancelled() }}
        run: scripts/prune-docker.sh
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-secrets-scan
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [detect-changes]
    if: |
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any-code-changed == 'true' ||
        needs.detect-changes.outputs.docs-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check for secrets
        env:
          BASE_REF: ${{ github.base_ref || github.event.before || 'HEAD~1' }}
        run: bash scripts/check-secrets.sh
  version-check:
    name: Version Modification Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-version-check
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install rust-script
        run: bash scripts/install-rust-script.sh
      - name: Check for manual version changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: rust-script scripts/check-version-modification.rs
  # Issue #1017 (D19): one commit for every base-branch merge in this run.
  base:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-base
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    uses: ./.github/workflows/pin-base-commit.yml
    permissions:
      contents: read
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [detect-changes, base]
    if: |
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any-code-changed == 'true' ||
        needs.detect-changes.outputs.rs-changed == 'true' ||
        needs.detect-changes.outputs.toml-changed == 'true' ||
        needs.detect-changes.outputs.docs-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with base branch (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_COMMIT: ${{ needs.base.outputs.commit }}  # issue #1017: see `base`
        run: bash scripts/simulate-fresh-merge.sh
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/setup-sccache
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install rust-script
        run: bash scripts/install-rust-script.sh
      - uses: ./.github/actions/cache-cargo-registry
      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /tmp actionlint
          # GitHub supports queue; actionlint schema lag: https://github.com/rhysd/actionlint/issues/657
          /tmp/actionlint -color \
            -ignore 'unexpected key "queue" for "concurrency" section'
      - name: Run registered gates (stage rust)
        # Issue #991: the gate list lives in data/meta/ci-gates/, one file per
        # gate, so adding a gate no longer edits this file.
        env:
          FILE_SIZE_WARNING_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: rust-script scripts/run-ci-gates.rs --stage rust
      - name: Build Rust→WASM worker
        run: sh src/web/wasm-worker/build.sh
      - name: Run registered gates (stage wasm)
        run: rust-script scripts/run-ci-gates.rs --stage wasm
      - name: Install web bundle dependencies
        run: bun install --frozen-lockfile
      - name: Build web vendor bundle
        run: bun run build:web
      - name: Check web bundles are current
        run: git diff --exit-code -- src/web/vendor.bundle.js src/web/web-search-component.bundle.js src/web/ocr.bundle.js src/web/app.js
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install web test dependencies
        run: npm ci --prefix tests/e2e --no-audit --no-fund
      - name: Run registered gates (stage web)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: rust-script scripts/run-ci-gates.rs --stage web
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.test-suite }})
    runs-on: ${{ matrix.os }}
    # Issue #1017: run 31937348472 used 1415s of a 1500s cap with 455s outside
    # the budgeted step, so the 1200s budget could never expire first. The cap
    # is the backstop; the budget is the deadline.
    timeout-minutes: 35
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-${{ matrix.os }}-${{ matrix.test-suite }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [detect-changes, base, build-artifacts]
    if: |
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any-code-changed == 'true' ||
        needs.detect-changes.outputs.rs-changed == 'true' ||
        needs.detect-changes.outputs.toml-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, test-suite: full }
          - { os: macos-15-intel, test-suite: specification }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Simulate fresh merge with base branch (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_COMMIT: ${{ needs.base.outputs.commit }}  # issue #1017: see `base`
        run: bash scripts/simulate-fresh-merge.sh
      - name: Free up runner disk space
        run: bash scripts/free-runner-disk.sh
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/setup-sccache
      - name: Restore cargo registry cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check LiNo data integrity
        if: matrix.test-suite == 'full'
        run: cargo test --test unit data_files -- --nocapture
      - name: sccache counters after the first compiling step
        run: sccache --show-stats
      - name: Check self-AST census freshness
        if: matrix.test-suite == 'full'
        run: cargo test --test unit self_ast_census -- --nocapture
      # Issue #1055: built once above; this only runs them. The binary comes
      # too, because `CARGO_BIN_EXE_formal-ai` bakes `target/release/formal-ai`
      # into each executable at compile time -- 109 call sites across 36 test
      # files spawn it -- so the path has to exist here as well.
      - name: Download test executables
        if: matrix.test-suite == 'full'
        uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: formal-ai-test-executables
          path: dist/tests
      - uses: ./.github/actions/download-formal-ai-binary
        if: matrix.test-suite == 'full'
      - name: Run tests
        if: matrix.test-suite == 'full'
        env:
          TEST_BUDGET_SECONDS: 1200
          TEST_WARN_RATIO_PERCENT: 70
        run: |
          chmod +x dist/tests/*
          scripts/run-with-budget-warning.sh \
            "$TEST_BUDGET_SECONDS" "Test suite" \
            bash scripts/run-prebuilt-tests.sh
      # Issue #1053: 1400s covers a cold rebuild after a profile change, and
      # stays at 66% of the 35m cap, inside the 70% the budget gate allows.
      - name: Run specification tests
        if: matrix.test-suite == 'specification'
        env:
          TEST_BUDGET_SECONDS: 1400
          TEST_WARN_RATIO_PERCENT: 70
        run: |
          scripts/run-with-budget-warning.sh \
            "$TEST_BUDGET_SECONDS" "Specification test shard" \
            cargo test --test unit --all-features --verbose specification::
      - name: Run doc tests
        if: matrix.test-suite == 'full'
        run: cargo test --doc --verbose
  macos-core-tests:
    name: macOS Core Tests
    needs: [detect-changes, base]
    # Issue #1017: the heaviest lane here (one archive build plus sixteen Intel
    # macOS slices at 10x the Linux rate) had no concurrency group, so a second
    # push doubled it. `main` never cancels, keeping issue #977's rule intact.
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-macos-core-tests
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    if: |
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any-code-changed == 'true' ||
        needs.detect-changes.outputs.rs-changed == 'true' ||
        needs.detect-changes.outputs.toml-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    uses: ./.github/workflows/macos-core-tests.yml
    # Issue #1017: archive and slices must merge the same base commit.
    with:
      base-commit: ${{ needs.base.outputs.commit }}
    permissions:
      contents: read
  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [lint, test, macos-core-tests, build-artifacts]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.test.result == 'success' && needs.macos-core-tests.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-sccache
      - name: Install rust-script
        run: bash scripts/install-rust-script.sh
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
      # Issue #1055: the binary exists; packaging needs no rebuild.
      - uses: ./.github/actions/download-formal-ai-binary
      - name: Check package
        run: cargo package --list --allow-dirty
      - name: Check crate package size
        run: rust-script scripts/check-crate-package-size.rs
  auto-release:
    name: Auto Release
    concurrency:
      group: formal-ai-repository-writes
      queue: max
    needs: [lint, test, build, secrets-scan, test-e2e-local, test-agent-cli-e2e]
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' &&
      (needs.secrets-scan.result == 'success' || needs.secrets-scan.result == 'skipped') &&
      (needs.test-e2e-local.result == 'success' || needs.test-e2e-local.result == 'skipped') &&
      (needs.test-agent-cli-e2e.result == 'success' || needs.test-agent-cli-e2e.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pages_sha: ${{ steps.release_pages_ref.outputs.sha }}
      pages_version: ${{ steps.release_pages_ref.outputs.version }}
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install rust-script
        run: bash scripts/install-rust-script.sh
      - name: Configure git
        run: rust-script scripts/git-config.rs
      - name: Determine bump type from changelog fragments
        id: bump_type
        run: rust-script scripts/get-bump-type.rs
      - name: Check if version already released or no fragments
        id: check
        env:
          HAS_FRAGMENTS: ${{ steps.bump_type.outputs.has_fragments }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rust-script scripts/check-release-needed.rs
      - name: Apply self-development release gate
        id: release_gate
        if: steps.check.outputs.should_release == 'true'
        env:
          SKIP_BUMP: ${{ steps.check.outputs.skip_bump }}
        run: rust-script scripts/check-self-development-release.rs
      - name: Collect changelog and bump version
        id: version
        if: steps.release_gate.outputs.should_release == 'true' && steps.check.outputs.skip_bump != 'true'
        run: |
          rust-script scripts/version-and-commit.rs \
            --bump-type "${{ steps.bump_type.outputs.bump_type }}"
      - name: Get current version
        id: current_version
        if: steps.release_gate.outputs.should_release == 'true'
        run: rust-script scripts/get-version.rs
      - name: Build release
        if: steps.release_gate.outputs.should_release == 'true'
        run: cargo build --release
      - name: Publish to Crates.io
        if: steps.release_gate.outputs.should_release == 'true' && steps.check.outputs.crate_published != 'true'
        id: publish-crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: rust-script scripts/publish-crate.rs
      - name: Wait for Crate availability on Crates.io
        if: |
          steps.release_gate.outputs.should_release == 'true' && (
            steps.check.outputs.crate_published == 'true' ||
            steps.publish-crate.outputs.publish_result == 'success'
          )
        run: rust-script scripts/wait-for-crate.rs --release-version "${{ steps.current_version.outputs.version }}"
      - name: Smoke test the published crate
        if: |
          steps.release_gate.outputs.should_release == 'true' && (
            steps.check.outputs.crate_published == 'true' ||
            steps.publish-crate.outputs.publish_result == 'success'
          )
        run: scripts/smoke-test-published-crate.sh "${{ steps.current_version.outputs.version }}"
      - name: Free up runner disk space
        if: |
          steps.release_gate.outputs.should_release == 'true' && (
            steps.check.outputs.crate_published == 'true' ||
            steps.publish-crate.outputs.publish_result == 'success'
          )
        run: bash scripts/free-runner-disk.sh
      - name: Log in to GitHub Container Registry
        if: |
          steps.release_gate.outputs.should_release == 'true' && (
            steps.check.outputs.crate_published == 'true' ||
            steps.publish-crate.outputs.publish_result == 'success'
          )
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        if: |
          steps.release_gate.outputs.should_release == 'true' && (
            steps.check.outputs.crate_published == 'true' ||
            steps.publish-crate.outputs.publish_result == 'success'
          )
        uses: ./.github/actions/setup-buildx-resilient
      - name: Extract GHCR Docker metadata
        if: |
          steps.release_gate.outputs.should_release == 'true' && (
            steps.check.outputs.crate_published == 'true' ||
            steps.publish-crate.outputs.publish_result == 'success'
          )
        id: ghcr-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.current_version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.current_version.outputs.version }}
      - name: Publish Docker image to GHCR
        if: |
          steps.release_gate.outputs.should_release == 'true' && (
            steps.check.outputs.crate_published == 'true' ||
            steps.publish-crate.outputs.publish_result == 'success'
          )
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.ghcr-meta.outputs.tags }}
          labels: ${{ steps.ghcr-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the published GHCR image is anonymously pullable
        if: |
          steps.release_gate.outputs.should_release == 'true' && (
            steps.check.outputs.crate_published == 'true' ||
            steps.publish-crate.outputs.publish_result == 'success'
          )
        run: bash scripts/verify-ghcr-visibility.sh
      - name: Configure Docker Hub publishing
        if: |
          steps.release_gate.outputs.should_release == 'true' && (
            steps.check.outputs.crate_published == 'true' ||
            steps.publish-crate.outputs.publish_result == 'success'
          )
        id: dockerhub
        run: bash scripts/configure-dockerhub-publishing.sh
      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Extract Docker metadata
        if: steps.dockerhub.outputs.enabled == 'true'
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.current_version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.current_version.outputs.version }}
      - name: Publish Docker image to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha
          # Issue #1057: the GHCR leg above already exported these layers.
          cache-to: type=inline
      - name: Create GitHub Release
        if: |
          steps.release_gate.outputs.should_release == 'true' && (
            steps.check.outputs.crate_published == 'true' ||
            steps.publish-crate.outputs.publish_result == 'success'
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_URL: https://github.com/${{ github.repository }}/pkgs/container/formal-ai
          DOCKER_HUB_URL: ${{ steps.dockerhub.outputs.docker_hub_url }}
          RELEASE_VERSION: ${{ steps.version.outputs.new_version || steps.current_version.outputs.version }}
        run: bash scripts/invoke-create-github-release.sh
      - name: Resolve Pages deploy ref
        id: release_pages_ref
        if: always()
        run: |
          sha="$(git rev-parse HEAD)"
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error file=Cargo.toml::Could not read formal-ai version from Cargo.toml"
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Pages deploy ref: ${sha} (formal-ai ${version})"
  manual-release:
    name: Instant Release
    concurrency:
      group: formal-ai-repository-writes
      queue: max
    needs: [lint, test, build, secrets-scan, test-e2e-local, test-agent-cli-e2e]
    if: |
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.release_mode == 'instant' &&
      needs.build.result == 'success' &&
      (needs.secrets-scan.result == 'success' || needs.secrets-scan.result == 'skipped') &&
      (needs.test-e2e-local.result == 'success' || needs.test-e2e-local.result == 'skipped') &&
      (needs.test-agent-cli-e2e.result == 'success' || needs.test-agent-cli-e2e.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pages_sha: ${{ steps.release_pages_ref.outputs.sha }}
      pages_version: ${{ steps.release_pages_ref.outputs.version }}
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install rust-script
        run: bash scripts/install-rust-script.sh
      - name: Configure git
        run: rust-script scripts/git-config.rs
      - name: Version and commit
        id: version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: rust-script scripts/version-and-commit.rs --bump-type "${{ github.event.inputs.bump_type }}" --description "${{ github.event.inputs.description }}"
      - name: Build release
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        run: cargo build --release
      - name: Publish to Crates.io
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        id: publish-crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: rust-script scripts/publish-crate.rs
      - name: Wait for Crate availability on Crates.io
        if: |
          (steps.version.outputs.version_committed == 'true' ||
            steps.version.outputs.already_released == 'true') &&
          steps.publish-crate.outputs.publish_result == 'success'
        run: rust-script scripts/wait-for-crate.rs --release-version "${{ steps.version.outputs.new_version }}"
      - name: Smoke test the published crate
        if: |
          (steps.version.outputs.version_committed == 'true' ||
            steps.version.outputs.already_released == 'true') &&
          steps.publish-crate.outputs.publish_result == 'success'
        run: scripts/smoke-test-published-crate.sh "${{ steps.version.outputs.new_version }}"
      - name: Free up runner disk space
        if: |
          (steps.version.outputs.version_committed == 'true' ||
            steps.version.outputs.already_released == 'true') &&
          steps.publish-crate.outputs.publish_result == 'success'
        run: bash scripts/free-runner-disk.sh
      - name: Log in to GitHub Container Registry
        if: |
          (steps.version.outputs.version_committed == 'true' ||
            steps.version.outputs.already_released == 'true') &&
          steps.publish-crate.outputs.publish_result == 'success'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        if: |
          (steps.version.outputs.version_committed == 'true' ||
            steps.version.outputs.already_released == 'true') &&
          steps.publish-crate.outputs.publish_result == 'success'
        uses: ./.github/actions/setup-buildx-resilient
      - name: Extract GHCR Docker metadata
        if: |
          (steps.version.outputs.version_committed == 'true' ||
            steps.version.outputs.already_released == 'true') &&
          steps.publish-crate.outputs.publish_result == 'success'
        id: ghcr-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.new_version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.new_version }}
      - name: Publish Docker image to GHCR
        if: |
          (steps.version.outputs.version_committed == 'true' ||
            steps.version.outputs.already_released == 'true') &&
          steps.publish-crate.outputs.publish_result == 'success'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.ghcr-meta.outputs.tags }}
          labels: ${{ steps.ghcr-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the published GHCR image is anonymously pullable
        if: |
          (steps.version.outputs.version_committed == 'true' ||
            steps.version.outputs.already_released == 'true') &&
          steps.publish-crate.outputs.publish_result == 'success'
        run: bash scripts/verify-ghcr-visibility.sh
      - name: Configure Docker Hub publishing
        if: |
          (steps.version.outputs.version_committed == 'true' ||
            steps.version.outputs.already_released == 'true') &&
          steps.publish-crate.outputs.publish_result == 'success'
        id: dockerhub
        run: bash scripts/configure-dockerhub-publishing.sh
      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Extract Docker metadata
        if: steps.dockerhub.outputs.enabled == 'true'
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.new_version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.new_version }}
      - name: Publish Docker image to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha
          # Issue #1057: the GHCR leg above already exported these layers.
          cache-to: type=inline
      - name: Create GitHub Release
        if: |
          (steps.version.outputs.version_committed == 'true' ||
            steps.version.outputs.already_released == 'true') &&
          steps.publish-crate.outputs.publish_result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_URL: https://github.com/${{ github.repository }}/pkgs/container/formal-ai
          DOCKER_HUB_URL: ${{ steps.dockerhub.outputs.docker_hub_url }}
          RELEASE_VERSION: ${{ steps.version.outputs.new_version }}
        run: bash scripts/invoke-create-github-release.sh
      - name: Resolve Pages deploy ref
        id: release_pages_ref
        if: always()
        run: |
          sha="$(git rev-parse HEAD)"
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error file=Cargo.toml::Could not read formal-ai version from Cargo.toml"
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Pages deploy ref: ${sha} (formal-ai ${version})"
  changelog-pr:
    name: Create Changelog PR
    concurrency:
      group: formal-ai-repository-writes
      queue: max
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'changelog-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install rust-script
        run: bash scripts/install-rust-script.sh
      - name: Create changelog fragment
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: rust-script scripts/create-changelog-fragment.rs --bump-type "${{ github.event.inputs.bump_type }}" --description "${{ github.event.inputs.description }}"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: add changelog for manual ${{ github.event.inputs.bump_type }} release'
          branch: changelog-manual-release-${{ github.run_id }}
          delete-branch: true
          title: 'chore: manual ${{ github.event.inputs.bump_type }} release'
          body: |
            This PR was created by a manual workflow trigger to prepare a **${{ github.event.inputs.bump_type }}** release.
            - **Type:** ${{ github.event.inputs.bump_type }}
            - **Description:** ${{ github.event.inputs.description || 'Manual release' }}
            - **Triggered by:** @${{ github.actor }}
            1. Review the changelog fragment in this PR
            2. Merge this PR to main
            3. The automated release workflow will publish to crates.io and create a GitHub release
  test-e2e-local:
    name: E2E Tests (local web app)
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-e2e-local
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [detect-changes]
    if: |
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any-code-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install web bundle dependencies
        run: bun install --frozen-lockfile
      - name: Build web vendor bundle
        run: bun run build:web
      - name: Install Playwright and dependencies
        run: |
          cd tests/e2e
          npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright system dependencies (best effort)
        timeout-minutes: 6
        continue-on-error: true
        run: |
          cd tests/e2e
          npx playwright install-deps chromium
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: |
          cd tests/e2e
          npx playwright install chromium
      - name: Sync data/seed into src/web/seed (deployment mirror)
        run: scripts/sync-seed.sh
      - name: Run local e2e tests
        run: |
          cd tests/e2e
          npx playwright test --config=playwright.local.config.js
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-local
          path: tests/e2e/playwright-report/
          retention-days: 7
      - name: Upload generated /download screenshots
        uses: actions/upload-artifact@v7
        with:
          name: download-page-screenshots
          path: |
            docs/screenshots/issue-347/
            src/web/download/assets/app-preview*.png
          retention-days: 14
          if-no-files-found: error
  test-agent-cli-e2e:
    name: E2E Tests (agent CLI ↔ formal-ai)
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-agent-cli-e2e
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 32
    needs: [detect-changes, build-artifacts]
