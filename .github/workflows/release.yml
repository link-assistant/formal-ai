            /tmp/formal-ai-serve-*.log
            /tmp/agent-out-*.log
            /tmp/formal-ai-issue-707-evidence
            /tmp/formal-ai-issue-890-evidence
            /tmp/formal-ai-issue-917-evidence
            /tmp/formal-ai-issue-918-evidence
            /tmp/formal-ai-issue-921-evidence
            /tmp/formal-ai-issue-922-evidence
          retention-days: 7
      - name: Upload TUI transcripts and replay artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: agent-cli-tui-replays, path: /tmp/formal-ai-tui-artifacts, if-no-files-found: ignore, retention-days: 7 }
  # Build the host binary once for the seven Box image legs. The audited run
  # compiled the same Linux binary seven times and reported 1,131 cache write
  # errors across those legs; the available logs do not include backend error
  # details, so opt-in diagnostics live in the shared sccache setup action.
  build-artifacts:
    name: Build binaries and tests
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-artifacts
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-changes]
    if: |
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any-code-changed == 'true' ||
        needs.detect-changes.outputs.rs-changed == 'true' ||
        needs.detect-changes.outputs.toml-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v7
      - name: Free up runner disk space
        run: bash scripts/free-runner-disk.sh
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-sccache
      - uses: ./.github/actions/cache-cargo-registry
        with:
          prefix: artifacts-
      # Issue #1055: one compile per platform; consumers download the results.
      - name: Build binaries and test executables
        run: cargo test --release --no-run --bins --tests --all-features
      - name: Collect the build artifacts
        run: bash scripts/collect-build-artifacts.sh
      - name: Upload formal-ai binaries
        uses: actions/upload-artifact@v7
        with:
          name: formal-ai-release-binary
          path: dist/*
          retention-days: 1
      - name: Upload test executables
        uses: actions/upload-artifact@v7
        with:
          name: formal-ai-test-executables
          path: dist/tests
          retention-days: 1
  # Issue #932 (follow-up of PR #119): a generated project for a language is
  # built and run inside the link-foundation/box image that matches that
  # language, using the language's own init commands. The matrix keeps each
  # image on its own runner, so one leg only pulls the toolchain it needs.
  box-language-projects:
    name: Box Image Projects (${{ matrix.language }})
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-box-language-projects-${{ matrix.language }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect-changes, build-artifacts]
    if: |
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any-code-changed == 'true' ||
        needs.detect-changes.outputs.rs-changed == 'true' ||
        needs.detect-changes.outputs.toml-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        # Kept in step with `data/meta/box-language-projects.lino` by
        # `tests/unit/ci-cd/issue_932.rs`.
        language: [rust, python, javascript, typescript, go, java, ruby]
    steps:
      - uses: actions/checkout@v7
      # A box unpacks to 4-8 GB, more than a stock runner has spare after setup.
      - name: Free up runner disk space
        run: bash scripts/free-runner-disk.sh
      - uses: ./.github/actions/download-formal-ai-binary
      - name: Generate the ${{ matrix.language }} project from Formal-AI answers
        run: scripts/generate-box-language-corpus.sh ${{ matrix.language }}
      - name: Build and run it inside its link-foundation/box image
        run: STRICT=1 SKIP_GENERATE=1 scripts/verify-box-language-projects.sh ${{ matrix.language }}
      - name: Upload the generated project
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: box-language-corpus-${{ matrix.language }}
          path: target/box-language-corpus/${{ matrix.language }}/
          retention-days: 7
          # `always()` also covers a leg that failed before generating anything.
          if-no-files-found: warn
      - if: ${{ !cancelled() }}
        run: scripts/prune-docker.sh
  deploy-pages:
    name: Deploy Web App to GitHub Pages
    concurrency:
      group: formal-ai-repository-writes
      queue: max
    needs: [build, auto-release, manual-release]
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      pages_sha: ${{ steps.pages_ref.outputs.sha }}
    if: |
      !cancelled() &&
      needs.build.result == 'success' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.auto-release.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'instant' && needs.manual-release.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Select Pages deployment ref
        id: pages_ref
        env:
          PAGES_DEPLOY_SHA: ${{ needs.auto-release.outputs.pages_sha || needs.manual-release.outputs.pages_sha || github.sha }}
        run: |
          if [ -z "$PAGES_DEPLOY_SHA" ]; then
            echo "::error::Could not resolve Pages deployment SHA"
            exit 1
          fi
          echo "sha=${PAGES_DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "Pages deployment SHA: ${PAGES_DEPLOY_SHA}"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pages_ref.outputs.sha }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install web bundle dependencies
        run: bun install --frozen-lockfile
      - name: Build web vendor bundle
        run: bun run build:web
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Free up runner disk space
        run: bash scripts/free-runner-disk.sh
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-
      - name: Generate Rust API docs (cargo doc)
        env:
          RUSTDOCFLAGS: -D warnings
        run: bash scripts/build-rust-api-docs.sh
      - name: Sync data/seed into src/web/seed (deployment mirror)
        run: scripts/sync-seed.sh
      - name: Read formal-ai version from Cargo.toml
        id: formal_ai_version
        run: |
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error file=Cargo.toml::Could not read formal-ai version from Cargo.toml"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Detected formal-ai version: ${version}"
      - name: Stamp GitHub Pages artifact
        run: scripts/stamp-pages-artifact.sh src/web "${{ steps.pages_ref.outputs.sha }}" "${{ steps.pages_ref.outputs.sha }}" "${{ steps.formal_ai_version.outputs.version }}"
      - name: Copy Rust API docs into the Pages artifact (/docs/api)
        run: |
          mkdir -p src/web/docs/api
          cp -R target/doc/. src/web/docs/api/
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: src/web
          include-hidden-files: true
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
        env:
          # deploy-pages upstream issue #434 tracks its core punycode deprecation.
          NODE_OPTIONS: --disable-warning=DEP0040
  test-e2e-pages:
    name: E2E Tests (GitHub Pages)
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-e2e-pages
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [deploy-pages]
    if: |
      !cancelled() &&
      needs.deploy-pages.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Playwright and dependencies
        run: |
          cd tests/e2e
          npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright system dependencies (best effort)
        timeout-minutes: 6
        continue-on-error: true
        run: |
          cd tests/e2e
          npx playwright install-deps chromium
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: |
          cd tests/e2e
          npx playwright install chromium
      - name: Wait for GitHub Pages deployment
        env:
          PAGES_DEPLOY_SHA: ${{ needs.deploy-pages.outputs.pages_sha || github.sha }}
        run: scripts/wait-for-pages-deployment.sh "${{ needs.deploy-pages.outputs.page_url }}" "$PAGES_DEPLOY_SHA"
      - name: Run GitHub Pages e2e tests
        run: |
          cd tests/e2e
          PAGES_URL="${{ needs.deploy-pages.outputs.page_url }}" npx playwright test --config=playwright.pages.config.js
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-pages
          path: tests/e2e/playwright-report/
          retention-days: 7
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [detect-changes, changelog, evidence-check, docker-build, secrets-scan,
            version-check, base, lint, test, macos-core-tests, build, auto-release, manual-release,
            changelog-pr, test-e2e-local, test-agent-cli-e2e,
            build-artifacts, box-language-projects, deploy-pages,
            test-e2e-pages]
    steps:
      - uses: actions/checkout@v7
      - name: Fail the run when a required job was cancelled or failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: bash scripts/check-pipeline-status.sh
