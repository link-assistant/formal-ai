      pages_sha: ${{ steps.release_pages_ref.outputs.sha }}
      pages_version: ${{ steps.release_pages_ref.outputs.version }}
      container-tag: ${{ steps.create-release.outcome == 'success' && format('v{0}', needs.auto_prepare-source.outputs.version) || '' }}
    steps:
      - name: Check out exact independently selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.auto_prepare-source.outputs.source_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install exact selected Rust compiler
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.auto_prepare-source.outputs.rust_version }}
      - name: Install original rust-script runtime
        run: bash scripts/install-rust-script.sh
      - name: Check out immutable trusted workflow protocol
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: _protocol
          persist-credentials: false
      - name: Download immutable selected source artifact
        if: ${{ needs.auto_prepare-source.outputs.active == 'true' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.auto_prepare-source.outputs.artifact_id }}
          path: .release-transfer/source
          digest-mismatch: error
      - name: Verify independent source compiler protocol and main tag authority
        if: ${{ needs.auto_prepare-source.outputs.active == 'true' }}
        run: node _protocol/scripts/release-stage-transfer.mjs verify-source
      - name: Download immutable images artifact
        if: ${{ needs.auto_prepare-source.outputs.active == 'true' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.auto_publish-verify-images.outputs.artifact_id }}
          path: .release-transfer/images
          digest-mismatch: error
      - name: Validate physical images producer transfer
        if: ${{ needs.auto_prepare-source.outputs.active == 'true' }}
        env:
          EXPECT_BUNDLE: ${{ needs.auto_publish-verify-images.outputs.bundle_sha }}
          EXPECT_DESCRIPTOR: ${{ needs.auto_publish-verify-images.outputs.descriptor_sha }}
          EXPECT_PRODUCER: auto_publish-verify-images
        run: node _protocol/scripts/release-stage-transfer.mjs import images
      - name: Fail closed before any release publication
        if: ${{ needs.auto_prepare-source.outputs.active == 'true' }}
