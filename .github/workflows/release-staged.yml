            needs.manual_prepare-source.outputs.version__already_released == 'true') &&
          needs.manual_publish-crate.outputs.publish-crate__publish_result == 'success'
        run: bash scripts/verify-ghcr-visibility.sh
      - name: Verify anonymous access to the immutable published manifest
        if: steps.ghcr-publish.outputs.digest != ''
        timeout-minutes: 2
        env:
          IMAGE_REFERENCE: ${{ env.GHCR_IMAGE }}@${{ steps.ghcr-publish.outputs.digest }}
        run: node scripts/verify-anonymous-image-manifest.mjs "$IMAGE_REFERENCE"
      - name: Configure Docker Hub publishing
        if: |
          (needs.manual_prepare-source.outputs.version__version_committed == 'true' ||
            needs.manual_prepare-source.outputs.version__already_released == 'true') &&
          needs.manual_publish-crate.outputs.publish-crate__publish_result == 'success'
        id: dockerhub
        run: bash scripts/configure-dockerhub-publishing.sh
      - name: Log in to Docker Hub
