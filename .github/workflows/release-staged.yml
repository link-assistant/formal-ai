        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        if: |
          (needs.manual_prepare-source.outputs.version__version_committed == 'true' ||
            needs.manual_prepare-source.outputs.version__already_released == 'true') &&
          needs.manual_publish-crate.outputs.publish-crate__publish_result == 'success'
        uses: ./.github/actions/setup-buildx-resilient
      - name: Expose actual BuildKit cache runtime
        if: |
          (needs.manual_prepare-source.outputs.version__version_committed == 'true' ||
            needs.manual_prepare-source.outputs.version__already_released == 'true') &&
          needs.manual_publish-crate.outputs.publish-crate__publish_result == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            for (const key of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[key];
              if (!value) throw new Error(`Required BuildKit cache environment missing: ${key}`);
              if (key === 'ACTIONS_RUNTIME_TOKEN') core.setSecret(value);
              core.exportVariable(key, value);
            }
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'true');
      - name: Publish Docker image to GHCR
        id: ghcr-publish
        if: |
          (needs.manual_prepare-source.outputs.version__version_committed == 'true' ||
