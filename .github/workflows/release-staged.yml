        env:
          RELEASE_VERSION: ${{ needs.manual_prepare-source.outputs.version__new_version }}
          RELEASE_MODE: ${{ github.event.inputs.release_mode || '' }}
        run: node _protocol/scripts/release-image-factory.mjs mirror prepared-release "$RELEASE_VERSION" "$DOCKERHUB_IMAGE"
