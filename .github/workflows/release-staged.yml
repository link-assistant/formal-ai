          retention-days: 7
  auto_create-release:
    name: auto create-release
    permissions:
      contents: write
    needs: [auto_prepare-source, auto_compile-release, auto_verify-package, auto_publish-crate, auto_registry-availability, auto_published-crate-smoke, auto_publish-verify-images]
    if: ${{ always() && needs.auto_prepare-source.result == 'success' && (needs.auto_prepare-source.outputs.active != 'true' || (needs.auto_compile-release.result == 'success' && needs.auto_verify-package.result == 'success' && needs.auto_publish-crate.result == 'success' && needs.auto_registry-availability.result == 'success' && needs.auto_published-crate-smoke.result == 'success' && needs.auto_publish-verify-images.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.auto_prepare-source.outputs.version }}
      EXPECT_SOURCE: ${{ needs.auto_prepare-source.outputs.source_sha }}
      EXPECT_TREE: ${{ needs.auto_prepare-source.outputs.source_tree }}
      EXPECT_COMPILER: ${{ needs.auto_prepare-source.outputs.compiler_sha }}
      EXPECT_SOURCE_DESCRIPTOR: ${{ needs.auto_prepare-source.outputs.source_descriptor_sha }}
      EXPECT_SOURCE_ARCHIVE: ${{ needs.auto_prepare-source.outputs.source_archive_sha }}
