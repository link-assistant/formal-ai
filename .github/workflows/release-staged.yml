    needs: [manual_prepare-source, manual_compile-release, manual_verify-package, manual_publish-crate, manual_registry-availability, manual_published-crate-smoke]
    if: ${{ needs.manual_prepare-source.outputs.active == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.manual_prepare-source.outputs.version }}
      EXPECT_SOURCE: ${{ needs.manual_prepare-source.outputs.source_sha }}
      EXPECT_TREE: ${{ needs.manual_prepare-source.outputs.source_tree }}
      EXPECT_COMPILER: ${{ needs.manual_prepare-source.outputs.compiler_sha }}
      EXPECT_SOURCE_DESCRIPTOR: ${{ needs.manual_prepare-source.outputs.source_descriptor_sha }}
      EXPECT_SOURCE_ARCHIVE: ${{ needs.manual_prepare-source.outputs.source_archive_sha }}
