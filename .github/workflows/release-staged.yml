name: Staged release candidate
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
    outputs:
      pages_sha:
        value: ${{ jobs.auto_create-release.outputs.pages_sha || jobs.manual_create-release.outputs.pages_sha }}
      pages_version:
        value: ${{ jobs.auto_create-release.outputs.pages_version || jobs.manual_create-release.outputs.pages_version }}
      container-tag:
        value: ${{ jobs.auto_create-release.outputs.container-tag || jobs.manual_create-release.outputs.container-tag }}
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_TERM_COLOR: always
  FORMAL_AI_CI_VERBOSE: ${{ vars.FORMAL_AI_CI_VERBOSE || 'false' }}
  FORMAL_AI_NON_LINUX_CI: ${{ vars.FORMAL_AI_NON_LINUX_CI || 'skip' }}
  RUSTFLAGS: -Dwarnings
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
  CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'konard/formal-ai' }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || 'konard' }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  RELEASE_MODE: ${{ github.event.inputs.release_mode || '' }}
  STAGED_RELEASE_MODE: ${{ inputs.mode }}
jobs:
  auto_prepare-source:
    name: auto prepare-source
    permissions:
      contents: write
    if: ${{ inputs.mode == 'auto' && github.ref == 'refs/heads/main' && github.workflow_ref == format('{0}/.github/workflows/release.yml@refs/heads/main', github.repository) && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECT_BINARY_PRODUCER: auto_compile-release
    outputs:
      check__should_release: ${{ steps.check.outputs.should_release }}
      current_version__version: ${{ steps.current_version.outputs.version }}
      prepared__crate_published: ${{ steps.prepared.outputs.crate_published }}
      version__new_version: ${{ steps.version.outputs.new_version }}
      active: ${{ steps.check.outputs.should_release == 'true' }}
      source_sha: ${{ steps.capture-source.outputs.source_sha || steps.baseline-source.outputs.source_sha }}
      source_tree: ${{ steps.capture-source.outputs.source_tree || steps.baseline-source.outputs.source_tree }}
      version: ${{ steps.capture-source.outputs.version || steps.baseline-source.outputs.version }}
      compiler_sha: ${{ steps.capture-source.outputs.compiler_sha || steps.baseline-source.outputs.compiler_sha }}
      rust_version: ${{ steps.capture-source.outputs.rust_version || steps.baseline-source.outputs.rust_version }}
      source_descriptor_sha: ${{ steps.capture-source.outputs.source_descriptor_sha }}
      source_archive_sha: ${{ steps.capture-source.outputs.source_archive_sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install rust-script
        run: bash scripts/install-rust-script.sh
      - name: Configure git
        run: rust-script scripts/git-config.rs
      - name: Determine bump type from changelog fragments
        id: bump_type
        run: rust-script scripts/get-bump-type.rs
      - name: Check if version already released or no fragments
        id: check
        env:
          HAS_FRAGMENTS: ${{ steps.bump_type.outputs.has_fragments }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rust-script scripts/check-release-needed.rs
      - name: Collect changelog and bump version
        id: version
        if: steps.check.outputs.should_release == 'true' && steps.check.outputs.skip_bump != 'true'
        env:
          # Issue #1085 (D3.3): the ledger row names who opened each qualifying
          # pull request, read through `gh` with the job token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORMAL_AI_PULL_REQUEST_AUTHOR_LOOKUP: gh
        run: |
          rust-script scripts/version-and-commit.rs \
            --bump-type "${{ steps.bump_type.outputs.bump_type }}" \
            --resume-prepared \
            --branch main
      - name: Get current version
        id: current_version
        if: steps.check.outputs.should_release == 'true'
        run: rust-script scripts/get-version.rs
      - name: Recheck prepared release state
        id: prepared
        if: steps.check.outputs.should_release == 'true'
        env:
          HAS_FRAGMENTS: 'false'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rust-script scripts/check-release-needed.rs
      - name: Check out immutable trusted workflow protocol
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: _protocol
          persist-credentials: false
      - name: Record actual selected source and compiler baseline
        id: baseline-source
        run: node _protocol/scripts/release-stage-transfer.mjs baseline
      - name: Seal actual tagged main source artifact
        id: capture-source
        if: ${{ steps.check.outputs.should_release == 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.new_version || steps.current_version.outputs.version }}
        run: node _protocol/scripts/release-stage-transfer.mjs capture-source
      - name: Upload immutable source artifact
        id: upload
        if: ${{ steps.check.outputs.should_release == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: staged-auto-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-transfer/source/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  auto_compile-release:
    name: auto compile-release
    needs: [auto_prepare-source]
    if: ${{ needs.auto_prepare-source.outputs.active == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.auto_prepare-source.outputs.version }}
      EXPECT_SOURCE: ${{ needs.auto_prepare-source.outputs.source_sha }}
      EXPECT_TREE: ${{ needs.auto_prepare-source.outputs.source_tree }}
      EXPECT_COMPILER: ${{ needs.auto_prepare-source.outputs.compiler_sha }}
      EXPECT_SOURCE_DESCRIPTOR: ${{ needs.auto_prepare-source.outputs.source_descriptor_sha }}
      EXPECT_SOURCE_ARCHIVE: ${{ needs.auto_prepare-source.outputs.source_archive_sha }}
      EXPECT_SOURCE_PRODUCER: auto_prepare-source
      EXPECT_BINARY_PRODUCER: auto_compile-release
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      bundle_sha: ${{ steps.seal.outputs.bundle_sha }}
      descriptor_sha: ${{ steps.seal.outputs.descriptor_sha }}
    steps:
      - name: Check out exact independently selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.auto_prepare-source.outputs.source_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install exact selected Rust compiler
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.auto_prepare-source.outputs.rust_version }}
      - name: Install original rust-script runtime
        run: bash scripts/install-rust-script.sh
      - name: Check out immutable trusted workflow protocol
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: _protocol
          persist-credentials: false
      - name: Download immutable selected source artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.auto_prepare-source.outputs.artifact_id }}
          path: .release-transfer/source
          digest-mismatch: error
      - name: Verify independent source compiler protocol and main tag authority
        run: node _protocol/scripts/release-stage-transfer.mjs verify-source
      - name: Build release
        if: needs.auto_prepare-source.outputs.check__should_release == 'true'
        env:
          RELEASE_VERSION: ${{ needs.auto_prepare-source.outputs.current_version__version }}
          RELEASE_MODE: ${{ github.event.inputs.release_mode || '' }}
        run: node _protocol/scripts/prepared-release-binary.mjs "$RELEASE_VERSION" prepared-release
      - name: Seal successful physical binary transfer
        id: seal
        run: node _protocol/scripts/release-stage-transfer.mjs capture binary
      - name: Upload immutable binary artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: staged-auto-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-transfer/binary/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  auto_verify-package:
    name: auto verify-package
    needs: [auto_prepare-source, auto_compile-release]
    if: ${{ needs.auto_prepare-source.outputs.active == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.auto_prepare-source.outputs.version }}
      EXPECT_SOURCE: ${{ needs.auto_prepare-source.outputs.source_sha }}
      EXPECT_TREE: ${{ needs.auto_prepare-source.outputs.source_tree }}
      EXPECT_COMPILER: ${{ needs.auto_prepare-source.outputs.compiler_sha }}
      EXPECT_SOURCE_DESCRIPTOR: ${{ needs.auto_prepare-source.outputs.source_descriptor_sha }}
      EXPECT_SOURCE_ARCHIVE: ${{ needs.auto_prepare-source.outputs.source_archive_sha }}
      EXPECT_SOURCE_PRODUCER: auto_prepare-source
      EXPECT_BINARY_PRODUCER: auto_compile-release
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      bundle_sha: ${{ steps.seal.outputs.bundle_sha }}
      descriptor_sha: ${{ steps.seal.outputs.descriptor_sha }}
    steps:
      - name: Check out exact independently selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.auto_prepare-source.outputs.source_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install exact selected Rust compiler
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.auto_prepare-source.outputs.rust_version }}
      - name: Install original rust-script runtime
        run: bash scripts/install-rust-script.sh
      - name: Check out immutable trusted workflow protocol
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: _protocol
          persist-credentials: false
      - name: Download immutable selected source artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.auto_prepare-source.outputs.artifact_id }}
          path: .release-transfer/source
          digest-mismatch: error
      - name: Verify independent source compiler protocol and main tag authority
        run: node _protocol/scripts/release-stage-transfer.mjs verify-source
      - name: Download immutable binary artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.auto_compile-release.outputs.artifact_id }}
          path: .release-transfer/binary
          digest-mismatch: error
      - name: Validate physical binary producer transfer
        env:
          EXPECT_BUNDLE: ${{ needs.auto_compile-release.outputs.bundle_sha }}
          EXPECT_DESCRIPTOR: ${{ needs.auto_compile-release.outputs.descriptor_sha }}
          EXPECT_PRODUCER: auto_compile-release
        run: node _protocol/scripts/release-stage-transfer.mjs import binary
      - name: Verify packaged crate archive
        if: needs.auto_prepare-source.outputs.check__should_release == 'true'
        run: cargo package --manifest-path rust/Cargo.toml --locked -p formal-ai
      - name: Seal successful physical package transfer
        id: seal
        run: node _protocol/scripts/release-stage-transfer.mjs capture package
      - name: Upload immutable package artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: staged-auto-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-transfer/package/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  auto_publish-crate:
    name: auto publish-crate
    needs: [auto_prepare-source, auto_compile-release, auto_verify-package]
    if: ${{ needs.auto_prepare-source.outputs.active == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.auto_prepare-source.outputs.version }}
      EXPECT_SOURCE: ${{ needs.auto_prepare-source.outputs.source_sha }}
      EXPECT_TREE: ${{ needs.auto_prepare-source.outputs.source_tree }}
      EXPECT_COMPILER: ${{ needs.auto_prepare-source.outputs.compiler_sha }}
      EXPECT_SOURCE_DESCRIPTOR: ${{ needs.auto_prepare-source.outputs.source_descriptor_sha }}
      EXPECT_SOURCE_ARCHIVE: ${{ needs.auto_prepare-source.outputs.source_archive_sha }}
      EXPECT_SOURCE_PRODUCER: auto_prepare-source
      EXPECT_BINARY_PRODUCER: auto_compile-release
    outputs:
      publish-crate__publish_result: ${{ steps.publish-crate.outputs.publish_result }}
    steps:
      - name: Check out exact independently selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.auto_prepare-source.outputs.source_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install exact selected Rust compiler
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.auto_prepare-source.outputs.rust_version }}
      - name: Install original rust-script runtime
        run: bash scripts/install-rust-script.sh
      - name: Check out immutable trusted workflow protocol
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: _protocol
          persist-credentials: false
      - name: Download immutable selected source artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.auto_prepare-source.outputs.artifact_id }}
          path: .release-transfer/source
          digest-mismatch: error
      - name: Verify independent source compiler protocol and main tag authority
        run: node _protocol/scripts/release-stage-transfer.mjs verify-source
      - name: Download immutable binary artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.auto_compile-release.outputs.artifact_id }}
          path: .release-transfer/binary
          digest-mismatch: error
      - name: Validate physical binary producer transfer
        env:
          EXPECT_BUNDLE: ${{ needs.auto_compile-release.outputs.bundle_sha }}
          EXPECT_DESCRIPTOR: ${{ needs.auto_compile-release.outputs.descriptor_sha }}
          EXPECT_PRODUCER: auto_compile-release
        run: node _protocol/scripts/release-stage-transfer.mjs import binary
      - name: Download immutable package artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.auto_verify-package.outputs.artifact_id }}
          path: .release-transfer/package
          digest-mismatch: error
      - name: Validate physical package producer transfer
        env:
          EXPECT_BUNDLE: ${{ needs.auto_verify-package.outputs.bundle_sha }}
          EXPECT_DESCRIPTOR: ${{ needs.auto_verify-package.outputs.descriptor_sha }}
          EXPECT_PRODUCER: auto_verify-package
        run: node _protocol/scripts/release-stage-transfer.mjs import package
      - name: Publish to Crates.io
        if: needs.auto_prepare-source.outputs.check__should_release == 'true' && needs.auto_prepare-source.outputs.prepared__crate_published != 'true'
        id: publish-crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: rust-script scripts/publish-crate.rs
  auto_registry-availability:
    name: auto registry-availability
    needs: [auto_prepare-source, auto_verify-package, auto_publish-crate]
    if: ${{ needs.auto_prepare-source.outputs.active == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.auto_prepare-source.outputs.version }}
      EXPECT_SOURCE: ${{ needs.auto_prepare-source.outputs.source_sha }}
      EXPECT_TREE: ${{ needs.auto_prepare-source.outputs.source_tree }}
      EXPECT_COMPILER: ${{ needs.auto_prepare-source.outputs.compiler_sha }}
      EXPECT_SOURCE_DESCRIPTOR: ${{ needs.auto_prepare-source.outputs.source_descriptor_sha }}
      EXPECT_SOURCE_ARCHIVE: ${{ needs.auto_prepare-source.outputs.source_archive_sha }}
      EXPECT_SOURCE_PRODUCER: auto_prepare-source
      EXPECT_BINARY_PRODUCER: auto_compile-release
    steps:
      - name: Check out exact independently selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.auto_prepare-source.outputs.source_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install exact selected Rust compiler
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.auto_prepare-source.outputs.rust_version }}
      - name: Install original rust-script runtime
        run: bash scripts/install-rust-script.sh
      - name: Check out immutable trusted workflow protocol
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: _protocol
          persist-credentials: false
      - name: Download immutable selected source artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.auto_prepare-source.outputs.artifact_id }}
          path: .release-transfer/source
          digest-mismatch: error
      - name: Verify independent source compiler protocol and main tag authority
        run: node _protocol/scripts/release-stage-transfer.mjs verify-source
      - name: Download immutable package artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.auto_verify-package.outputs.artifact_id }}
          path: .release-transfer/package
          digest-mismatch: error
      - name: Validate physical package producer transfer
        env:
          EXPECT_BUNDLE: ${{ needs.auto_verify-package.outputs.bundle_sha }}
          EXPECT_DESCRIPTOR: ${{ needs.auto_verify-package.outputs.descriptor_sha }}
          EXPECT_PRODUCER: auto_verify-package
        run: node _protocol/scripts/release-stage-transfer.mjs import package
      - name: Wait for Crate availability on Crates.io
        if: |
          needs.auto_prepare-source.outputs.check__should_release == 'true' && (
            needs.auto_prepare-source.outputs.prepared__crate_published == 'true' ||
            needs.auto_publish-crate.outputs.publish-crate__publish_result == 'success'
          )
        run: rust-script scripts/wait-for-crate.rs --release-version "${{ needs.auto_prepare-source.outputs.current_version__version }}"
      - name: Audit real registry crate against verified package contents
        run: node _protocol/scripts/release-stage-transfer.mjs verify-registry
  auto_published-crate-smoke:
    name: auto published-crate-smoke
    needs: [auto_prepare-source, auto_publish-crate, auto_registry-availability]
    if: ${{ needs.auto_prepare-source.outputs.active == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.auto_prepare-source.outputs.version }}
      EXPECT_SOURCE: ${{ needs.auto_prepare-source.outputs.source_sha }}
      EXPECT_TREE: ${{ needs.auto_prepare-source.outputs.source_tree }}
      EXPECT_COMPILER: ${{ needs.auto_prepare-source.outputs.compiler_sha }}
      EXPECT_SOURCE_DESCRIPTOR: ${{ needs.auto_prepare-source.outputs.source_descriptor_sha }}
      EXPECT_SOURCE_ARCHIVE: ${{ needs.auto_prepare-source.outputs.source_archive_sha }}
      EXPECT_SOURCE_PRODUCER: auto_prepare-source
      EXPECT_BINARY_PRODUCER: auto_compile-release
    steps:
      - name: Check out exact independently selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.auto_prepare-source.outputs.source_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install exact selected Rust compiler
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.auto_prepare-source.outputs.rust_version }}
      - name: Install original rust-script runtime
        run: bash scripts/install-rust-script.sh
      - name: Check out immutable trusted workflow protocol
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: _protocol
          persist-credentials: false
      - name: Download immutable selected source artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.auto_prepare-source.outputs.artifact_id }}
          path: .release-transfer/source
          digest-mismatch: error
      - name: Verify independent source compiler protocol and main tag authority
        run: node _protocol/scripts/release-stage-transfer.mjs verify-source
      - name: Smoke test the published crate
        if: |
          needs.auto_prepare-source.outputs.check__should_release == 'true' && (
            needs.auto_prepare-source.outputs.prepared__crate_published == 'true' ||
            needs.auto_publish-crate.outputs.publish-crate__publish_result == 'success'
          )
        run: scripts/smoke-test-published-crate.sh "${{ needs.auto_prepare-source.outputs.current_version__version }}"
  auto_publish-verify-images:
    name: auto publish-verify-images
    permissions:
      contents: read
      packages: write
    needs: [auto_prepare-source, auto_compile-release, auto_verify-package, auto_publish-crate, auto_registry-availability, auto_published-crate-smoke]
    if: ${{ needs.auto_prepare-source.outputs.active == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.auto_prepare-source.outputs.version }}
      EXPECT_SOURCE: ${{ needs.auto_prepare-source.outputs.source_sha }}
      EXPECT_TREE: ${{ needs.auto_prepare-source.outputs.source_tree }}
      EXPECT_COMPILER: ${{ needs.auto_prepare-source.outputs.compiler_sha }}
      EXPECT_SOURCE_DESCRIPTOR: ${{ needs.auto_prepare-source.outputs.source_descriptor_sha }}
      EXPECT_SOURCE_ARCHIVE: ${{ needs.auto_prepare-source.outputs.source_archive_sha }}
      EXPECT_SOURCE_PRODUCER: auto_prepare-source
      EXPECT_BINARY_PRODUCER: auto_compile-release
    outputs:
      dockerhub__docker_hub_url: ${{ steps.dockerhub.outputs.docker_hub_url }}
      dockerhub__enabled: ${{ steps.dockerhub.outputs.enabled }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      bundle_sha: ${{ steps.seal.outputs.bundle_sha }}
      descriptor_sha: ${{ steps.seal.outputs.descriptor_sha }}
      ghcr-publish__digest: ${{ steps.ghcr-publish.outputs.digest }}
    steps:
      - name: Check out exact independently selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.auto_prepare-source.outputs.source_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install exact selected Rust compiler
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.auto_prepare-source.outputs.rust_version }}
      - name: Install original rust-script runtime
        run: bash scripts/install-rust-script.sh
      - name: Check out immutable trusted workflow protocol
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: _protocol
          persist-credentials: false
      - name: Download immutable selected source artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.auto_prepare-source.outputs.artifact_id }}
          path: .release-transfer/source
          digest-mismatch: error
      - name: Verify independent source compiler protocol and main tag authority
        run: node _protocol/scripts/release-stage-transfer.mjs verify-source
      - name: Download immutable binary artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.auto_compile-release.outputs.artifact_id }}
          path: .release-transfer/binary
          digest-mismatch: error
      - name: Validate physical binary producer transfer
        env:
          EXPECT_BUNDLE: ${{ needs.auto_compile-release.outputs.bundle_sha }}
          EXPECT_DESCRIPTOR: ${{ needs.auto_compile-release.outputs.descriptor_sha }}
          EXPECT_PRODUCER: auto_compile-release
        run: node _protocol/scripts/release-stage-transfer.mjs import binary
      - name: Free up runner disk space
        if: |
          needs.auto_prepare-source.outputs.check__should_release == 'true' && (
            needs.auto_prepare-source.outputs.prepared__crate_published == 'true' ||
            needs.auto_publish-crate.outputs.publish-crate__publish_result == 'success'
          )
        run: bash scripts/free-runner-disk.sh
      - name: Log in to GitHub Container Registry
        if: |
          needs.auto_prepare-source.outputs.check__should_release == 'true' && (
            needs.auto_prepare-source.outputs.prepared__crate_published == 'true' ||
            needs.auto_publish-crate.outputs.publish-crate__publish_result == 'success'
          )
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        if: |
          needs.auto_prepare-source.outputs.check__should_release == 'true' && (
            needs.auto_prepare-source.outputs.prepared__crate_published == 'true' ||
            needs.auto_publish-crate.outputs.publish-crate__publish_result == 'success'
          )
        uses: ./.github/actions/setup-buildx-resilient
      - name: Expose actual BuildKit cache runtime
        if: |
          needs.auto_prepare-source.outputs.check__should_release == 'true' && (
            needs.auto_prepare-source.outputs.prepared__crate_published == 'true' ||
            needs.auto_publish-crate.outputs.publish-crate__publish_result == 'success'
          )
