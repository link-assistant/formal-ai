        id: create-release
        if: |
          needs.auto_prepare-source.outputs.check__should_release == 'true' && (
            needs.auto_prepare-source.outputs.prepared__crate_published == 'true' ||
            needs.auto_publish-crate.outputs.publish-crate__publish_result == 'success'
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_URL: https://github.com/${{ github.repository }}/pkgs/container/formal-ai
          DOCKER_HUB_URL: ${{ needs.auto_publish-verify-images.outputs.dockerhub__docker_hub_url }}
          RELEASE_VERSION: ${{ needs.auto_prepare-source.outputs.version__new_version || needs.auto_prepare-source.outputs.current_version__version }}
        run: bash scripts/invoke-create-github-release.sh
      - name: Attach the verified immutable slim image receipt
        if: |
          needs.auto_prepare-source.outputs.check__should_release == 'true' && (
            needs.auto_prepare-source.outputs.prepared__crate_published == 'true' ||
            needs.auto_publish-crate.outputs.publish-crate__publish_result == 'success'
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MIRROR_ENABLED: ${{ needs.auto_publish-verify-images.outputs.dockerhub__enabled }}
          RELEASE_VERSION: ${{ needs.auto_prepare-source.outputs.version__new_version || needs.auto_prepare-source.outputs.current_version__version }}
        run: |
          set -euo pipefail
          test -s slim-image-release-receipt.json
          test -s slim-image-release-receipt.json.sha256
          gh release upload "v$RELEASE_VERSION" slim-image-release-receipt.json slim-image-release-receipt.json.sha256 --repo "$REPO" --clobber
          cp prepared-release/source/source-selection.json prepared-release-source.json
          cp prepared-release/binary/native-executable-receipt.json prepared-release-executable.json
          cp prepared-release/prepared-build.json prepared-release-build.json
          cp prepared-release/full-image.json prepared-release-full-image.json
          files=(prepared-release-source.json prepared-release-executable.json prepared-release-build.json prepared-release-full-image.json)
          if [ "$MIRROR_ENABLED" = true ]; then
            cp prepared-release/dockerhub-image.json prepared-release-dockerhub-image.json
            files+=(prepared-release-dockerhub-image.json)
          fi
          sha256sum "${files[@]}" > prepared-release-SHA256SUMS.txt
          gh release upload "v$RELEASE_VERSION" "${files[@]}" prepared-release-SHA256SUMS.txt --repo "$REPO" --clobber
      - name: Resolve Pages deploy ref
        id: release_pages_ref
        if: always()
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          rust-script scripts/get-version.rs
