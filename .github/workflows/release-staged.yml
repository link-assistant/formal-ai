        env:
          IMAGE_REFERENCE: ${{ env.GHCR_IMAGE }}@${{ steps.ghcr-publish.outputs.digest }}
        run: node scripts/verify-anonymous-image-manifest.mjs "$IMAGE_REFERENCE"
      - name: Configure Docker Hub publishing
        if: |
          needs.auto_prepare-source.outputs.check__should_release == 'true' && (
            needs.auto_prepare-source.outputs.prepared__crate_published == 'true' ||
            needs.auto_publish-crate.outputs.publish-crate__publish_result == 'success'
          )
        id: dockerhub
        run: bash scripts/configure-dockerhub-publishing.sh
