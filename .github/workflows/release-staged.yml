          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install exact selected Rust compiler
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.manual_prepare-source.outputs.rust_version }}
      - name: Install original rust-script runtime
        run: bash scripts/install-rust-script.sh
