        if: ${{ needs.manual_prepare-source.outputs.active == 'true' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.manual_publish-verify-images.outputs.artifact_id }}
          path: .release-transfer/images
          digest-mismatch: error
