# Issue #1210: bounded source build and attempt; retain all evidence on failure.
name: Hive Mind draft
on:
  issues:
    types:
      - opened
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to re-attempt
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hive-mind-draft-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  build:
    concurrency:
      group: hive-mind-draft-build-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run || (job.status == 'failure' && 'true') || 'false' }}
      decision_code: ${{ steps.decide.outputs.decision_code }}
      issue_number: ${{ steps.decide.outputs.issue_number || github.event.issue.number || inputs.issue_number }}
      source_sha: ${{ steps.source.outputs.sha }}
      hive_source_sha: ${{ steps.hive-source.outputs.sha }}
      hive_image: ${{ steps.hive-version.outputs.image }}
      evidence_url: ${{ steps.build-logs.outputs.artifact-url }}
      evidence_artifact_id: ${{ steps.build-logs.outputs.artifact-id }}
      binary_artifact_id: ${{ steps.binary-artifact.outputs.artifact-id }}
    # The default token suppresses automatic PR-event fanout, so even with
    # optional app credentials configured elsewhere, evidence-only drafts
    # cannot start the matrix before the complete-diff admission check.
    env:
      FORMAL_AI_DRAFT_ISSUE: ${{ inputs.issue_number }}
    steps:
      - name: Set session evidence directory on the allocated runner
        shell: bash
        run: |
          echo "FORMAL_AI_DRAFT_LOG_DIR=$RUNNER_TEMP/formal-ai-draft-logs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/formal-ai-draft-logs"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - id: hive-source
        name: Resolve current Hive Mind main once for this attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(bash "$GITHUB_WORKSPACE/scripts/run-with-deadline.sh" 60 gh api repos/link-assistant/hive-mind/commits/main --jq .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "hive_mind_main_commit=$sha" | tee -a "$FORMAL_AI_DRAFT_LOG_DIR/source-identity.txt"
      - name: Checkout shared maintained Hive Mind decision and attempt
        uses: actions/checkout@v7
        with:
          repository: link-assistant/hive-mind
          ref: ${{ steps.hive-source.outputs.sha }}
          path: .hive-mind
          persist-credentials: false
      - name: Install shared automation dependencies
        working-directory: .hive-mind
        run: FORMAL_AI_DEADLINE_GRACE_SECONDS=15 bash "$GITHUB_WORKSPACE/scripts/run-with-deadline.sh" 180 npm ci --omit=dev --ignore-scripts
      - id: decide
        name: Decide before building source
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_LAYER: default
        run: node .hive-mind/scripts/formal-ai-draft.mjs --decide
      - id: hive-version
        if: steps.decide.outputs.should_run == 'true'
        name: Bind the current Hive source and its exact runtime version
        env:
          HIVE_MIND_SOURCE_SHA: ${{ steps.hive-source.outputs.sha }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {resolveDraftImages} from './.hive-mind/scripts/formal-ai-draft-image.lib.mjs';
          const sha=process.env.HIVE_MIND_SOURCE_SHA;
          assert.match(sha,/^[a-f0-9]{40}$/u);
          assert.equal(execFileSync('git',['-C','.hive-mind','rev-parse','HEAD'],{encoding:'utf8',timeout:15000}).trim(),sha);
          const version=JSON.parse(fs.readFileSync('.hive-mind/package.json')).version;
          assert.match(version,/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/u);
          const {image}=resolveDraftImages({version});
          assert(image.endsWith(':'+version),'exact versioned Hive image required');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'image='+image+'\n');
          fs.appendFileSync(process.env.FORMAL_AI_DRAFT_LOG_DIR+'/source-identity.txt',JSON.stringify({hiveCommit:sha,hiveVersion:version,hiveImage:image,selection:'latest-main-resolved-once'})+'\n');
          JS
      - id: source
        name: Resolve current main commit
        if: steps.decide.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$FORMAL_AI_DRAFT_LOG_DIR"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/draft-started-at"
          sha="$(bash "$GITHUB_WORKSPACE/scripts/run-with-deadline.sh" 60 gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "main_commit=$sha" | tee -a "$FORMAL_AI_DRAFT_LOG_DIR/source-identity.txt"
      - name: Checkout exact main source
        if: steps.decide.outputs.should_run == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: .formal-ai-source
          persist-credentials: false
      - name: Restore shared Cargo registry without an extra cache writer
        if: steps.decide.outputs.should_run == 'true'
        uses: ./.github/actions/cache-cargo-registry
        with:
          restore-only: "true"
      - id: build-command
        name: Build current main binary in CI
        if: steps.decide.outputs.should_run == 'true'
        working-directory: .formal-ai-source
        run: FORMAL_AI_DEADLINE_GRACE_SECONDS=30 bash "$GITHUB_WORKSPACE/scripts/run-with-session-evidence.sh" 1320 build cargo build --manifest-path rust/Cargo.toml --target-dir target --release --locked --bin formal-ai
        shell: bash
      - name: Record actual source version and binary digest
        if: steps.decide.outputs.should_run == 'true'
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          actual_sha="$(git -C .formal-ai-source rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SOURCE_SHA"
          echo "actual_main_commit=$actual_sha" | tee -a "$FORMAL_AI_DRAFT_LOG_DIR/source-identity.txt"
          binary="$GITHUB_WORKSPACE/.formal-ai-source/target/release/formal-ai"
          "$binary" --version | tee -a "$FORMAL_AI_DRAFT_LOG_DIR/source-identity.txt"
          sha256sum "$binary" | tee -a "$FORMAL_AI_DRAFT_LOG_DIR/source-identity.txt"
      - id: binary-artifact
        name: Publish the single exact-main binary for the draft runner
        if: steps.decide.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: hive-mind-main-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .formal-ai-source/target/release/formal-ai
          if-no-files-found: error
          retention-days: 1
      - name: Stage complete redacted build evidence
        if: ${{ always() && (steps.decide.outputs.should_run == 'true' || failure()) }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_BUILD_OUTCOME: ${{ steps.build-command.outcome }}
        run: node scripts/prepare-hive-draft-evidence.mjs "$FORMAL_AI_DRAFT_LOG_DIR" "$RUNNER_TEMP/formal-ai-build-artifact"
      - id: build-logs
        name: Retain main source and build evidence even on failure
        if: ${{ always() && (steps.decide.outputs.should_run == 'true' || failure()) }}
        uses: actions/upload-artifact@v7
        with:
          name: hive-mind-main-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formal-ai-build-artifact
          if-no-files-found: error
          retention-days: 30
  draft:
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.should_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    env:
      FORMAL_AI_DRAFT_ISSUE: ${{ needs.build.outputs.issue_number }}
      HIVE_MIND_SOURCE_SHA: ${{ needs.build.outputs.hive_source_sha }}
      FORMAL_AI_DRAFT_IMAGE: ${{ needs.build.outputs.hive_image }}
    steps:
      - name: Set session evidence directory on the allocated runner
        shell: bash
        run: |-
          echo "FORMAL_AI_DRAFT_LOG_DIR=$RUNNER_TEMP/formal-ai-draft-logs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/formal-ai-draft-logs"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/draft-started-at"
          echo "Attempt budget: 20 minutes including image pull retries; build budget: 22 minutes on a separate runner." > "$RUNNER_TEMP/formal-ai-draft-logs/attempt-policy.txt"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Restore source and build evidence
        if: ${{ needs.build.outputs.evidence_url != '' }}
        uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          artifact-ids: ${{ needs.build.outputs.evidence_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/formal-ai-draft-logs
      - name: Download the exact-main binary once
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          artifact-ids: ${{ needs.build.outputs.binary_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/formal-ai-binary
      - name: Checkout shared maintained Hive Mind decision and attempt
        uses: actions/checkout@v7
        with:
          repository: link-assistant/hive-mind
          ref: ${{ needs.build.outputs.hive_source_sha }}
          path: .hive-mind
          persist-credentials: false
        if: needs.build.result == 'success'
      - name: Install shared automation dependencies
        working-directory: .hive-mind
        run: FORMAL_AI_DEADLINE_GRACE_SECONDS=15 bash "$GITHUB_WORKSPACE/scripts/run-with-deadline.sh" 180 npm ci --omit=dev --ignore-scripts
        if: needs.build.result == 'success'
      - name: Free disk for the Hive Mind image
        if: needs.build.result == 'success'
        run: node .hive-mind/scripts/free-disk-space.mjs
      - name: Retain native and dialog payloads in the mounted session directory
        if: needs.build.result == 'success'
        run: node scripts/lib/hive-draft-diagnostics.mjs .hive-mind "$FORMAL_AI_DRAFT_LOG_DIR"
      - id: attempt
        name: Attempt through shared Hive Mind scripts (including image pull retry)
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_LAYER: default
          FORMAL_AI_INSTALL_GRANT: workspace
          FORMAL_AI_DRAFT_BINARY: ${{ runner.temp }}/formal-ai-binary/formal-ai
        run: |-
          chmod +x "$FORMAL_AI_DRAFT_BINARY"
          FORMAL_AI_DEADLINE_GRACE_SECONDS=30 bash "$GITHUB_WORKSPACE/scripts/run-with-session-evidence.sh" 1200 attempt node .hive-mind/scripts/formal-ai-draft.mjs
      - id: exact-pr
        name: Verify this attempt's exact pull request
        if: ${{ !cancelled() && steps.attempt.outputs.head_branch != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_HEAD_BRANCH: ${{ steps.attempt.outputs.head_branch }}
        run: node scripts/hive-mind-draft-result.mjs --select
      - name: Dispatch checks only after a useful draft is verified
        if: ${{ !cancelled() && steps.exact-pr.outputs.pull_request_number != '' }}
        uses: ./.github/actions/dispatch-checks
        with:
          pull-request: ${{ steps.exact-pr.outputs.pull_request_number }}
          token: ${{ github.token }}
      - name: Retain failed build outcome while still publishing evidence
        if: ${{ !cancelled() && needs.build.result != 'success' }}
        run: |-
          echo "::error::The exact-main build failed; no draft attempt ran. See retained source/build evidence."
          exit 1
      - name: Transfer only private diagnostic files to the artifact reader
        if: ${{ always() && steps.attempt.outcome != '' && steps.attempt.outcome != 'skipped' }}
        run: |
          for category in formal-ai-diagnostics formal-ai-dialog formal-ai-native; do
            sudo -n env GITHUB_ACTIONS=true "$(command -v node)" scripts/lib/hive-operational-evidence.mjs --transfer-ownership "$FORMAL_AI_DRAFT_LOG_DIR" "$(id -u)" "$(id -g)" "$category"
          done
      - name: Stage complete redacted attempt evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_BUILD_OUTCOME: ${{ needs.build.result }}
          DRAFT_ATTEMPT_OUTCOME: ${{ steps.attempt.outcome }}
        run: node scripts/prepare-hive-draft-evidence.mjs "$FORMAL_AI_DRAFT_LOG_DIR" "$RUNNER_TEMP/formal-ai-session-artifact"
      - id: logs
        name: Upload complete session evidence on success and failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hive-mind-draft-session-${{ needs.build.outputs.issue_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formal-ai-session-artifact
          if-no-files-found: error
          retention-days: 30
      - name: Link session artifact on the issue when no verified draft exists
        if: ${{ !cancelled() && steps.exact-pr.outputs.pull_request_number == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_ISSUE_NUMBER: ${{ needs.build.outputs.issue_number }}
          DRAFT_ARTIFACT_URL: ${{ steps.logs.outputs.artifact-url || needs.build.outputs.evidence_url }}
        run: node scripts/hive-mind-draft-result.mjs --failure
