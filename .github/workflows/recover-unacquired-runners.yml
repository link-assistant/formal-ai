# Reuse the Go template's bounded acquisition recovery. Trusted default-branch
# code only; this observer consumes no artifact or source from the failed run.
name: Recover unacquired runners
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ['CI/CD Pipeline']
    types: [completed]
permissions:
  contents: read
jobs:
  recover:
    name: Recover jobs that never acquired a runner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    concurrency:
      group: recover-unacquired-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            /scripts/rerun-unacquired-jobs.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        timeout-minutes: 2
        with:
          node-version: '22'
      - name: Inspect complete observations and recover acquisition failures
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --max-old-space-size=128 scripts/rerun-unacquired-jobs.mjs
