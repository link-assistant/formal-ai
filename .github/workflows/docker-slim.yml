name: Check slim Docker runtime
on:
  workflow_call:
permissions:
  contents: read
jobs:
  runtime:
    name: Slim Docker runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-formal-ai-binary
      - name: Free runner disk
        run: bash scripts/free-runner-disk.sh
      - uses: ./.github/actions/setup-buildx-resilient
      - name: Build the release sidecar
        timeout-minutes: 15
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.slim
          build-args: BINARY_SOURCE=prebuilt
          push: false
          load: true
          tags: formal-ai:slim-check
          cache-to: type=inline
      - name: Test the slim server and agent surface and size budget
        run: |
          set -euo pipefail
          docker run --rm --entrypoint verify-formal-ai-slim formal-ai:slim-check
          bytes=$(docker image inspect formal-ai:slim-check --format '{{.Size}}')
          test "$bytes" -le 2147483648
      - if: ${{ !cancelled() }}
        run: scripts/prune-docker.sh
