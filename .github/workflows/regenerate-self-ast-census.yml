name: Regenerate self-AST census

# Issue #1085. The per-module census under `data/meta/self-ast/` is a pure
# function of the sources (`cargo run --manifest-path rust/Cargo.toml --example regenerate_self_ast_census`),
# and `tests/unit/issue_673_self_ast_census.rs` fails on drift. A contributor
# whose machine cannot build the crate has no way to regenerate it; this job
# builds it here on every pull request that touches a source module and hands
# the documents back as an artifact to commit. It writes nothing to the
# repository. `workflow_dispatch` only resolves on the default branch, which
# is why the pull-request trigger exists.

on:
  pull_request:
    # Issue #1187 R4: an isolated e2e/<purpose>/<run>/<name> pull request
    # never triggers this repository's own pipeline.
    branches-ignore: ['e2e/**']
    paths:
      - 'rust/src/**/*.rs'
      - 'rust/examples/regenerate_self_ast_census.rs'
      - '.github/workflows/regenerate-self-ast-census.yml'
      - ".cargo"
      - ".cargo/**"
      - "data/seed/api-cache"
      - "data/seed/api-cache/**"
      - "rust/.cargo"
      - "rust/.cargo/**"
      - "rust/Cargo.lock"
      - "rust/Cargo.lock/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.toml/**"
      - "rust/build.rs"
      - "rust/build.rs/**"
      - "rust/embedded"
      - "rust/embedded/**"
      - "rust/src"
      - "rust/src/**"
      - "rust/tests/web/census-source-selectors.test.mjs"
      - "scripts/collect-qualified-native-data-artifacts.mjs"
      - "scripts/generate-census-source-selectors.mjs"
      - "scripts/github-artifact-by-identifier.mjs"
      - "scripts/lib/native-response-capture.mjs"
      - "scripts/lib/native-session-projections.mjs"
      - "scripts/lib/native-test-module-graph.mjs"
      - "scripts/lib/qualified-native-data-collector.mjs"
      - "scripts/lib/rust-specification-cases.mjs"
      - "scripts/lib/rust-specification-values.mjs"
      - "scripts/qualified-data-artifact-profiles.mjs"
  # Issue #1187 R2: a bot pull request's checks start through dispatch
  # (.github/actions/dispatch-checks); mode and pull-request are its inputs.
  workflow_dispatch:
    inputs:
      mode:
        description: 'checks: run the pull-request checks on the dispatched branch'
        required: false
        default: checks
        type: choice
        options: [checks]
      pull-request:
        description: 'Pull request the dispatched checks report for'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_TERM_COLOR: always

jobs:
  regenerate:
    name: Build the census and upload it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-sccache
      - uses: ./.github/actions/cache-cargo-registry
        with:
          restore-only: 'true'
      - name: Regenerate the census
        env:
          TEST_BUDGET_SECONDS: 1200
          TEST_WARN_RATIO_PERCENT: 70
        run: |
          scripts/run-with-budget-warning.sh \
            "$TEST_BUDGET_SECONDS" "self-AST census regeneration" \
            cargo run --manifest-path rust/Cargo.toml --locked --example regenerate_self_ast_census
      # The three byte-pinned documents derived from the planner source move
      # whenever `src/agentic_coding/planner.rs` does (`issue_538_agentic` and
      # `issue_558_self_healing` fail on drift); they are regenerated with the
      # same binary and handed back in the same artifact (issue #1085).
      - name: Regenerate the planner-derived documents
        run: |
          set -euo pipefail
          cargo run --manifest-path rust/Cargo.toml --locked --quiet --example dump_self_ast > data/meta/self-ast.lino
          cargo run --manifest-path rust/Cargo.toml --locked --quiet --example dump_self_healing_case > data/meta/self-healing-case.lino
          cargo run --manifest-path rust/Cargo.toml --locked --quiet --example dump_self_ast_agent_cli_session \
            > docs/case-studies/issue-538/agent-cli-session-self-ast.json
      - name: Show what changed
        run: |
          git status --short -- data/meta/self-ast data/meta/self-ast.lino data/meta/self-healing-case.lino docs/case-studies/issue-538 \
            | tee "$RUNNER_TEMP/census-changes.txt"
          {
            echo "### Self-AST census changes"
            echo
            echo '```'
            cat "$RUNNER_TEMP/census-changes.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the census
        uses: actions/upload-artifact@v7
        with:
          name: self-ast-census
          path: |
            data/meta/self-ast
            data/meta/self-ast.lino
            data/meta/self-healing-case.lino
            docs/case-studies/issue-538/agent-cli-session-self-ast.json
          retention-days: 7
          if-no-files-found: error
