# Full recursive readable models are source authority; receipts only navigate their artifacts.
name: Verify full readable source content
on:
  pull_request:
    # Issue #1187 R4: an isolated e2e/<purpose>/<run>/<name> pull request
    # never triggers this repository's own pipeline.
    branches-ignore: [ 'e2e/**' ]
    paths:
      - 'rust/src/**/*.rs'
      - 'rust/examples/regenerate_self_ast_census.rs'
      - '.github/workflows/regenerate-self-ast-census.yml'
      - ".cargo"
      - ".cargo/**"
      - "data/seed/api-cache"
      - "data/seed/api-cache/**"
      - "rust/.cargo"
      - "rust/.cargo/**"
      - "rust/Cargo.lock"
      - "rust/Cargo.lock/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.toml/**"
      - "rust/build.rs"
      - "rust/build.rs/**"
      - "rust/embedded"
      - "rust/embedded/**"
      - "rust/src"
      - "rust/src/**"
      - "rust/tests/web/census-source-selectors.test.mjs"
      - "scripts/collect-qualified-native-data-artifacts.mjs"
      - "scripts/generate-census-source-selectors.mjs"
      - "scripts/github-artifact-by-identifier.mjs"
      - "scripts/lib/native-response-capture.mjs"
      - "scripts/lib/native-session-projections.mjs"
      - "scripts/lib/native-test-module-graph.mjs"
      - "scripts/lib/qualified-native-data-collector.mjs"
      - "scripts/lib/rust-specification-cases.mjs"
      - "scripts/lib/rust-specification-values.mjs"
      - "scripts/qualified-data-artifact-profiles.mjs"
      - "data/meta/source-model"
      - "data/meta/source-model/**"
      - "js/agentic/crate/rust_str.mjs"
      - "js/agentic/crate/rust_str.mjs/**"
      - "js/crypto/blake3.mjs"
      - "js/crypto/blake3.mjs/**"
      - "scripts/aggregate-source-content.mjs"
      - "scripts/aggregate-source-content.mjs/**"
      - "scripts/mirror-package-data.mjs"
      - "scripts/mirror-package-data.mjs/**"
      - "rust/examples/generate_source_content.rs"
      - "scripts/native-release-source.mjs"
  # Issue #1187 R2: a bot pull request's checks start through dispatch
  # (.github/actions/dispatch-checks); mode and pull-request are its inputs.
  workflow_dispatch:
    inputs:
      mode:
        description: 'checks: run the pull-request checks on the dispatched branch'
        required: false
        default: checks
        type: choice
        options: [ checks ]
      pull-request:
        description: 'Pull request the dispatched checks report for'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_TERM_COLOR: always

jobs:
  content:
    name: Build full source content (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify canonical package data demands
        run: node scripts/mirror-package-data.mjs --check
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-sccache
      - uses: ./.github/actions/cache-cargo-registry
        with:
          restore-only: "true"
      - name: Generate and independently verify recursive source models
        env:
          TEST_BUDGET_SECONDS: 1200
          TEST_WARN_RATIO_PERCENT: 70
        run: >
          scripts/run-with-budget-warning.sh "$TEST_BUDGET_SECONDS" "full source
          content" \
            cargo run --manifest-path rust/Cargo.toml --locked --release --example generate_source_content -- \
            "$RUNNER_TEMP/source-content" "${{ matrix.shard }}" 8
      - name: Upload complete readable source models
        uses: actions/upload-artifact@v7
        with:
          name: source-content-models-${{ matrix.shard }}
          path: ${{ runner.temp }}/source-content/source-content
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - name: Upload bounded source-content receipt
        uses: actions/upload-artifact@v7
        with:
          name: source-content-part-${{ matrix.shard }}
          path: ${{ runner.temp }}/source-content/receipt.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
  regenerate:
    name: Verify source-content receipts
    needs: content
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Download source-bound receipts
        uses: actions/download-artifact@v8
        with:
          pattern: source-content-part-*
          path: ${{ runner.temp }}/source-content-parts
          merge-multiple: false
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
      - name: Verify exact source ownership and complete shard coverage
        run: node scripts/aggregate-source-content.mjs
          "$RUNNER_TEMP/source-content-parts"
          "$RUNNER_TEMP/source-content-receipt/source-content-receipt.json"
      - name: Upload source-content evidence
        uses: actions/upload-artifact@v7
        with:
          name: source-content-receipt
          path: ${{ runner.temp }}/source-content-receipt
          retention-days: 7
          if-no-files-found: error
          overwrite: true
