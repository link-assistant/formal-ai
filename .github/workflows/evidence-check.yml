name: Self-hosting evidence

# Extracted from `release.yml` (issues #999 and #1012). Both jobs there answer
# "did Formal AI author part of this pull request?", both are gated on
# `pull_request`, and both were pushing the release workflow past the 1500-line
# warning band. The gate's own instruction is to extract a job rather than raise
# the number, so this is that extraction: the checks are unchanged, they just
# live where their name says they do.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_TERM_COLOR: always

jobs:
  evidence-check:
    name: Self-Hosting Evidence Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install rust-script
        run: bash scripts/install-rust-script.sh
      - name: Validate Formal-AI trailers on this pull request
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/${GITHUB_BASE_REF}"
          merge_base="$(git merge-base "$base" HEAD)"
          echo "Validating commits in ${merge_base}..HEAD"
          rust-script scripts/self-hosting-metric.rs --since "$merge_base" --until HEAD
      # The architect asked for both halves of one rule: force each pull request
      # to use Formal AI to code part of it, and relax that once the pull request
      # has been open for more than a day so the requirement never stops a
      # release (docs/architect-notes/2026-09-11-do-not-obstruct-the-vision.md).
      # A relaxed result is reported as relaxed, never as satisfied, which is the
      # thing issue #1066 actually objected to.
      - name: Formal AI authored part of this pull request
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PULL_REQUEST_CREATED_AT: ${{ github.event.pull_request.created_at }}
        run: |
          set -euo pipefail
          base="origin/${GITHUB_BASE_REF}"
          merge_base="$(git merge-base "$base" HEAD)"
          rust-script scripts/check-formal-ai-contribution.rs \
            --since "$merge_base" --until HEAD

  # Issue #977: a job killed by `timeout-minutes` reports as `cancelled`, which
  # a branch protection rule reads as "not failed". `release.yml` has a terminal
  # job that turns that into a red failure; extracting the evidence job out of
  # that workflow would have left it without one, so it gets the same gate here.
  evidence-status:
    name: Evidence Check Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [evidence-check]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fail the run when a required job was cancelled or failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: bash scripts/check-pipeline-status.sh
