name: Original Hive Mind three-client delivery
# Completion events execute only this trusted default-branch protocol. The read-only
# admission authenticates same-repository source and all CI before credentialed
# effects, which require a source-bound immutable claim.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    branches: [main]
    workflows:
      - "*"
      - "!Original Hive Mind three-client delivery"
      - "!Finalize original Hive generated tasks"
    types:
      - completed
  workflow_dispatch:
    inputs:
      pull-request:
        description: Current same-repository pull request number
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: original-hive-${{ github.event.workflow_run.name == 'Verify Public
    Release Downloads' && format('release-{0}', github.event.workflow_run.id) ||
    github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
    github.event.workflow_run.conclusion == 'success' && format('release-ci-{0}', github.event.workflow_run.id) ||
    format('candidate-{0}', github.event.workflow_run.head_branch ||
    github.ref_name) }}
  cancel-in-progress: false
jobs:
  admission:
    name: Authenticate current source and every applicable CI result
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.name == 'Verify Public Release Downloads' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      admitted: ${{ steps.admit.outputs.admitted }}
      source: ${{ steps.admit.outputs.source }}
      scope: ${{ steps.admit.outputs.scope }}
      tools: ${{ steps.admit.outputs.tools }}
      execute: ${{ steps.admit.outputs.execute }}
      published: ${{ steps.admit.outputs.published }}
      input_hash: ${{ steps.admit.outputs.input_hash }}
      policy_hash: ${{ steps.admit.outputs.policy_hash }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .hive-protocol
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .hive-protocol/.bun-version
      - name: Install frozen trusted admission dependencies
        working-directory: .hive-protocol
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Read-only complete CI and durable client history admission
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          HIVE_ADMISSION_OUTPUT: ${{ runner.temp }}/hive-admission/selection.json
        run: node .hive-protocol/scripts/admit-hive-original-delivery.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: hive-admission-selection
          path: ${{ runner.temp }}/hive-admission/selection.json
          if-no-files-found: error
          retention-days: 90
      - name: Report optional credentials and the default-token isolation fallback
        if: ${{ steps.admit.outputs.admitted == 'true' && steps.admit.outputs.execute == 'true' }}
        env:
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          AUTOMATION_APP_ID: ${{ vars.AUTOMATION_APP_ID || secrets.AUTOMATION_APP_ID }}
          AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        run: node .hive-protocol/scripts/hive-delivery-attempt.mjs configuration
  build:
    if: ${{ needs.admission.outputs.admitted == 'true' &&
      needs.admission.outputs.execute == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.admission.outputs.source }}
          persist-credentials: false
          clean: false
      - name: Initialize owned admission paths after runner assignment
        env:
          HIVE_ADMISSION_SELECTION: ${{ runner.temp }}/hive-admission/selection.json
          HIVE_PUBLISHED_RUNTIME_FILE: ${{ needs.admission.outputs.published == 'true' &&
            format('{0}/hive-admission/selection.json', runner.temp) || '' }}
        run: >
          printf '%s\n' "HIVE_ADMISSION_SELECTION=$HIVE_ADMISSION_SELECTION"
          "HIVE_PUBLISHED_RUNTIME_FILE=$HIVE_PUBLISHED_RUNTIME_FILE" >>
          "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .hive-protocol
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .hive-protocol/.bun-version
      - name: Install frozen trusted admission dependencies
        working-directory: .hive-protocol
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: hive-admission-selection
          path: ${{ runner.temp }}/hive-admission
      # The admitted product checkout supplies its matching build action; no persisted credentials.
      - uses: ./.github/actions/formal-ai-binary # zizmor: ignore[self-repository]
        with:
          cache-key-prefix: hive-formal-ai-ubuntu-24
        if: ${{ needs.admission.outputs.published != 'true' }}
      - name: Extract exact shipped binary from immutable published runtime
        if: ${{ needs.admission.outputs.published == 'true' }}
        run: node .hive-protocol/scripts/build-hive-original-delivery-image.mjs
          extract-published-binary
      - uses: actions/upload-artifact@v7
        with:
          name: hive-same-source-formal-ai-binary
          path: rust/target/release/formal-ai
          retention-days: 1
    needs: admission
    env:
      HIVE_ADMISSION_SOURCE: ${{ needs.admission.outputs.source }}
      HIVE_INPUT_SHA256: ${{ needs.admission.outputs.input_hash }}
      HIVE_ISSUE1364_MODE: "true"
  image:
    name: Prepare same-source original Hive image
    needs:
      - admission
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Initialize shared delivery evidence directory
        run: >
          echo "E2E_LOG_DIR=$RUNNER_TEMP/hive-original-evidence" >>
          "$GITHUB_ENV"

          echo "HIVE_IMAGE_BUNDLE_DIR=$RUNNER_TEMP/hive-image-bundle" >> "$GITHUB_ENV"
      - name: Initialize owned admission paths after runner assignment
        env:
          HIVE_ADMISSION_SELECTION: ${{ runner.temp }}/hive-admission/selection.json
          HIVE_PUBLISHED_RUNTIME_FILE: ${{ needs.admission.outputs.published == 'true' &&
            format('{0}/hive-admission/selection.json', runner.temp) || '' }}
        run: >
          printf '%s\n' "HIVE_ADMISSION_SELECTION=$HIVE_ADMISSION_SELECTION"
          "HIVE_PUBLISHED_RUNTIME_FILE=$HIVE_PUBLISHED_RUNTIME_FILE" >>
          "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.admission.outputs.source }}
          persist-credentials: false
          clean: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .hive-protocol
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .hive-protocol/.bun-version
      - name: Install frozen trusted admission dependencies
        working-directory: .hive-protocol
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: hive-admission-selection
          path: ${{ runner.temp }}/hive-admission
      - uses: actions/checkout@v7
        with:
          repository: link-assistant/hive-mind
          ref: 8f22b87c515adece0427cb59e429531f35d7760a
          path: .hive-mind
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /.github/actions/
            /package.json
            /package-lock.json
            /Dockerfile.e2e
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: hive-same-source-formal-ai-binary
          path: rust/target/release
      - name: Free hosted image space
        working-directory: .hive-mind
        run: node scripts/free-disk-space.mjs
      - name: Install pinned Hive automation dependencies
        working-directory: .hive-mind
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Prepare reviewed Hive workflow-log transport
        run: node .hive-protocol/scripts/prepare-hive-original-delivery.mjs
      - name: Build and verify actual same-source task image
        run: node .hive-protocol/scripts/build-hive-original-delivery-image.mjs
      - name: Measure released native PID1 shutdown and live-memory fixtures
        if: ${{ needs.admission.outputs.published == 'true' }}
        timeout-minutes: 4
        run: node .hive-protocol/scripts/verify-released-server-lifecycle.mjs
      - name: Retain isolated released lifecycle observations
        if: ${{ always() && needs.admission.outputs.published == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: hive-released-lifecycle-evidence
          path: ${{ runner.temp }}/hive-original-evidence/released-lifecycle.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v7
        with:
          name: hive-same-source-task-image
          path: ${{ runner.temp }}/hive-image-bundle
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Record immutable owner coordinates before real effects
        id: owner
        env:
          HIVE_ATTEMPT_DIRECTORY: ${{ runner.temp }}/hive-owner
        run: node .hive-protocol/scripts/hive-delivery-attempt.mjs owner
      - uses: actions/upload-artifact@v7
        with:
          name: hive-real-effect-owner
          path: ${{ runner.temp }}/hive-owner/owner.json
          if-no-files-found: error
          retention-days: 90
    env:
      HIVE_ADMISSION_SOURCE: ${{ needs.admission.outputs.source }}
      HIVE_INPUT_SHA256: ${{ needs.admission.outputs.input_hash }}
      HIVE_ISSUE1364_MODE: "true"
    outputs:
      image: ${{ steps.owner.outputs.image }}
  delivery:
    name: Actual Hive ${{ matrix.tool }} original delivery
    needs:
      - admission
      - build
      - image
    runs-on: ubuntu-24.04
    # Owner 40173640886 needed 28m13s before solve; preserve its full 21m budget.
    # Temporary image-transfer debt is recorded in data/meta/ci-speed.lino.
    timeout-minutes: 55
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.admission.outputs.tools) }}
    env:
      E2E_TOOL: ${{ matrix.tool }}
      HIVE_ADMISSION_SOURCE: ${{ needs.admission.outputs.source }}
      HIVE_INPUT_SHA256: ${{ needs.admission.outputs.input_hash }}
      HIVE_ISSUE1364_MODE: "true"
      HIVE_CANONICAL_INPUT_FILE: ${{ github.workspace
        }}/.hive-protocol/data/benchmarks/issue-1364-client-replay-inputs.json
    steps:
      - name: Initialize shared delivery evidence directory
        run: >
          echo "E2E_LOG_DIR=$RUNNER_TEMP/hive-original-evidence" >>
          "$GITHUB_ENV"

          echo "HIVE_IMAGE_BUNDLE_DIR=$RUNNER_TEMP/hive-image-bundle" >> "$GITHUB_ENV"
      - name: Initialize owned admission paths after runner assignment
        env:
          HIVE_ADMISSION_SELECTION: ${{ runner.temp }}/hive-admission/selection.json
          HIVE_PUBLISHED_RUNTIME_FILE: ${{ needs.admission.outputs.published == 'true' &&
            format('{0}/hive-admission/selection.json', runner.temp) || '' }}
          HIVE_EVIDENCE_PUBLISH_DIRECTORY: ${{ runner.temp }}/hive-original-evidence/publish
          HIVE_ATTEMPT_CLAIM: ${{ runner.temp }}/hive-attempt/claim.json
        run: >
          printf '%s\n' "HIVE_ADMISSION_SELECTION=$HIVE_ADMISSION_SELECTION"
          "HIVE_PUBLISHED_RUNTIME_FILE=$HIVE_PUBLISHED_RUNTIME_FILE"
          "HIVE_EVIDENCE_PUBLISH_DIRECTORY=$HIVE_EVIDENCE_PUBLISH_DIRECTORY"
          "HIVE_ATTEMPT_CLAIM=$HIVE_ATTEMPT_CLAIM" >>
          "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.admission.outputs.source }}
          persist-credentials: false
          clean: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .hive-protocol
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .hive-protocol/.bun-version
      - name: Install frozen trusted admission dependencies
        working-directory: .hive-protocol
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: hive-admission-selection
          path: ${{ runner.temp }}/hive-admission
      - uses: actions/checkout@v7
        with:
          repository: link-assistant/hive-mind
          ref: 8f22b87c515adece0427cb59e429531f35d7760a
          path: .hive-mind
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /.github/actions/
            /package.json
            /package-lock.json
            /Dockerfile.e2e
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: hive-same-source-formal-ai-binary
          path: rust/target/release
      - name: Free hosted image space
        working-directory: .hive-mind
        run: node scripts/free-disk-space.mjs
      - name: Install pinned Hive automation dependencies
        working-directory: .hive-mind
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Prepare reviewed Hive workflow-log transport
        run: node .hive-protocol/scripts/prepare-hive-original-delivery.mjs
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: hive-same-source-task-image
          path: ${{ runner.temp }}/hive-image-bundle
      - name: Load and reverify same-run source-bound task image
        run: node .hive-protocol/scripts/build-hive-original-delivery-image.mjs load
      - name: Release transferred image archive after verified load
        run: rm -- "$HIVE_IMAGE_BUNDLE_DIR/candidate.tar.gz"
      - name: Derive exact canonical task credential scope without consuming an effect
          attempt
        id: target
        run: node .hive-protocol/scripts/hive-delivery-attempt.mjs target
      - name: Resolve optional credentials with the repository token as fallback
        id: task_token
        uses: ./.hive-protocol/.github/actions/automation-token # zizmor: ignore[self-repository] Trusted workflow_sha protocol checkout.
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID || secrets.AUTOMATION_APP_ID }}
          app-private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          automation-token: ${{ secrets.AUTOMATION_TOKEN }}
          github-token: ${{ github.token }}
          owner: ${{ steps.target.outputs.target_owner }}
          repositories: ${{ steps.target.outputs.target_name }}
          permission-actions: write
          permission-workflows: write
      - name: Read-only exact-target push and available workflow-scope preflight
        id: gh
        env:
          GH_TOKEN: ${{ steps.task_token.outputs.token }}
          HIVE_CREDENTIAL_LAYER: ${{ steps.task_token.outputs.layer }}
        run: node .hive-protocol/scripts/hive-delivery-attempt.mjs credentials
      - name: Claim one bounded client effect after fresh CI and source revalidation
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          HIVE_ATTEMPT_DIRECTORY: ${{ runner.temp }}/hive-attempt
        run: node .hive-protocol/scripts/hive-delivery-attempt.mjs claim
      - name: Persist effect claim before any task effects
        uses: actions/upload-artifact@v7
        if: ${{ steps.claim.outputs.execute == 'true' }}
        with:
          name: ${{ steps.claim.outputs.claim_name }}
          path: ${{ runner.temp }}/hive-attempt/claim.json
          if-no-files-found: error
          retention-days: 90
      - name: Install act when workflows require staging
        if: ${{ steps.claim.outputs.execute == 'true' && (steps.gh.outputs.layer ==
          'default') }}
        env:
          GH_TOKEN: ${{ steps.gh.outputs.token }}
          ACT_DIR: ${{ runner.temp }}/act
        run: >
          mkdir -p "$ACT_DIR"

          gh release download v0.2.89 --repo nektos/act --pattern act_Linux_x86_64.tar.gz --pattern checksums.txt --dir "$ACT_DIR"

          (cd "$ACT_DIR" && sha256sum --check --ignore-missing checksums.txt)

          tar -xzf "$ACT_DIR/act_Linux_x86_64.tar.gz" -C "$ACT_DIR" act

          echo "$ACT_DIR" >> "$GITHUB_PATH"
      - name: Run actual Hive solve and original assertions
        timeout-minutes: 21
        working-directory: .
        env:
          GH_TOKEN: ${{ steps.gh.outputs.token }}
          AUTOMATION_LAYER: ${{ steps.gh.outputs.layer }}
          AUTOMATION_CAN_CREATE_REPOSITORIES: ${{ steps.gh.outputs.can-create-repositories }}
          E2E_KEEP: "true"
          E2E_IMAGE: ${{ steps.claim.outputs.runtime_image }}
          FORMAL_AI_INSTALL_GRANT: workspace
        run: >
          hive_log_token="$(node -e
          'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"

          trap 'hive_log_status=$?; printf "\n::%s::\n" "$hive_log_token"; exit "$hive_log_status"' EXIT

          printf '::stop-commands::%s\n' "$hive_log_token"

          node .hive-protocol/scripts/run-issue-1364-client-replay.mjs --tool "$E2E_TOOL" --source "$HIVE_ADMISSION_SOURCE" --image "$E2E_IMAGE" --output "$E2E_LOG_DIR/issue-1364-delivery.json"
        if: ${{ steps.claim.outputs.execute == 'true' }}
      - name: Seal staged source/run evidence without granting success credit
        if: ${{ !cancelled() && steps.claim.outputs.execute == 'true' }}
        run: node .hive-protocol/scripts/lib/hive-delivery-bundle.mjs --seal-evidence
      - name: Stage actual original solve evidence for independent verification
        if: ${{ !cancelled() && steps.claim.outputs.execute == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: hive-original-${{ matrix.tool }}-staged-evidence
          path: ${{ runner.temp }}/hive-original-evidence/publish
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: false
    concurrency:
      group: hive-client-${{ needs.admission.outputs.scope }}-${{ matrix.tool }}
      cancel-in-progress: false
  verification:
    name: Independent original Hive ${{ matrix.tool }} verification
    needs:
      - admission
      - build
      - image
      - delivery
    if: ${{ !cancelled() && needs.image.result == 'success' &&
      needs.admission.outputs.execute == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.admission.outputs.tools) }}
    env:
      E2E_TOOL: ${{ matrix.tool }}
      HIVE_ADMISSION_SOURCE: ${{ needs.admission.outputs.source }}
      HIVE_INPUT_SHA256: ${{ needs.admission.outputs.input_hash }}
      HIVE_ISSUE1364_MODE: "true"
    steps:
      - name: Initialize shared delivery evidence directory
        run: echo "E2E_LOG_DIR=$RUNNER_TEMP/hive-original-evidence" >> "$GITHUB_ENV"
      - name: Initialize owned admission paths after runner assignment
        env:
          HIVE_ADMISSION_SELECTION: ${{ runner.temp }}/hive-admission/selection.json
          HIVE_PUBLISHED_RUNTIME_FILE: ${{ needs.admission.outputs.published == 'true' &&
            format('{0}/hive-admission/selection.json', runner.temp) || '' }}
          HIVE_ATTEMPT_CLAIM: ${{ runner.temp }}/hive-attempt/claim.json
        run: >
          printf '%s\n' "HIVE_ADMISSION_SELECTION=$HIVE_ADMISSION_SELECTION"
          "HIVE_PUBLISHED_RUNTIME_FILE=$HIVE_PUBLISHED_RUNTIME_FILE"
          "HIVE_ATTEMPT_CLAIM=$HIVE_ATTEMPT_CLAIM" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.admission.outputs.source }}
          persist-credentials: false
          clean: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .hive-protocol
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .hive-protocol/.bun-version
      - name: Install frozen trusted admission dependencies
        working-directory: .hive-protocol
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: hive-admission-selection
          path: ${{ runner.temp }}/hive-admission
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: hive-same-source-formal-ai-binary
          path: rust/target/release
      - name: Download immutable pre-effect client claim
        uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: hive-claim-${{ needs.admission.outputs.scope }}-${{ matrix.tool }}-${{
            needs.admission.outputs.policy_hash }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hive-attempt
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: hive-original-${{ matrix.tool }}-staged-evidence
          path: ${{ runner.temp }}/hive-original-evidence
      - name: Verify complete same-run staged source and evidence bytes
        run: node .hive-protocol/scripts/lib/hive-delivery-bundle.mjs --verify-evidence
      - uses: coursier/setup-action@648df969f41ef15fda2baba8b37f9fa3d16390a3
        if: matrix.tool == 'agent'
        with:
          apps: scala-cli
      - name: Install Rust for independent delivered-source verification
        if: matrix.tool == 'codex'
        uses: dtolnay/rust-toolchain@stable
      - name: Resolve Rust compiler for isolated output verification
        if: matrix.tool == 'codex'
        run: |
          hive_rust_compiler="$(rustup which rustc)"
          test -x "$hive_rust_compiler"
          printf '%s\n' "$(dirname "$hive_rust_compiler")" >> "$GITHUB_PATH"
      - name: Independently compile delivered source and require exactly one output line
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .hive-protocol/scripts/check-hive-original-delivery.mjs
      - name: Retain actual task links, assertions, independent stdout and failure logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: hive-original-${{ matrix.tool }}-evidence
          path: ${{ runner.temp }}/hive-original-evidence
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: false
      - name: Retain typed bounded attempt result independently of other clients
        if: ${{ !cancelled() }}
        env:
          HIVE_VERIFICATION_OUTCOME: ${{ job.status }}
          HIVE_ATTEMPT_DIRECTORY: ${{ runner.temp }}/hive-attempt-result
        run: node .hive-protocol/scripts/hive-delivery-attempt.mjs result
      - name: Upload durable typed result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: hive-result-${{ needs.admission.outputs.scope }}-${{ matrix.tool }}-${{
            needs.admission.outputs.policy_hash }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hive-attempt-result/result.json
          if-no-files-found: error
          retention-days: 90
  ledger:
    name: Persist durable Hive ${{ matrix.tool }} verification
    needs:
      - admission
      - image
      - delivery
      - verification
    if: ${{ !cancelled() && needs.image.result == 'success' &&
      needs.admission.outputs.execute == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.admission.outputs.tools) }}
    env:
      E2E_TOOL: ${{ matrix.tool }}
      HIVE_ADMISSION_SOURCE: ${{ needs.admission.outputs.source }}
      HIVE_INPUT_SHA256: ${{ needs.admission.outputs.input_hash }}
      HIVE_ISSUE1364_MODE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .hive-protocol
          persist-credentials: false
      - name: Initialize owned admission paths after runner assignment
        env:
          HIVE_ADMISSION_SELECTION: ${{ runner.temp }}/hive-admission/selection.json
          HIVE_PUBLISHED_RUNTIME_FILE: ${{ needs.admission.outputs.published == 'true' &&
            format('{0}/hive-admission/selection.json', runner.temp) || '' }}
          HIVE_ATTEMPT_CLAIM: ${{ runner.temp }}/hive-attempt/claim.json
          HIVE_ATTEMPT_RESULT: ${{ runner.temp }}/hive-attempt-result/result.json
        run: >
          printf '%s\n' "HIVE_ADMISSION_SELECTION=$HIVE_ADMISSION_SELECTION"
          "HIVE_PUBLISHED_RUNTIME_FILE=$HIVE_PUBLISHED_RUNTIME_FILE"
          "HIVE_ATTEMPT_CLAIM=$HIVE_ATTEMPT_CLAIM"
          "HIVE_ATTEMPT_RESULT=$HIVE_ATTEMPT_RESULT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .hive-protocol/.bun-version
      - name: Install frozen trusted admission dependencies
        working-directory: .hive-protocol
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: hive-admission-selection
          path: ${{ runner.temp }}/hive-admission
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: hive-claim-${{ needs.admission.outputs.scope }}-${{ matrix.tool }}-${{
            needs.admission.outputs.policy_hash }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hive-attempt
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: hive-result-${{ needs.admission.outputs.scope }}-${{ matrix.tool }}-${{
            needs.admission.outputs.policy_hash }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hive-attempt-result
      - name: Publish only a normal fast-forward child of the exact durable claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .hive-protocol/scripts/hive-delivery-attempt.mjs publish-result
  acceptance:
    name: Require all three qualified actual or explicitly reused clients
    needs:
      - admission
      - image
      - delivery
      - verification
      - ledger
    if: ${{ always() && needs.admission.outputs.admitted == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HIVE_ADMISSION_SOURCE: ${{ needs.admission.outputs.source }}
      HIVE_INPUT_SHA256: ${{ needs.admission.outputs.input_hash }}
      HIVE_ISSUE1364_MODE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .hive-protocol
          persist-credentials: false
      - name: Initialize owned admission paths after runner assignment
        env:
          HIVE_ADMISSION_SELECTION: ${{ runner.temp }}/hive-admission/selection.json
          HIVE_PUBLISHED_RUNTIME_FILE: ${{ needs.admission.outputs.published == 'true' &&
            format('{0}/hive-admission/selection.json', runner.temp) || '' }}
        run: >
          printf '%s\n' "HIVE_ADMISSION_SELECTION=$HIVE_ADMISSION_SELECTION"
          "HIVE_PUBLISHED_RUNTIME_FILE=$HIVE_PUBLISHED_RUNTIME_FILE" >>
          "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .hive-protocol/.bun-version
      - name: Install frozen trusted admission dependencies
        working-directory: .hive-protocol
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: hive-admission-selection
          path: ${{ runner.temp }}/hive-admission
      - name: Authenticate all three final independent delivery receipts
        env:
          GH_TOKEN: ${{ github.token }}
          HIVE_ATTEMPT_DIRECTORY: ${{ runner.temp }}/hive-final-acceptance
        run: node .hive-protocol/scripts/hive-delivery-attempt.mjs aggregate
      - uses: actions/upload-artifact@v7
        with:
          name: hive-three-client-acceptance
          path: ${{ runner.temp }}/hive-final-acceptance/acceptance.json
          if-no-files-found: error
          retention-days: 90
  cleanup-request:
    name: Request terminal owner cleanup beyond the workflow chain limit
    needs: [admission, image, delivery, verification, ledger, acceptance]
    if: ${{ always() && needs.admission.outputs.admitted == 'true' &&
      needs.admission.outputs.execute == 'true' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Dispatch exactly one authenticated cleanup request with the default token
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/request-owned-hive-cleanup.mjs
