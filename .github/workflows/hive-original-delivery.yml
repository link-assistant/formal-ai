name: Original Hive Mind three-client delivery
on:
  pull_request:
    branches-ignore:
      - e2e/**
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - rust/src/**
      - rust/embedded/**
      - rust/Cargo.toml
      - rust/Cargo.lock
      - scripts/*hive*
      - scripts/lib/hive-delivery-evidence.mjs
      - scripts/lib/hive-operational-evidence.mjs
      - rust/tests/web/hive-operational-evidence.test.mjs
      - data/benchmarks/hive-original-delivery-inputs.json
      - .github/workflows/hive-original-delivery.yml
      - scripts/lib/hive-delivery-bundle.mjs
      - rust/tests/web/hive-original-delivery-evidence.test.mjs
      - rust/tests/web/hive-delivery-bundle.test.mjs
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: original-hive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/formal-ai-binary
        with:
          cache-key-prefix: hive-formal-ai-ubuntu-24
      - uses: actions/upload-artifact@v7
        with:
          name: hive-same-source-formal-ai-binary
          path: rust/target/release/formal-ai
          retention-days: 1
  image:
    name: Prepare same-source original Hive image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Initialize shared delivery evidence directory
        run: |
          echo "E2E_LOG_DIR=$RUNNER_TEMP/hive-original-evidence" >> "$GITHUB_ENV"
          echo "HIVE_IMAGE_BUNDLE_DIR=$RUNNER_TEMP/hive-image-bundle" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: link-assistant/hive-mind
          ref: 8f22b87c515adece0427cb59e429531f35d7760a
          path: .hive-mind
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /.github/actions/
            /package.json
            /package-lock.json
            /Dockerfile.e2e
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: hive-same-source-formal-ai-binary
          path: rust/target/release
      - name: Free hosted image space
        working-directory: .hive-mind
        run: node scripts/free-disk-space.mjs
      - name: Install pinned Hive automation dependencies
        working-directory: .hive-mind
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Prepare reviewed Hive workflow-log transport
        run: node scripts/prepare-hive-original-delivery.mjs
      - name: Build and verify actual same-source task image
        run: node scripts/build-hive-original-delivery-image.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: hive-same-source-task-image
          path: ${{ runner.temp }}/hive-image-bundle
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  delivery:
    name: Actual Hive ${{ matrix.tool }} original delivery
    needs:
      - build
      - image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        tool:
          - claude
          - agent
          - codex
    env:
      E2E_TOOL: ${{ matrix.tool }}
    steps:
      - name: Initialize shared delivery evidence directory
        run: |
          echo "E2E_LOG_DIR=$RUNNER_TEMP/hive-original-evidence" >> "$GITHUB_ENV"
          echo "HIVE_IMAGE_BUNDLE_DIR=$RUNNER_TEMP/hive-image-bundle" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: link-assistant/hive-mind
          ref: 8f22b87c515adece0427cb59e429531f35d7760a
          path: .hive-mind
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /.github/actions/
            /package.json
            /package-lock.json
            /Dockerfile.e2e
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: hive-same-source-formal-ai-binary
          path: rust/target/release
      - name: Free hosted image space
        working-directory: .hive-mind
        run: node scripts/free-disk-space.mjs
      - name: Install pinned Hive automation dependencies
        working-directory: .hive-mind
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Prepare reviewed Hive workflow-log transport
        run: node scripts/prepare-hive-original-delivery.mjs
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: hive-same-source-task-image
          path: ${{ runner.temp }}/hive-image-bundle
      - name: Load and reverify same-run source-bound task image
        run: node scripts/build-hive-original-delivery-image.mjs load
      - name: Release transferred image archive after verified load
        run: rm -- "$HIVE_IMAGE_BUNDLE_DIR/candidate.tar.gz"
      - name: Resolve task repository credentials
        id: gh
        uses: ./.hive-mind/.github/actions/resolve-github-token
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          app-private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          token: ${{ secrets.AUTOMATION_TOKEN }}
          default-token: ${{ github.token }}
      - name: Install act when workflows require staging
        if: steps.gh.outputs.layer == 'default'
        env:
          GH_TOKEN: ${{ steps.gh.outputs.token }}
          ACT_DIR: ${{ runner.temp }}/act
        run: >
          mkdir -p "$ACT_DIR"

          gh release download v0.2.89 --repo nektos/act --pattern act_Linux_x86_64.tar.gz --pattern checksums.txt --dir "$ACT_DIR"

          (cd "$ACT_DIR" && sha256sum --check --ignore-missing checksums.txt)

          tar -xzf "$ACT_DIR/act_Linux_x86_64.tar.gz" -C "$ACT_DIR" act

          echo "$ACT_DIR" >> "$GITHUB_PATH"
      - name: Run actual Hive solve and original assertions
        timeout-minutes: 21
        working-directory: .hive-mind
        env:
          GH_TOKEN: ${{ steps.gh.outputs.token }}
          AUTOMATION_LAYER: ${{ steps.gh.outputs.layer }}
          AUTOMATION_CAN_CREATE_REPOSITORIES: ${{ steps.gh.outputs.can-create-repositories }}
          E2E_KEEP: "true"
          E2E_IMAGE: hive-e2e:candidate
          FORMAL_AI_INSTALL_GRANT: workspace
        run: >
          hive_log_token="$(node -e
          'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"

          trap 'hive_log_status=$?; printf "\n::%s::\n" "$hive_log_token"; exit "$hive_log_status"' EXIT

          printf '::stop-commands::%s\n' "$hive_log_token"

          node scripts/e2e-hello-world.mjs --tool "$E2E_TOOL" --model formal-ai --isolation branch --keep
      - name: Transfer private operational evidence to the hosted artifact owner
        if: ${{ !cancelled() }}
        run: sudo --preserve-env=GITHUB_ACTIONS "$(command -v node)"
          scripts/lib/hive-operational-evidence.mjs --transfer-ownership
          "$E2E_LOG_DIR" "$(id -u)" "$(id -g)"
      - name: Seal staged source/run evidence without granting success credit
        if: ${{ !cancelled() }}
        run: node scripts/lib/hive-delivery-bundle.mjs --seal-evidence
      - name: Stage actual original solve evidence for independent verification
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: hive-original-${{ matrix.tool }}-staged-evidence
          path: ${{ runner.temp }}/hive-original-evidence
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: false
  verification:
    name: Independent original Hive ${{ matrix.tool }} verification
    needs:
      - build
      - image
      - delivery
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        tool:
          - claude
          - agent
          - codex
    env:
      E2E_TOOL: ${{ matrix.tool }}
    steps:
      - name: Initialize shared delivery evidence directory
        run: echo "E2E_LOG_DIR=$RUNNER_TEMP/hive-original-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: hive-same-source-formal-ai-binary
          path: rust/target/release
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          name: hive-original-${{ matrix.tool }}-staged-evidence
          path: ${{ runner.temp }}/hive-original-evidence
      - name: Verify complete same-run staged source and evidence bytes
        run: node scripts/lib/hive-delivery-bundle.mjs --verify-evidence
      - uses: coursier/setup-action@648df969f41ef15fda2baba8b37f9fa3d16390a3
        if: matrix.tool == 'agent'
        with:
          apps: scala-cli
      - name: Install Rust for independent delivered-source verification
        if: matrix.tool == 'codex'
        uses: dtolnay/rust-toolchain@stable
      - name: Resolve Rust compiler for isolated output verification
        if: matrix.tool == 'codex'
        run: |
          hive_rust_compiler="$(rustup which rustc)"
          test -x "$hive_rust_compiler"
          printf '%s\n' "$(dirname "$hive_rust_compiler")" >> "$GITHUB_PATH"
      - name: Independently compile delivered source and require exactly one output line
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-hive-original-delivery.mjs
      - name: Retain actual task links, assertions, independent stdout and failure logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: hive-original-${{ matrix.tool }}-evidence
          path: ${{ runner.temp }}/hive-original-evidence
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: false
