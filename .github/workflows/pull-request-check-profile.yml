name: Pull request coverage profile
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-pr-check-profile
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record deferred production and integration coverage
        run: |
          echo '::notice::Fast Linux PR profile: production builds and heavy integrations are deferred, not passed. Production builds run only on main; heavy qualifications can be requested there.'
          printf '%s\n' 'Fast PR profile: coding, question answering and offline regression checks remain selected. Deferred production, integration and end-to-end suites receive no execution or acceptance credit. Main retains the production build and publication checks.' >> "$GITHUB_STEP_SUMMARY"
