# actionlint configuration.
#
# `macos-15-intel` and `windows-11-arm` are real GitHub-hosted runner labels
# (both became generally available in 2025) but are newer than the label list
# baked into actionlint's release binary, which reports them as unknown. They
# are declared here so the workflow linter stays free of known-false findings --
# a linter with permanent noise is a linter nobody reads (issue #812).
self-hosted-runner:
  labels:
    - macos-15-intel
    - windows-11-arm

# Issue #1076: the suppression below used to be a `-ignore` flag passed to a
# bare actionlint binary in release.yml's `lint` job. It moved here so the
# linter can run as the Docker image `rhysd/actionlint`, which is the only form
# that guarantees ShellCheck is present -- actionlint delegates every `run:`
# block check to ShellCheck and, when that binary is missing from PATH, skips
# those checks and exits 0 without saying so.
#
# It stays scoped to the one message it is about. A blanket ignore would be
# indistinguishable from not running the linter at all.
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # GitHub supports `concurrency.queue`; actionlint's embedded schema lags.
      # https://github.com/rhysd/actionlint/issues/657
      - 'unexpected key "queue" for "concurrency" section'
