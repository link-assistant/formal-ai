name: Download verified artifacts without deprecated extraction
description: Preserve strict transport digests and extract ZIP members with Python
inputs:
  name:
    description: Artifact name; omitted for ID or pattern selection
  artifact-ids:
    description: Comma-separated artifact IDs
  pattern:
    description: Artifact name pattern
  path:
    description: Extraction destination
    default: ${{ github.workspace }}
  merge-multiple:
    description: Merge selected artifacts into the destination
    default: 'false'
  github-token:
    description: Optional cross-run or cross-repository download token
  repository:
    description: Producer repository
    default: ${{ github.repository }}
  run-id:
    description: Producer workflow run
    default: ${{ github.run_id }}
outputs:
  download-path:
    description: Absolute extraction destination
    value: ${{ steps.extract.outputs.download-path }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      id: python
      with:
        update-environment: false
        python-version: '3.14'
    - name: Allocate raw archive directory
      id: temporary
      shell: bash
      run: echo "path=$(mktemp -d "$RUNNER_TEMP/artifact-archives.XXXXXX")" >> "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      env:
        NODE_OPTIONS: --throw-deprecation
      with:
        name: ${{ inputs.name }}
        artifact-ids: ${{ inputs.artifact-ids }}
        pattern: ${{ inputs.pattern }}
        github-token: ${{ inputs.github-token }}
        repository: ${{ inputs.repository }}
        run-id: ${{ inputs.run-id }}
        path: ${{ steps.temporary.outputs.path }}
        merge-multiple: false
        skip-decompress: true
        digest-mismatch: error
    - name: Extract verified archives
      id: extract
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ARTIFACT_PYTHON: ${{ steps.python.outputs.python-path }}
        ACTION_DIRECTORY: ${{ github.action_path }}
        RAW_DIRECTORY: ${{ steps.temporary.outputs.path }}
        DESTINATION: ${{ inputs.path }}
        MERGE_MULTIPLE: ${{ inputs.merge-multiple }}
        ALLOW_EMPTY_SELECTION: ${{ inputs.name == '' && inputs.artifact-ids == '' }}
      run: |
        "$ARTIFACT_PYTHON" "$ACTION_DIRECTORY/../../../scripts/extract-artifacts.py" "$RAW_DIRECTORY" "$DESTINATION" --merge-multiple "$MERGE_MULTIPLE" --allow-empty-selection "$ALLOW_EMPTY_SELECTION"
    - name: Remove temporary raw archives
      if: always() && steps.temporary.outcome == 'success'
      shell: bash
      env:
        RAW_DIRECTORY: ${{ steps.temporary.outputs.path }}
      run: rm -rf -- "$RAW_DIRECTORY"
