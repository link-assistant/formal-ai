# Runs main.rs on every push and pull request with the commands the
# change was verified with.
name: Run main.rs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: |
          rustc main.rs -o main
      - run: |
          sh tests/verify-output.sh
