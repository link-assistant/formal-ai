name: Workflows

on:
  push:
    branches:
      - main
    paths:
      - '.github/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/**'
  workflow_dispatch:

# Least-privilege default; these jobs only read the checked-out tree.
permissions:
  contents: read

# actions/checkout runs git init before a workflow step can configure Git.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-actionlint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The Docker image bundles shellcheck and pyflakes, so this also lints
      # every `run:` block. A native actionlint binary without shellcheck on
      # PATH silently skips those checks and exits 0. Reproduce locally with:
      # docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-zizmor
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Annotations work in forks where GitHub Advanced Security and code
      # scanning may not be enabled, while still making findings fail loudly.
      - uses: zizmorcore/zizmor-action@v0.6.2
        with:
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml
          inputs: .github
          min-confidence: medium
