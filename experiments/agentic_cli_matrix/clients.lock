# Pinned third-party agentic CLI clients for the issue-#671 end-to-end matrix.
#
# Every client in `formal-ai clients` must appear exactly once here — the
# `agentic_cli_matrix_covers_every_seeded_client` guard in
# `tests/unit/issue_671_matrix_coverage.rs` fails the build otherwise, so a
# client added to `data/seed/client-integrations.lino` cannot silently escape
# end-to-end coverage.
#
# Versions are pinned rather than floating so a matrix leg fails because our
# server changed, not because an upstream CLI shipped overnight. Bumping a pin
# is a deliberate commit, and the upstream-constraint assertions in
# `run_leg.sh` are what tell us when a bump lifts a documented limitation.
#
# Columns: <client-id> <installer> <spec>
#   npm      — `bun add -g <spec>`
#   npm-native — `npm install -g <spec>` on Node >= 22, for a package that
#              builds a native addon during install (bun skips those scripts,
#              and its bundled Node 20 cannot build node-pty at all)
#   pipx     — `pipx install <spec>`
#   tarball  — vendor archive pinned by version, unpacked into a prefix
#              (VS Code: no root, and `apt-get install code` needs Microsoft's
#              repository, which a stock runner does not have)
#   appimage — packaged desktop release, run under Xvfb
#   script   — vendor install script (URL)
#
# Codex is held at 0.147.0 rather than the newest 0.152.0 because
# @openai/codex@0.148.0 and later drop the ENTER that answers their first-run
# trust dialog (https://github.com/openai/codex/issues/39487, still open).
# `experiments/issue_1021_codex_tui_version/run.sh <version>` is the bisect that
# says when that pin can move; every other row here is the newest release as of
# 2026-09-01.

codex            npm       @openai/codex@0.147.0
t3code           npm-native t3@0.0.37
opencode         npm       opencode-ai@1.18.25
opencode-vscode  tarball   1.135.0
opencode-desktop appimage  1.18.25
agent            npm       @link-assistant/agent@0.26.0
cursor           script    https://cursor.com/install
gemini           npm       @google/gemini-cli@0.57.0
claude           npm       @anthropic-ai/claude-code@2.1.252
qwen             npm       @qwen-code/qwen-code@0.22.3
grok             npm       @vibe-kit/grok-cli@0.0.34
aider            pipx      aider-chat==0.86.2
