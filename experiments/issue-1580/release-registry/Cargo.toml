[package]
name = "formal-ai-release-registry-regressions"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "../../../scripts/registry.rs"

[[bin]]
name = "check-release-needed"
path = "../../../scripts/check-release-needed.rs"
test = false

[[bin]]
name = "version-and-commit"
path = "../../../scripts/version-and-commit.rs"
test = false

[dependencies]
chrono = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25.15"
ureq = "3.5.2"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
